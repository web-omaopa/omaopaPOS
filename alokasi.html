<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Manajemen Menu</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 190px; flex-shrink: 0; background: #12305C; border-right: 1px solid #0B2245; padding: 20px 14px; display: flex; flex-direction: column; }
        .sidebar .brand { font-weight: 800; font-size: 15px; color: #ffffff; margin-bottom: 18px; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; padding: 24px 28px; max-width: 760px; }
        .header-row { margin-bottom: 4px; }
        .header-row h2 { font-size: 16px; font-weight: 700; }
        .header-row p { font-size: 12px; color: #6b7280; margin-top: 2px; margin-bottom: 6px; }
        .header-outlet { font-size: 12px; color: #12305C; font-weight: 700; margin-bottom: 18px; }

        .kategori-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 1px solid #dde3ea; padding-bottom: 12px; }
        .kategori-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #dde3ea; background: #ffffff; font-size: 12px; font-weight: 700; color: #6b7280; cursor: pointer; }
        .kategori-tab.active { background: #12305C; border-color: #12305C; color: white; }

        .search-box { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; margin-bottom: 16px; outline: none; }
        .search-box:focus { border-color: #12305C; }

        .product-row { display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #dde3ea; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
        .product-row .info { flex: 1; }
        .product-row .nama { font-size: 13px; font-weight: 700; }
        .product-row .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .product-row .rencana-tag { font-size: 10px; color: #b06d09; background: #fdf1de; padding: 2px 7px; border-radius: 10px; margin-left: 6px; }

        .tipe-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; text-transform: uppercase; }
        .tipe-reset { background: #fdf1de; color: #b06d09; }
        .tipe-akumulasi { background: #e5f0f4; color: #1e6b7d; }

        .qty-input { width: 80px; height: 36px; text-align: center; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        .qty-input:focus { border-color: #12305C; outline: none; }

        .submit-btn { width: 100%; height: 42px; border: none; border-radius: 6px; background: #12305C; color: white; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 16px; }
        .submit-btn:hover { background: #0B2245; }
        .submit-btn:disabled { background: #e8c99a; cursor: not-allowed; }

        .msg-box { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; display: none; }
        .msg-error { background: #fdeaea; color: #c0392b; }
        .msg-success { background: #eaf6ea; color: #1e7d32; }

        .loading-state, .empty-state, .denied-state { text-align: center; color: #6b7280; font-size: 12px; padding: 30px 0; }

        .riwayat-item { background: #ffffff; border: 1px solid #dde3ea; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 12px; }
        .status-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .status-pending { background: #fdf1de; color: #b06d09; }
        .status-disetujui { background: #e5f4e6; color: #1e7d32; }
        .status-ditolak { background: #fdeaea; color: #c0392b; }

        .laporan-card { background: #ffffff; border: 1px solid #dde3ea; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .laporan-header { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eef1f5; }
        .laporan-header .outlet { font-size: 14px; font-weight: 700; }
        .laporan-header .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
        table.item-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
        table.item-table th { text-align: left; padding: 6px 8px; color: #6b7280; font-weight: 700; font-size: 10px; }
        table.item-table td { padding: 6px 8px; border-top: 1px solid #eef1f5; }
        .laporan-actions { display: flex; gap: 8px; }
        .btn-acc, .btn-tolak { flex: 1; height: 38px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
        .btn-acc { background: #1e7d32; color: white; }
        .btn-tolak { background: none; border: 1px solid #dde3ea; color: #c0392b; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>
        <div class="content" id="mainContent">
            <div class="loading-state">Memeriksa akses...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let daftarProduk = [];
        let kategoriAktif = "Semua";

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }

            const savedUser = sessionStorage.getItem("omaopa_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                mulaiHalaman();
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        mulaiHalaman();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        /* =====================================================
           Tampilkan pesan error query, DENGAN link yang benar-benar
           bisa diklik (bukan cuma teks biasa) kalau errornya soal
           index Firestore yang belum dibuat.
        ====================================================== */
        function tampilkanErrorQuery(container, error) {
            const urlMatch = error.message.match(/(https?:\/\/[^\s]+)/);

            let html = '<div class="empty-state" style="color:#c0392b;">Gagal memuat: ' + error.message.replace(/https?:\/\/[^\s]+/, "") + '</div>';

            if (urlMatch) {
                html += '<div class="empty-state" style="margin-top:8px;">' +
                    '<a href="' + urlMatch[1] + '" target="_blank" style="color:#12305C; font-weight:700;">' +
                    'Klik di sini untuk buat index otomatis \u2192</a></div>';
            }

            container.innerHTML = html;
        }

        function logout() {
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                window.location.href = "index.html";
            });
        }

        /* =====================================================
           TITIK MASUK: tampilan beda tergantung role yang login
        ====================================================== */
        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "alokasi");
            if (!jagaAksesHalaman(currentUser.role, "alokasi")) return;

            if (currentUser.role === "kasir") {
                tampilanKasir();
            } else {
                // admin, owner, management
                tampilanApproval();
            }
        }

        /* =====================================================================
        /* =====================================================================
           TAMPILAN: KASIR (lapor kue aktual yang diterima)
        ========================================================================= */
        function tampilanKasir() {
            document.getElementById("mainContent").innerHTML =
                '<div class="header-row">' +
                    '<h2>Manajemen Menu \u2013 Lapor Stok</h2>' +
                    '<p>Hitung fisik kue yang sampai di outlet, lalu kirim. Stok POS langsung berubah saat itu juga, dan akan dikoreksi lagi kalau admin mengedit sebelum ACC.</p>' +
                '</div>' +
                '<div class="header-outlet">\ud83d\udccd Outlet: ' + currentUser.outlet + '</div>' +
                '<div class="msg-box" id="msgBox"></div>' +
                '<div id="produkListLapor"><div class="loading-state">Memuat menu...</div></div>' +
                '<div style="margin-top:14px;">' +
                    '<label style="display:block; font-size:12px; font-weight:700; margin-bottom:6px;">Catatan (opsional)</label>' +
                    '<textarea id="catatanLapor" placeholder="Contoh: 5 Malmil Cheese datang penyok, dll." style="width:100%; min-height:64px; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:12px; font-family:inherit; resize:vertical;"></textarea>' +
                '</div>' +
                '<button class="submit-btn" id="submitBtnLapor" onclick="Kasir_kirim()" disabled>Kirim Laporan ke Admin</button>' +
                '<h3 style="font-size:13px; margin-top:26px; margin-bottom:10px;">Riwayat Laporan Saya</h3>' +
                '<div id="riwayatListLapor"><div class="loading-state">Memuat riwayat...</div></div>';

            Kasir_loadProduk();
            Kasir_loadRiwayat();
        }

        function Kasir_loadProduk() {
            db.collection("products").where("status", "==", "aktif").get().then(function (snapshot) {
                daftarProduk = [];
                snapshot.forEach(function (doc) {
                    // Topping tidak dilacak stoknya (sama seperti di Kasir), jadi tidak ikut dilaporkan
                    if (doc.data().kategori === "Topping") return;
                    daftarProduk.push(Object.assign({ id: doc.id }, doc.data()));
                });
                daftarProduk.sort(function (a, b) {
                    return (a.kategori || "").localeCompare(b.kategori || "") || a.nama.localeCompare(b.nama);
                });

                const container = document.getElementById("produkListLapor");
                container.innerHTML = daftarProduk.map(function (p) {
                    return '<div class="product-row"><div class="info"><div class="nama">' + p.nama +
                        '</div><div class="meta">' + (p.kategori || "-") + '</div></div>' +
                        '<input type="number" min="0" class="qty-input" id="qtyLapor_' + p.id + '" placeholder="0"></div>';
                }).join("");

                document.getElementById("submitBtnLapor").disabled = false;
            });
        }

        let riwayatKasirCache = [];

        function Kasir_kirim() {
            const submitBtn = document.getElementById("submitBtnLapor");

            const items = daftarProduk.map(function (p) {
                const el = document.getElementById("qtyLapor_" + p.id);
                const jumlahDiterima = el ? Number(el.value) : 0;
                return {
                    productId: p.id, nama: p.nama, resetHarian: p.resetHarian !== false,
                    jumlahDiterima: jumlahDiterima
                };
            }).filter(function (item) { return item.jumlahDiterima > 0; });

            if (items.length === 0) { tampilkanPesan("Isi minimal satu jumlah menu.", "error"); return; }

            const catatanEl = document.getElementById("catatanLapor");
            const catatan = catatanEl ? catatanEl.value.trim() : "";

            /* =====================================================
               Kalau hari ini kasir sudah pernah kirim laporan
               (dicek dari cache riwayat yang sudah dimuat), tanya
               konfirmasi dulu sebelum kirim laporan baru lagi.
            ====================================================== */
            const hariIni = new Date().toDateString();
            const sudahLaporHariIni = riwayatKasirCache.some(function (d) {
                return d.waktuLapor && d.waktuLapor.toDate().toDateString() === hariIni;
            });

            if (sudahLaporHariIni) {
                const lanjut = confirm(
                    "Anda sudah mengirim laporan stok hari ini.\n" +
                    "Yakin ingin mengirim laporan baru? Stok POS akan langsung mengikuti laporan TERBARU ini."
                );
                if (!lanjut) return;
            }

            submitBtn.disabled = true; submitBtn.textContent = "Mengirim...";

            /* =====================================================
               Stok POS langsung diupdate SEKARANG (tentatif) supaya
               kasir bisa langsung jualan sesuai fisik yang diterima,
               tidak perlu menunggu admin ACC. Baseline stok SEBELUM
               laporan ini (stokSebelumLaporan) disimpan di tiap item
               supaya nanti kalau admin edit angka & ACC, koreksinya
               dihitung dari baseline yang benar (bukan dobel-tambah).
            ====================================================== */
            const outletRef = db.collection("outlets").doc(currentUser.outlet);
            const stockRefs = items.map(function (item) { return outletRef.collection("stock").doc(item.productId); });

            Promise.all(stockRefs.map(function (ref) { return ref.get(); })).then(function (stockDocs) {
                const batch = db.batch();
                const itemsDenganBaseline = items.map(function (item, i) {
                    const isReset = item.resetHarian !== false;
                    const stokSebelum = stockDocs[i].exists ? (stockDocs[i].data().jumlah || 0) : 0;
                    const stokBaru = isReset ? item.jumlahDiterima : (stokSebelum + item.jumlahDiterima);

                    batch.set(stockRefs[i], {
                        jumlah: stokBaru,
                        minStok: stockDocs[i].exists && stockDocs[i].data().minStok !== undefined ? stockDocs[i].data().minStok : 5,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    return Object.assign({}, item, { stokSebelumLaporan: stokSebelum });
                });

                const laporanRef = db.collection("laporan_stok").doc();
                batch.set(laporanRef, {
                    outlet: currentUser.outlet, items: itemsDenganBaseline, status: "pending", catatan: catatan,
                    kasirUid: currentUser.uid, kasirNama: currentUser.nama,
                    waktuLapor: firebase.firestore.FieldValue.serverTimestamp()
                });

                return batch.commit();
            }).then(function () {
                tampilkanPesan("Laporan terkirim, stok POS langsung diperbarui. Menunggu ACC admin.", "success");
                daftarProduk.forEach(function (p) { const el = document.getElementById("qtyLapor_" + p.id); if (el) el.value = ""; });
                if (catatanEl) catatanEl.value = "";
                Kasir_loadRiwayat();
            }).catch(function (error) {
                tampilkanPesan("Gagal: " + error.message, "error");
            }).finally(function () {
                submitBtn.disabled = false; submitBtn.textContent = "Kirim Laporan ke Admin";
            });
        }

        function Kasir_loadRiwayat() {
            db.collection("laporan_stok").where("kasirUid", "==", currentUser.uid).orderBy("waktuLapor", "desc").limit(10).get()
                .then(function (snapshot) {
                    const container = document.getElementById("riwayatListLapor");

                    riwayatKasirCache = snapshot.docs.map(function (doc) { return doc.data(); });

                    if (snapshot.empty) { container.innerHTML = '<div class="empty-state">Belum ada laporan.</div>'; return; }

                    container.innerHTML = snapshot.docs.map(function (doc, i) {
                        const d = doc.data();
                        const waktu = d.waktuLapor ? d.waktuLapor.toDate().toLocaleString("id-ID") : "-";
                        const statusLabel = d.status === "pending" ? "Menunggu ACC" : (d.status === "disetujui" ? "Disetujui" : "Ditolak");

                        const detailItems = (d.items || []).map(function (item) {
                            return '<div style="display:flex; justify-content:space-between; padding:3px 0;">' +
                                '<span>' + item.nama + '</span><span style="font-weight:700;">' + item.jumlahDiterima + '</span></div>';
                        }).join("");

                        return '<div class="riwayat-item" style="cursor:pointer;" onclick="toggleRiwayatDetail(' + i + ')">' +
                            '<div style="display:flex; justify-content:space-between; margin-bottom:4px;">' +
                                '<span>' + waktu + '</span><span class="status-tag status-' + d.status + '">' + statusLabel + '</span></div>' +
                            '<div style="display:flex; justify-content:space-between; align-items:center; color:#6b7280;">' +
                                '<span>' + d.items.length + ' menu dilaporkan</span>' +
                                '<span id="riwayatChevron_' + i + '" style="color:#a89a8c; font-size:10px;">Lihat detail ▾</span>' +
                            '</div>' +
                            (d.catatan ? '<div style="color:#8a796e; margin-top:4px; font-style:italic;">📝 ' + d.catatan + '</div>' : '') +
                            '<div id="riwayatDetail_' + i + '" style="display:none; margin-top:8px; padding-top:8px; border-top:1px dashed #e8ecf1; font-size:11px;">' + detailItems + '</div>' +
                            '</div>';
                    }).join("");
                })
                .catch(function (error) {
                    tampilkanErrorQuery(document.getElementById("riwayatListLapor"), error);
                });
        }

        /* Buka/tutup rincian produk & jumlah yang dilaporkan di satu
           kartu Riwayat Laporan, tanpa perlu pindah halaman. */
        function toggleRiwayatDetail(i) {
            const detail = document.getElementById("riwayatDetail_" + i);
            const chevron = document.getElementById("riwayatChevron_" + i);
            if (!detail) return;

            const terbuka = detail.style.display === "block";
            detail.style.display = terbuka ? "none" : "block";
            if (chevron) chevron.textContent = terbuka ? "Lihat detail ▾" : "Tutup detail ▴";
        }

        /* =====================================================================
           TAMPILAN 3: ADMIN/OWNER/MANAGEMENT (approval laporan kasir)
        ========================================================================= */
        function tampilanApproval() {
            document.getElementById("mainContent").innerHTML =
                '<div class="header-row">' +
                    '<h2>Manajemen Menu \u2013 Approval</h2>' +
                    '<p>Stok POS sudah mengikuti laporan kasir ini. Edit angka kalau perlu koreksi, lalu ACC untuk mengunci sebagai stok resmi (atau Tolak untuk membatalkan &amp; kembalikan stok).</p>' +
                '</div>' +
                '<div id="approvalContainer"><div class="loading-state">Memuat...</div></div>';

            Approval_load();
        }

        function Approval_load() {
            db.collection("laporan_stok").where("status", "==", "pending").orderBy("waktuLapor", "asc").get()
                .then(function (snapshot) {
                    const container = document.getElementById("approvalContainer");
                    if (snapshot.empty) { container.innerHTML = '<div class="empty-state">Tidak ada laporan yang menunggu ACC.</div>'; return; }

                    /* =====================================================
                       Dedupe: kalau 1 outlet ada beberapa laporan pending,
                       cuma tampilkan yang PALING BARU (waktuLapor terbesar).
                       Karena query sudah orderBy waktuLapor asc, cukup timpa
                       entri per outlet setiap kali ketemu yang lebih baru.
                    ====================================================== */
                    const terbaruPerOutlet = {};
                    snapshot.docs.forEach(function (doc) {
                        const d = doc.data();
                        terbaruPerOutlet[d.outlet] = doc; // yang belakangan (lebih baru) menimpa yang lama
                    });
                    const daftarLaporan = Object.values(terbaruPerOutlet).sort(function (a, b) {
                        const ta = a.data().waktuLapor ? a.data().waktuLapor.toMillis() : 0;
                        const tb = b.data().waktuLapor ? b.data().waktuLapor.toMillis() : 0;
                        return ta - tb;
                    });

                    container.innerHTML = daftarLaporan.map(function (doc) {
                        const d = doc.data();
                        const waktu = d.waktuLapor ? d.waktuLapor.toDate().toLocaleString("id-ID") : "-";
                        return '<div class="laporan-card">' +
                            '<div class="laporan-header"><div><div class="outlet">' + d.outlet + '</div>' +
                            '<div class="meta">Dilaporkan oleh ' + d.kasirNama + ' \u00b7 ' + waktu + '</div>' +
                            (d.catatan ? '<div class="meta" style="margin-top:4px; font-style:italic;">\ud83d\udcdd ' + d.catatan + '</div>' : '') +
                            '</div></div>' +
                            '<table class="item-table"><thead><tr><th>Menu</th><th>Diterima</th><th>Tipe</th></tr></thead><tbody>' +
                            d.items.map(function (item) {
                                const isReset = item.resetHarian !== false;
                                return '<tr><td>' + item.nama + '</td>' +
                                    '<td><input type="number" min="0" class="qty-input" style="width:70px; height:32px;" id="acc_' + doc.id + '_' + item.productId + '" value="' + item.jumlahDiterima + '"></td>' +
                                    '<td><span class="tipe-badge ' + (isReset ? "tipe-reset" : "tipe-akumulasi") + '">' + (isReset ? "Reset" : "Tambah") + '</span></td></tr>';
                            }).join("") +
                            '</tbody></table>' +
                            '<div class="laporan-actions">' +
                                '<button class="btn-tolak" onclick="Approval_tolak(\'' + doc.id + '\')">Tolak</button>' +
                                '<button class="btn-acc" onclick="Approval_acc(\'' + doc.id + '\')">ACC & Update Stok</button>' +
                            '</div></div>';
                    }).join("");
                })
                .catch(function (error) {
                    tampilkanErrorQuery(document.getElementById("approvalContainer"), error);
                });
        }

        function Approval_acc(laporanId) {
            if (!confirm("ACC laporan ini? Stok outlet akan langsung terupdate.")) return;

            const laporanRef = db.collection("laporan_stok").doc(laporanId);
            laporanRef.get().then(function (doc) {
                const data = doc.data();

                /* =====================================================
                   Ambil jumlah dari input yang mungkin sudah diedit admin
                   di kartu approval (id: acc_{laporanId}_{productId}).
                   Kalau inputnya tidak ketemu (mis. sudah tertimpa render
                   lain), fallback ke nilai asli dari laporan kasir.
                ====================================================== */
                const itemsFinal = data.items.map(function (item) {
                    const el = document.getElementById("acc_" + laporanId + "_" + item.productId);
                    const jumlahEdited = el && el.value !== "" ? Number(el.value) : item.jumlahDiterima;
                    return Object.assign({}, item, { jumlahDiterima: jumlahEdited });
                });

                const outletRef = db.collection("outlets").doc(data.outlet);
                const stockRefs = itemsFinal.map(function (item) { return outletRef.collection("stock").doc(item.productId); });

                return Promise.all(stockRefs.map(function (ref) { return ref.get(); })).then(function (stockDocs) {
                    const batch = db.batch();
                    itemsFinal.forEach(function (item, i) {
                        const isReset = item.resetHarian !== false;

                        /* =====================================================
                           PENTING: baseline pakai stokSebelumLaporan (kondisi
                           stok SEBELUM laporan kasir ini diterapkan), bukan
                           stok saat ini — karena stok saat ini sudah berisi
                           angka tentatif dari kasir. Kalau dipakai stok saat
                           ini sebagai basis, tipe "akumulasi" bakal kehitung
                           dobel. Fallback ke stok saat ini kalau laporan lama
                           belum punya field stokSebelumLaporan.
                        ====================================================== */
                        const stokBaseline = item.stokSebelumLaporan !== undefined
                            ? item.stokSebelumLaporan
                            : (stockDocs[i].exists ? (stockDocs[i].data().jumlah || 0) : 0);
                        const stokSaatIni = stockDocs[i].exists ? (stockDocs[i].data().jumlah || 0) : 0;
                        const stokBaru = isReset ? item.jumlahDiterima : (stokBaseline + item.jumlahDiterima);

                        batch.set(stockRefs[i], {
                            jumlah: stokBaru,
                            minStok: stockDocs[i].exists && stockDocs[i].data().minStok !== undefined ? stockDocs[i].data().minStok : 5,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });

                        batch.set(db.collection("alokasi_log").doc(), {
                            sumber: "acc-admin", laporanId: laporanId, outlet: data.outlet,
                            productId: item.productId, namaProduk: item.nama,
                            tipe: isReset ? "reset" : "akumulasi", jumlahInput: item.jumlahDiterima,
                            stokSebelum: stokSaatIni, stokSesudah: stokBaru,
                            olehUid: currentUser.uid, olehNama: currentUser.nama,
                            waktu: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    batch.update(laporanRef, {
                        status: "disetujui", olehAdminUid: currentUser.uid, olehAdminNama: currentUser.nama,
                        items: itemsFinal,
                        waktuDiproses: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return batch.commit();
                });
            }).then(function () { Approval_load(); })
              .catch(function (error) { alert("Gagal memproses ACC: " + error.message); });
        }

        function Approval_tolak(laporanId) {
            const alasan = prompt("Alasan penolakan (opsional):", "");
            if (alasan === null) return;

            const laporanRef = db.collection("laporan_stok").doc(laporanId);

            /* =====================================================
               Karena stok POS sudah sempat diubah tentatif waktu
               kasir kirim laporan, kalau laporan ini DITOLAK maka
               stok dikembalikan ke kondisi SEBELUM laporan tadi
               (stokSebelumLaporan), supaya tidak nyangkut angka
               yang tidak pernah disetujui admin.
            ====================================================== */
            laporanRef.get().then(function (doc) {
                const data = doc.data();
                const outletRef = db.collection("outlets").doc(data.outlet);
                const batch = db.batch();

                data.items.forEach(function (item) {
                    if (item.stokSebelumLaporan === undefined) return; // laporan lama, tidak ada baseline, jangan diutak-atik
                    batch.set(outletRef.collection("stock").doc(item.productId), {
                        jumlah: item.stokSebelumLaporan,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                });

                batch.update(laporanRef, {
                    status: "ditolak", catatanAdmin: alasan || "",
                    olehAdminUid: currentUser.uid, olehAdminNama: currentUser.nama,
                    waktuDiproses: firebase.firestore.FieldValue.serverTimestamp()
                });

                return batch.commit();
            }).then(function () { Approval_load(); })
              .catch(function (error) { alert("Gagal menolak laporan: " + error.message); });
        }

        /* ===================================================================== */
        function tampilkanPesan(text, type) {
            const box = document.getElementById("msgBox");
            box.textContent = text;
            box.className = "msg-box " + (type === "error" ? "msg-error" : "msg-success");
            box.style.display = "block";
            setTimeout(function () { box.style.display = "none"; }, 5000);
        }
    </script>
