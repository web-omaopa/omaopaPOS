<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Manajemen Menu</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js?v=20261027c"></script>
    <script src="stok-batch.js?v=20261110d"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 190px; flex-shrink: 0; background: #12305C; border-right: 1px solid #0B2245; padding: 20px 14px; display: flex; flex-direction: column; }
        .sidebar .brand { font-weight: 800; font-size: 15px; color: #ffffff; margin-bottom: 18px; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; padding: 24px 28px; max-width: 760px; }
        .header-row { margin-bottom: 4px; }
        .header-row h2 { font-size: 16px; font-weight: 700; }
        .header-row p { font-size: 12px; color: #6b7280; margin-top: 2px; margin-bottom: 6px; }
        .header-outlet { font-size: 12px; color: #12305C; font-weight: 700; margin-bottom: 18px; }

        .kategori-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 1px solid #dde3ea; padding-bottom: 12px; }
        .kategori-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #dde3ea; background: #ffffff; font-size: 12px; font-weight: 700; color: #6b7280; cursor: pointer; }
        .kategori-tab.active { background: #12305C; border-color: #12305C; color: white; }

        .search-box { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; margin-bottom: 16px; outline: none; }
        .search-box:focus { border-color: #12305C; }

        .product-row { display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #dde3ea; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
        .product-row .info { flex: 1; }
        .product-row .nama { font-size: 13px; font-weight: 700; }
        .product-row .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .product-row .rencana-tag { font-size: 10px; color: #b06d09; background: #fdf1de; padding: 2px 7px; border-radius: 10px; margin-left: 6px; }

        .tipe-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; text-transform: uppercase; }
        .tipe-reset { background: #fdf1de; color: #b06d09; }
        .tipe-akumulasi { background: #e5f0f4; color: #1e6b7d; }

        .qty-input { width: 80px; height: 36px; text-align: center; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        .qty-input:focus { border-color: #12305C; outline: none; }

        .submit-btn { width: 100%; height: 42px; border: none; border-radius: 6px; background: #12305C; color: white; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 16px; }
        .submit-btn:hover { background: #0B2245; }
        .submit-btn:disabled { background: #e8c99a; cursor: not-allowed; }

        .msg-box { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; display: none; }
        .msg-error { background: #fdeaea; color: #c0392b; }
        .msg-success { background: #eaf6ea; color: #1e7d32; }

        .loading-state, .empty-state, .denied-state { text-align: center; color: #6b7280; font-size: 12px; padding: 30px 0; }

        .riwayat-item { background: #ffffff; border: 1px solid #dde3ea; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 12px; }
        .status-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .status-pending { background: #fdf1de; color: #b06d09; }
        .status-disetujui { background: #e5f4e6; color: #1e7d32; }
        .status-ditolak { background: #fdeaea; color: #c0392b; }

        .laporan-card { background: #ffffff; border: 1px solid #dde3ea; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .laporan-header { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eef1f5; }
        .laporan-header .outlet { font-size: 14px; font-weight: 700; }
        .laporan-header .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
        table.item-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
        table.item-table th { text-align: left; padding: 6px 8px; color: #6b7280; font-weight: 700; font-size: 10px; }
        table.item-table td { padding: 6px 8px; border-top: 1px solid #eef1f5; }
        .laporan-actions { display: flex; gap: 8px; }
        .btn-acc, .btn-tolak { flex: 1; height: 38px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
        .btn-acc { background: #1e7d32; color: white; }
        .btn-tolak { background: none; border: 1px solid #dde3ea; color: #c0392b; }

        /* Info stok berjalan di baris lapor */
        .sisa-info { font-size: 10.5px; margin-top: 3px; color: #52606d; }
        .sisa-info.waste { color: #b03a2e; font-weight: 700; }

        /* Waste */
        .waste-box { margin-top: 28px; }
        .waste-box h3 { font-size: 13px; margin-bottom: 4px; }
        .waste-box .sub { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
        .rusak-form { display: grid; grid-template-columns: 2fr 90px 1.4fr; gap: 8px; margin-bottom: 8px; }
        @media (max-width: 640px) { .rusak-form { grid-template-columns: 1fr; } }
        .rusak-form select, .rusak-form input, .rusak-ket { height: 36px; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 10px; font-size: 12px; font-family: inherit; width: 100%; }
        .btn-waste { height: 38px; padding: 0 16px; border: none; border-radius: 6px; background: #b03a2e; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; }
        .btn-waste:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-menunggu { background: #fdf1de; color: #b06d09; }
        .status-aktif { background: #fdeaea; color: #b03a2e; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>
        <div class="content" id="mainContent">
            <div class="loading-state">Memeriksa akses...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let daftarProduk = [];
        let kategoriAktif = "Semua";

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }

            const savedUser = sessionStorage.getItem("omaopa_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                siapkanRole(currentUser.role, mulaiHalaman);
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        siapkanRole(currentUser.role, mulaiHalaman);
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        /* =====================================================
           Tampilkan pesan error query, DENGAN link yang benar-benar
           bisa diklik (bukan cuma teks biasa) kalau errornya soal
           index Firestore yang belum dibuat.
        ====================================================== */
        function tampilkanErrorQuery(container, error) {
            const urlMatch = error.message.match(/(https?:\/\/[^\s]+)/);

            let html = '<div class="empty-state" style="color:#c0392b;">Gagal memuat: ' + error.message.replace(/https?:\/\/[^\s]+/, "") + '</div>';

            if (urlMatch) {
                html += '<div class="empty-state" style="margin-top:8px;">' +
                    '<a href="' + urlMatch[1] + '" target="_blank" style="color:#12305C; font-weight:700;">' +
                    'Klik di sini untuk buat index otomatis \u2192</a></div>';
            }

            container.innerHTML = html;
        }

        function logout() {
            // Lepas semua listener dulu supaya tidak muncul error izin setelah sign out
            if (produkUnsubscribe) { produkUnsubscribe(); produkUnsubscribe = null; }
            if (riwayatUnsubscribe) { riwayatUnsubscribe(); riwayatUnsubscribe = null; }
            if (approvalUnsubscribe) { approvalUnsubscribe(); approvalUnsubscribe = null; }
            if (stokKasirUnsubscribe) { stokKasirUnsubscribe(); stokKasirUnsubscribe = null; }
            if (rusakUnsubscribe) { rusakUnsubscribe(); rusakUnsubscribe = null; }
            if (rusakApprovalUnsubscribe) { rusakApprovalUnsubscribe(); rusakApprovalUnsubscribe = null; }
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                window.location.href = "index.html";
            });
        }

        /* =====================================================
           TITIK MASUK: tampilan beda tergantung role yang login
        ====================================================== */
        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "alokasi");
            if (!jagaAksesHalaman(currentUser.role, "alokasi")) return;

            if (currentUser.role === "kasir") {
                tampilanKasir();
            } else {
                // admin, owner, management
                tampilanApproval();
            }
        }

        /* =====================================================================
        /* =====================================================================
           TAMPILAN: KASIR (lapor kue aktual yang diterima)
        ========================================================================= */
        function tampilanKasir() {
            document.getElementById("mainContent").innerHTML =
                '<div class="header-row">' +
                    '<h2>Manajemen Menu \u2013 Lapor Stok</h2>' +
                    '<p>Hitung fisik kue yang sampai di outlet, lalu kirim. Stok POS langsung berubah saat itu juga, dan akan dikoreksi lagi kalau admin mengedit sebelum ACC.</p>' +
                '</div>' +
                '<div class="header-outlet">\ud83d\udccd Outlet: ' + escapeHtmlAman(currentUser.outlet) + '</div>' +
                '<div class="msg-box" id="msgBox"></div>' +
                '<div id="produkListLapor"><div class="loading-state">Memuat menu...</div></div>' +
                '<div style="margin-top:14px;">' +
                    '<label style="display:block; font-size:12px; font-weight:700; margin-bottom:6px;">Catatan (opsional)</label>' +
                    '<textarea id="catatanLapor" placeholder="Contoh: 5 Malmil Cheese datang penyok, dll." style="width:100%; min-height:64px; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:12px; font-family:inherit; resize:vertical;"></textarea>' +
                '</div>' +
                '<button class="submit-btn" id="submitBtnLapor" onclick="Kasir_kirim()" disabled>Kirim Laporan ke Admin</button>' +
                '<h3 style="font-size:13px; margin-top:26px; margin-bottom:10px;">Riwayat Laporan Saya</h3>' +
                '<div id="riwayatListLapor"><div class="loading-state">Memuat riwayat...</div></div>' +
                '<div class="waste-box" id="rusakBox"></div>';

            Kasir_loadProduk();
            Kasir_dengarkanStok();
            Kasir_loadRiwayat();
            Rusak_tampilKasir();
        }

        /* =====================================================
           Listener realtime (onSnapshot). Selalu unsubscribe dulu
           sebelum pasang ulang supaya listener tidak menumpuk.
        ====================================================== */
        let produkUnsubscribe = null;
        let riwayatUnsubscribe = null;
        let approvalUnsubscribe = null;

        /* =====================================================
           Simpan angka yang sedang diketik user di dalam container
           (+ input mana yang sedang fokus), supaya saat listener
           me-render ulang, ketikan user tidak hilang.
           hanyaYangDiubah = true: cuma simpan input yang nilainya
           beda dari nilai awal (dipakai di kartu approval admin).
        ====================================================== */
        function simpanNilaiInput(container, hanyaYangDiubah) {
            const nilai = {};
            if (!container) return { nilai: nilai, fokusId: null };
            Array.prototype.forEach.call(container.querySelectorAll("input[id]"), function (el) {
                if (hanyaYangDiubah ? el.value !== el.defaultValue : el.value !== "") nilai[el.id] = el.value;
            });
            const aktif = document.activeElement;
            const fokusId = aktif && aktif.id && container.contains(aktif) ? aktif.id : null;
            return { nilai: nilai, fokusId: fokusId };
        }

        function kembalikanNilaiInput(state) {
            Object.keys(state.nilai).forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.value = state.nilai[id];
            });
            if (state.fokusId) {
                const elFokus = document.getElementById(state.fokusId);
                if (elFokus) elFokus.focus({ preventScroll: true });
            }
        }

        function Kasir_loadProduk() {
            if (produkUnsubscribe) { produkUnsubscribe(); produkUnsubscribe = null; }

            produkUnsubscribe = db.collection("products").where("status", "==", "aktif").onSnapshot(function (snapshot) {
                daftarProduk = [];
                snapshot.forEach(function (doc) {
                    // Topping tidak dilacak stoknya (sama seperti di Kasir), jadi tidak ikut dilaporkan
                    if (doc.data().kategori === "Topping") return;
                    daftarProduk.push(Object.assign({ id: doc.id }, doc.data()));
                });
                daftarProduk.sort(function (a, b) {
                    return (a.kategori || "").localeCompare(b.kategori || "") || a.nama.localeCompare(b.nama);
                });

                const container = document.getElementById("produkListLapor");
                if (!container) return;
                const stateInput = simpanNilaiInput(container, false);

                container.innerHTML = daftarProduk.map(function (p) {
                    const isReset = p.resetHarian !== false;
                    return '<div class="product-row"><div class="info"><div class="nama">' + escapeHtmlAman(p.nama) +
                        '<span class="tipe-badge ' + (isReset ? "tipe-reset" : "tipe-akumulasi") + '">' + (isReset ? "Reset" : "Tambah") + '</span>' +
                        '</div><div class="meta">' + escapeHtmlAman(p.kategori || "-") + '</div>' +
                        '<div class="sisa-info" id="sisaLapor_' + p.id + '"></div></div>' +
                        '<input type="number" min="0" class="qty-input" id="qtyLapor_' + p.id + '" placeholder="0"></div>';
                }).join("");

                kembalikanNilaiInput(stateInput);
                Kasir_tampilSisa();
                Rusak_isiPilihanProduk();

                const submitBtn = document.getElementById("submitBtnLapor");
                // Jangan aktifkan tombol kalau laporan sedang dikirim
                if (submitBtn && submitBtn.textContent !== "Mengirim...") submitBtn.disabled = false;
            }, function (error) {
                tampilkanErrorQuery(document.getElementById("produkListLapor"), error);
            });
        }

        let riwayatKasirCache = [];

        function Kasir_kirim() {
            const submitBtn = document.getElementById("submitBtnLapor");

            const items = daftarProduk.map(function (p) {
                const el = document.getElementById("qtyLapor_" + p.id);
                const jumlahDiterima = el ? Number(el.value) : 0;
                return {
                    productId: p.id, nama: p.nama, resetHarian: p.resetHarian !== false,
                    jumlahDiterima: jumlahDiterima
                };
            }).filter(function (item) { return item.jumlahDiterima > 0; });

            if (items.length === 0) { tampilkanPesan("Isi minimal satu jumlah menu.", "error"); return; }

            const catatanEl = document.getElementById("catatanLapor");
            const catatan = catatanEl ? catatanEl.value.trim() : "";

            /* =====================================================
               Kalau hari ini kasir sudah pernah kirim laporan
               (dicek dari cache riwayat yang sudah dimuat), tanya
               konfirmasi dulu sebelum kirim laporan baru lagi.
            ====================================================== */
            const hariIni = new Date().toDateString();
            const sudahLaporHariIni = riwayatKasirCache.some(function (d) {
                return d.waktuLapor && d.waktuLapor.toDate().toDateString() === hariIni;
            });

            if (sudahLaporHariIni) {
                const lanjut = confirm(
                    "Anda sudah mengirim laporan stok hari ini.\n" +
                    "Yakin ingin mengirim laporan baru? Stok POS akan langsung mengikuti laporan TERBARU ini."
                );
                if (!lanjut) return;
            }

            submitBtn.disabled = true; submitBtn.textContent = "Mengirim...";

            /* =====================================================
               Stok POS langsung diupdate SEKARANG (tentatif) supaya
               kasir bisa langsung jualan sesuai fisik yang diterima,
               tidak perlu menunggu admin ACC.
               Stok disimpan per batch (stok-batch.js):
               - Reset: sisa batch dari HARI SEBELUMNYA dicatat sebagai
                 waste; batch hari ini yang sudah dilapor diganti (koreksi).
                 Stok jadi tepat angka laporan ini.
               - Akumulasi: laporan ini jadi batch baru di atas stok lama.
               - Batch yang sudah kedaluwarsa sekalian jadi waste.
               Batch & waste sebelum laporan disimpan di item laporan supaya
               admin bisa koreksi (ACC) atau membatalkan (Tolak).
            ====================================================== */
            const outletRef = db.collection("outlets").doc(currentUser.outlet);
            const stockRefs = items.map(function (item) { return outletRef.collection("stock").doc(item.productId); });
            const laporanRef = db.collection("laporan_stok").doc();

            Promise.all(stockRefs.map(function (ref) { return ref.get(); })).then(function (stockDocs) {
                const batch = db.batch();
                const nowMs = Date.now();
                const hariIni = sbTanggalIso(nowMs);
                const itemsDenganBaseline = items.map(function (item, i) {
                    const produk = daftarProduk.find(function (p) { return p.id === item.productId; }) || {};
                    const isReset = item.resetHarian !== false;
                    const info = { outlet: currentUser.outlet, productId: item.productId, nama: item.nama,
                        laporanId: laporanRef.id, olehUid: currentUser.uid, olehNama: currentUser.nama };
                    const pisah = sbPisah(sbNormalkan(sbBatch(stockDocs[i].exists ? stockDocs[i].data() : null, nowMs), produk), nowMs);
                    const wasteIds = [];
                    const catatWaste = function (b, alasan) {
                        const ref = db.collection("waste_stok").doc();
                        batch.set(ref, sbDataWaste(info, b, alasan, nowMs));
                        if (alasan === "diganti_lapor") wasteIds.push(ref.id);
                    };
                    pisah.basi.forEach(function (b) { catatWaste(b, "kedaluwarsa"); });

                    const batchBaru = { qty: item.jumlahDiterima, masukMs: nowMs, kedaluwarsaMs: sbKedaluwarsa(produk, nowMs), laporanId: laporanRef.id };
                    let hasil;
                    if (isReset) {
                        pisah.aktif.forEach(function (b) {
                            if (sbTanggalIso(b.masukMs) !== hariIni) catatWaste(b, "diganti_lapor");
                        });
                        hasil = [batchBaru];
                    } else {
                        hasil = pisah.aktif.concat([batchBaru]);
                    }

                    batch.set(stockRefs[i], Object.assign(sbDataStok(hasil, nowMs), {
                        minStok: stockDocs[i].exists && stockDocs[i].data().minStok !== undefined ? stockDocs[i].data().minStok : 5
                    }), { merge: true });

                    return Object.assign({}, item, {
                        stokSebelumLaporan: sbTotal(pisah.aktif),
                        batchSebelum: isReset ? pisah.aktif : [],
                        wasteIds: wasteIds,
                        masukMs: nowMs, kedaluwarsaMs: batchBaru.kedaluwarsaMs
                    });
                });

                batch.set(laporanRef, {
                    outlet: currentUser.outlet, items: itemsDenganBaseline, status: "pending", catatan: catatan,
                    kasirUid: currentUser.uid, kasirNama: currentUser.nama,
                    waktuLapor: firebase.firestore.FieldValue.serverTimestamp()
                });

                return batch.commit();
            }).then(function () {
                tampilkanPesan("Laporan terkirim, stok POS langsung diperbarui. Menunggu ACC admin.", "success");
                daftarProduk.forEach(function (p) { const el = document.getElementById("qtyLapor_" + p.id); if (el) el.value = ""; });
                if (catatanEl) catatanEl.value = "";
                // Riwayat tidak perlu dimuat ulang: listener Kasir_loadRiwayat otomatis menampilkan laporan baru
            }).catch(function (error) {
                tampilkanPesan("Gagal: " + error.message, "error");
            }).finally(function () {
                submitBtn.disabled = false; submitBtn.textContent = "Kirim Laporan ke Admin";
            });
        }

        // Kartu riwayat yang sedang dibuka (per id dokumen), supaya tetap terbuka saat listener render ulang
        const riwayatTerbuka = {};

        function Kasir_loadRiwayat() {
            if (riwayatUnsubscribe) { riwayatUnsubscribe(); riwayatUnsubscribe = null; }

            riwayatUnsubscribe = db.collection("laporan_stok").where("kasirUid", "==", currentUser.uid).orderBy("waktuLapor", "desc").limit(10)
                .onSnapshot(function (snapshot) {
                    const container = document.getElementById("riwayatListLapor");
                    if (!container) return;

                    // "estimate": laporan yang baru dikirim langsung punya waktu perkiraan (bukan null) sebelum server konfirmasi
                    riwayatKasirCache = snapshot.docs.map(function (doc) { return doc.data({ serverTimestamps: "estimate" }); });

                    if (snapshot.empty) { container.innerHTML = '<div class="empty-state">Belum ada laporan.</div>'; return; }

                    container.innerHTML = snapshot.docs.map(function (doc) {
                        const d = doc.data({ serverTimestamps: "estimate" });

                                '<span>' + escapeHtmlAman(item.nama) + '</span><span style="font-weight:700;">' + item.jumlahDiterima + '</span></div>';
                        }).join("");

                        return '<div class="riwayat-item" style="cursor:pointer;" onclick="toggleRiwayatDetail(\'' + i + '\')">' +
                            '<div style="display:flex; justify-content:space-between; margin-bottom:4px;">' +
                                '<span>' + waktu + '</span><span class="status-tag status-' + d.status + '">' + statusLabel + '</span></div>' +
                            '<div style="display:flex; justify-content:space-between; align-items:center; color:#6b7280;">' +
                                '<span>' + d.items.length + ' menu dilaporkan</span>' +
                                '<span id="riwayatChevron_' + i + '" style="color:#a89a8c; font-size:10px;">' + (terbuka ? "Tutup detail ▴" : "Lihat detail ▾") + '</span>' +
                            '</div>' +
                            (d.catatan ? '<div style="color:#8a796e; margin-top:4px; font-style:italic;">📝 ' + d.catatan + '</div>' : '') +
                            '<div id="riwayatDetail_' + i + '" style="display:' + (terbuka ? "block" : "none") + '; margin-top:8px; padding-top:8px; border-top:1px dashed #e8ecf1; font-size:11px;">' + detailItems + '</div>' +
                            '</div>';

        /* Buka/tutup rincian produk & jumlah yang dilaporkan di satu
           kartu Riwayat Laporan, tanpa perlu pindah halaman. */
        function toggleRiwayatDetail(i) {
            const detail = document.getElementById("riwayatDetail_" + i);

        /* =====================================================================
           TAMPILAN 3: ADMIN/OWNER/MANAGEMENT (approval laporan kasir)
        ========================================================================= */
        function tampilanApproval() {
            document.getElementById("mainContent").innerHTML =
                '<div class="header-row">' +
                    '<h2>Manajemen Menu \u2013 Approval</h2>' +
                    '<p>Stok POS sudah mengikuti laporan kasir ini. Edit angka kalau perlu koreksi, lalu ACC untuk mengunci sebagai stok resmi (atau Tolak untuk membatalkan &amp; kembalikan stok).</p>' +
                '</div>' +
                '<div id="approvalContainer"><div class="loading-state">Memuat...</div></div>' +
                '<div class="waste-box" id="rusakApprovalBox"></div>' +
                '<div class="hint-text" style="font-size:11px; color:#6b7280; margin-top:18px;">Data waste lengkap (per menu, outlet, alasan + download Excel/PDF) ada di <a href="laporan.html" style="color:#12305C; font-weight:700;">Laporan \u203a Waste</a>.</div>';

            Approval_load();
            Rusak_loadApproval();
        }

        function Approval_load() {
            if (approvalUnsubscribe) { approvalUnsubscribe(); approvalUnsubscribe = null; }

            approvalUnsubscribe = db.collection("laporan_stok").where("status", "==", "pending").orderBy("waktuLapor", "asc")
                .onSnapshot(function (snapshot) {
                    const container = document.getElementById("approvalContainer");
                    if (!container) return;
                    // Angka yang sudah diedit admin (tapi belum ACC) tidak boleh tertimpa saat ada laporan baru masuk
                    const stateInput = simpanNilaiInput(container, true);

                    if (snapshot.empty) { container.innerHTML = '<div class="empty-state">Tidak ada laporan yang menunggu ACC.</div>'; return; }

                    /* =====================================================
                       Dedupe: kalau 1 outlet ada beberapa laporan pending,
                       cuma tampilkan yang PALING BARU (waktuLapor terbesar).
                       Karena query sudah orderBy waktuLapor asc, cukup timpa
                       entri per outlet setiap kali ketemu yang lebih baru.
                    ====================================================== */
                    const terbaruPerOutlet = {};
                    snapshot.docs.forEach(function (doc) {
                        const d = doc.data();
                        terbaruPerOutlet[d.outlet] = doc; // yang belakangan (lebih baru) menimpa yang lama
                    });
                    const daftarLaporan = Object.values(terbaruPerOutlet).sort(function (a, b) {
                        const ta = a.data().waktuLapor ? a.data().waktuLapor.toMillis() : 0;
                        const tb = b.data().waktuLapor ? b.data().waktuLapor.toMillis() : 0;
                        return ta - tb;
                    });

                    container.innerHTML = daftarLaporan.map(function (doc) {
                        const d = doc.data();
                        const waktu = d.waktuLapor ? d.waktuLapor.toDate().toLocaleString("id-ID") : "-";
                        return '<div class="laporan-card">' +
                            '<div class="laporan-header"><div><div class="outlet">' + escapeHtmlAman(d.outlet) + '</div>' +
                            '<div class="meta">Dilaporkan oleh ' + escapeHtmlAman(d.kasirNama) + ' \u00b7 ' + waktu + '</div>' +
                            (d.catatan ? '<div class="meta" style="margin-top:4px; font-style:italic;">\ud83d\udcdd ' + escapeHtmlAman(d.catatan) + '</div>' : '') +
                            '</div></div>' +
                            '<table class="item-table"><thead><tr><th>Menu</th><th>Diterima</th><th>Tipe</th></tr></thead><tbody>' +
                            d.items.map(function (item) {
                                const isReset = item.resetHarian !== false;
                                return '<tr><td>' + escapeHtmlAman(item.nama) + '</td>' +
                                    '<td><input type="number" min="0" class="qty-input" style="width:70px; height:32px;" id="acc_' + doc.id + '_' + item.productId + '" value="' + item.jumlahDiterima + '"></td>' +
                                    '<td><span class="tipe-badge ' + (isReset ? "tipe-reset" : "tipe-akumulasi") + '">' + (isReset ? "Reset" : "Tambah") + '</span></td></tr>';
                            }).join("") +
                            '</tbody></table>' +
                            '<div class="laporan-actions">' +
                                '<button class="btn-tolak" onclick="Approval_tolak(\'' + doc.id + '\')">Tolak</button>' +
                                '<button class="btn-acc" onclick="Approval_acc(\'' + doc.id + '\')">ACC & Update Stok</button>' +
                            '</div></div>';
                    }).join("");

                    kembalikanNilaiInput(stateInput);
                }, function (error) {
                    tampilkanErrorQuery(document.getElementById("approvalContainer"), error);
                });
        }

        function Approval_acc(laporanId) {
            if (!confirm("ACC laporan ini? Stok outlet akan langsung terupdate.")) return;

            const laporanRef = db.collection("laporan_stok").doc(laporanId);
            laporanRef.get().then(function (doc) {
                const data = doc.data();

                /* =====================================================
                   Ambil jumlah dari input yang mungkin sudah diedit admin
                   di kartu approval (id: acc_{laporanId}_{productId}).
                   Kalau inputnya tidak ketemu (mis. sudah tertimpa render
                   lain), fallback ke nilai asli dari laporan kasir.
                ====================================================== */
                const itemsFinal = data.items.map(function (item) {
                    const el = document.getElementById("acc_" + laporanId + "_" + item.productId);
                    const jumlahEdited = el && el.value !== "" ? Number(el.value) : item.jumlahDiterima;
                    return Object.assign({}, item, { jumlahDiterima: jumlahEdited });
                });

                const outletRef = db.collection("outlets").doc(data.outlet);
                const stockRefs = itemsFinal.map(function (item) { return outletRef.collection("stock").doc(item.productId); });

                return Promise.all(stockRefs.map(function (ref) { return ref.get(); })).then(function (stockDocs) {
                    const batch = db.batch();
                    const nowMs = Date.now();
                    itemsFinal.forEach(function (item, i) {
                        const isReset = item.resetHarian !== false;
                        const dataStok = stockDocs[i].exists ? stockDocs[i].data() : null;
                        const stokSaatIni = dataStok ? sbTersedia(dataStok, nowMs) : 0;
                        const asli = data.items[i].jumlahDiterima;
                        let daftarBatch;

                        if (item.masukMs !== undefined) {
                            /* Laporan format batch: koreksi admin hanya mengubah batch
                               laporan ini sebesar selisihnya, jadi penjualan yang sudah
                               terjadi sejak laporan dikirim tidak ikut terhapus. */
                            const selisih = item.jumlahDiterima - asli;
                            daftarBatch = sbBatch(dataStok, nowMs);
                            const idx = daftarBatch.findIndex(function (b) { return b.laporanId === laporanId; });
                            if (idx !== -1) {
                                daftarBatch[idx].qty = Math.max(0, daftarBatch[idx].qty + selisih);
                            } else if (selisih > 0) {
                                daftarBatch.push({ qty: selisih, masukMs: item.masukMs, kedaluwarsaMs: item.kedaluwarsaMs, laporanId: laporanId });
                            }
                        } else {
                            /* Laporan lama (dikirim sebelum stok per batch): rumus lama
                               dari stokSebelumLaporan, lalu disimpan sebagai satu batch. */
                            const stokBaseline = item.stokSebelumLaporan !== undefined ? item.stokSebelumLaporan : stokSaatIni;
                            const stokLama = isReset ? item.jumlahDiterima : (stokBaseline + item.jumlahDiterima);
                            daftarBatch = stokLama > 0 ? [{ qty: stokLama, masukMs: nowMs, kedaluwarsaMs: null, laporanId: laporanId }] : [];
                        }
                        const dataBaru = sbDataStok(daftarBatch, nowMs);

                        batch.set(stockRefs[i], Object.assign(dataBaru, {
                            minStok: dataStok && dataStok.minStok !== undefined ? dataStok.minStok : 5
                        }), { merge: true });

                        batch.set(db.collection("alokasi_log").doc(), {
                            sumber: "acc-admin", laporanId: laporanId, outlet: data.outlet,
                            productId: item.productId, namaProduk: item.nama,
                            tipe: isReset ? "reset" : "akumulasi", jumlahInput: item.jumlahDiterima,
                            stokSebelum: stokSaatIni, stokSesudah: dataBaru.jumlah,
                            olehUid: currentUser.uid, olehNama: currentUser.nama,
                            waktu: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    batch.update(laporanRef, {
                        status: "disetujui", olehAdminUid: currentUser.uid, olehAdminNama: currentUser.nama,
                        items: itemsFinal,
                        waktuDiproses: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return batch.commit();
                });
            }).then(function () { /* daftar approval otomatis diperbarui oleh listener Approval_load */ })
              .catch(function (error) { alert("Gagal memproses ACC: " + error.message); });
        }

        function Approval_tolak(laporanId) {
            const alasan = prompt("Alasan penolakan (opsional):", "");
            if (alasan === null) return;

            const laporanRef = db.collection("laporan_stok").doc(laporanId);

            /* =====================================================
               Karena stok POS sudah sempat diubah tentatif waktu
               kasir kirim laporan, kalau laporan ini DITOLAK maka
               batch dari laporan ini dibuang, batch lama yang tadi
               diganti (kue reset) dikembalikan, dan waste "sisa saat
               lapor" dari laporan ini dibatalkan. Penjualan yang
               sudah terjadi dari batch lama tetap terhitung.
            ====================================================== */
            laporanRef.get().then(function (doc) {
                const data = doc.data();
                const outletRef = db.collection("outlets").doc(data.outlet);
                const stockRefs = data.items.map(function (item) { return outletRef.collection("stock").doc(item.productId); });

                return Promise.all(stockRefs.map(function (ref) { return ref.get(); })).then(function (stockDocs) {
                    const batch = db.batch();
                    const nowMs = Date.now();

                    data.items.forEach(function (item, i) {
                        if (item.masukMs !== undefined) {
                            const dataStok = stockDocs[i].exists ? stockDocs[i].data() : null;
                            const daftarBatch = sbBatch(dataStok, nowMs)
                                .filter(function (b) { return b.laporanId !== laporanId; })
                                .concat(item.batchSebelum || [])
                                .sort(function (a, b) { return a.masukMs - b.masukMs; });
                            batch.set(stockRefs[i], sbDataStok(daftarBatch, nowMs), { merge: true });
                            (item.wasteIds || []).forEach(function (id) {
                                batch.update(db.collection("waste_stok").doc(id), {
                                    status: "batal", dibatalkanKarena: "laporan stok ditolak",
                                    waktuBatal: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            });
                            return;
                        }
                        // Laporan lama: kembalikan ke stok sebelum laporan sebagai satu batch
                        if (item.stokSebelumLaporan === undefined) return; // tidak ada baseline, jangan diutak-atik
                        const lama = item.stokSebelumLaporan > 0
                            ? [{ qty: item.stokSebelumLaporan, masukMs: nowMs, kedaluwarsaMs: null, laporanId: null }] : [];
                        batch.set(stockRefs[i], sbDataStok(lama, nowMs), { merge: true });
                    });

                    batch.update(laporanRef, {
                        status: "ditolak", catatanAdmin: alasan || "",
                        olehAdminUid: currentUser.uid, olehAdminNama: currentUser.nama,
                        waktuDiproses: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    return batch.commit();
                });
            }).then(function () { /* daftar approval otomatis diperbarui oleh listener Approval_load */ })
              .catch(function (error) { alert("Gagal menolak laporan: " + error.message); });
        }

        /* =====================================================================
           STOK BERJALAN DI FORM LAPOR (kasir)
           Menampilkan sisa stok tiap menu supaya kasir tahu apa yang terjadi
           saat lapor: sisa kue reset dari hari sebelumnya jadi waste.
        ========================================================================= */
        let stokKasirUnsubscribe = null;
        let stokKasirData = {};

        function Kasir_dengarkanStok() {
            if (stokKasirUnsubscribe) { stokKasirUnsubscribe(); stokKasirUnsubscribe = null; }
            stokKasirUnsubscribe = db.collection("outlets").doc(currentUser.outlet).collection("stock").onSnapshot(function (snap) {
                stokKasirData = {};
                snap.forEach(function (doc) { stokKasirData[doc.id] = doc.data(); });
                Kasir_tampilSisa();
                Rusak_isiPilihanProduk();
            }, function () { /* info tambahan saja */ });
        }

        function Kasir_tampilSisa() {
            const nowMs = Date.now();
            const hariIni = sbTanggalIso(nowMs);
            daftarProduk.forEach(function (p) {
                const el = document.getElementById("sisaLapor_" + p.id);
                if (!el) return;
                const pisah = sbPisah(sbNormalkan(sbBatch(stokKasirData[p.id], nowMs), p), nowMs);
                const total = sbTotal(pisah.aktif);
                const isReset = p.resetHarian !== false;
                el.className = "sisa-info";
                if (isReset) {
                    const sisaLama = sbTotal(pisah.aktif.filter(function (b) { return sbTanggalIso(b.masukMs) !== hariIni; }));
                    const jr = sbJamReset(p);
                    const teksJam = function (ms) {
                        const d = new Date(ms);
                        return (sbTanggalIso(ms) !== hariIni ? "besok " : "") + ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2);
                    };
                    const batasBerlaku = pisah.aktif.reduce(function (m, b) { return b.kedaluwarsaMs && b.kedaluwarsaMs > m ? b.kedaluwarsaMs : m; }, 0);
                    if (sisaLama > 0) {
                        el.className = "sisa-info waste";
                        el.textContent = "Sisa kemarin " + sisaLama + " \u2192 jadi waste saat lapor";
                    } else if (total > 0) {
                        el.textContent = "Sudah dilapor hari ini: " + total + (batasBerlaku ? " \u00b7 berlaku s/d " + teksJam(batasBerlaku) : "") + " (lapor lagi = koreksi)";
                    } else {
                        el.textContent = "Belum ada stok \u2013 " + (jr
                            ? "berlaku sampai jam " + ("0" + jr.jam).slice(-2) + "." + ("0" + jr.menit).slice(-2)
                            : "berlaku 24 jam sejak dilapor");
                    }
                } else {
                    const hari = Number(p.masaTahanHari) || 0;
                    el.textContent = "Stok sekarang " + total + (hari > 0 ? " · tahan " + hari + " hari" : " · tanpa batas hari");
                }
            });
        }

        /* =====================================================================
           WASTE SEBELUM WAKTUNYA (rusak, jatuh, dll)
           Kasir melapor -> stok langsung disisihkan supaya tidak terjual,
           status "menunggu". Admin ACC -> tercatat sebagai waste; Tolak ->
           stok dikembalikan ke batch asalnya.
        ========================================================================= */
        let rusakUnsubscribe = null;
        let rusakApprovalUnsubscribe = null;

        function Rusak_tampilKasir() {
            const box = document.getElementById("rusakBox");
            if (!box) return;
            box.innerHTML =
                '<h3>Lapor Kue Rusak / Waste</h3>' +
                '<div class="sub">Untuk kue yang tidak bisa dijual sebelum waktunya (rusak, jatuh, basi). Stok langsung disisihkan dari Kasir, lalu menunggu ACC admin.</div>' +
                '<div class="rusak-form">' +
                    '<select id="rusakProduk"><option value="">Pilih menu...</option></select>' +
                    '<input type="number" id="rusakQty" min="1" placeholder="Qty">' +
                    '<select id="rusakJenis" onchange="Rusak_aturLainnya()">' + SB_JENIS_RUSAK.map(function (j) { return '<option>' + escapeHtmlAman(j) + '</option>'; }).join("") + '</select>' +
                '</div>' +
                '<input type="text" class="rusak-ket" id="rusakJenisLain" maxlength="60" placeholder="Tulis alasannya (wajib), contoh: semut" style="display:none; margin-bottom:8px;">' +
                '<input type="text" class="rusak-ket" id="rusakKet" maxlength="120" placeholder="Keterangan (wajib), contoh: 2 kue jatuh saat dipindah ke etalase">' +
                '<div class="msg-box" id="rusakMsg" style="margin-top:8px; margin-bottom:0;"></div>' +
                '<button class="btn-waste" id="btnRusak" onclick="Rusak_kirim()">Kirim Laporan Waste ke Admin</button>' +
                '<h3 style="margin-top:20px;">Laporan Waste Saya</h3>' +
                '<div id="rusakRiwayat"><div class="loading-state">Memuat...</div></div>';
            Rusak_isiPilihanProduk();
            Rusak_loadRiwayatKasir();
        }

        // Pilihan "Lainnya": kasir menulis alasannya sendiri
        function Rusak_aturLainnya() {
            const lain = document.getElementById("rusakJenis").value === "Lainnya";
            const el = document.getElementById("rusakJenisLain");
            el.style.display = lain ? "block" : "none";
            if (lain) el.focus();
        }

        function Rusak_isiPilihanProduk() {
            const sel = document.getElementById("rusakProduk");
            if (!sel) return;
            const dipilih = sel.value;
            const nowMs = Date.now();
            sel.innerHTML = '<option value="">Pilih menu...</option>' + daftarProduk.map(function (p) {
                const stok = sbTersedia(stokKasirData[p.id], nowMs);
                return '<option value="' + escapeHtmlAman(p.id) + '"' + (stok <= 0 ? ' disabled' : '') + '>' +
                    escapeHtmlAman(p.nama) + ' (stok ' + stok + ')</option>';
            }).join("");
            sel.value = dipilih;
        }

        function Rusak_pesan(teks, jenis) {
            const box = document.getElementById("rusakMsg");
            box.textContent = teks;
            box.className = "msg-box " + (jenis === "error" ? "msg-error" : "msg-success");
            box.style.display = "block";
        }

        function Rusak_kirim() {
            const pid = document.getElementById("rusakProduk").value;
            const qty = parseInt(document.getElementById("rusakQty").value, 10);
            let jenis = document.getElementById("rusakJenis").value;
            const ket = document.getElementById("rusakKet").value.trim();
            if (jenis === "Lainnya") {
                jenis = document.getElementById("rusakJenisLain").value.trim();
                if (!jenis) return Rusak_pesan("Tulis alasan waste-nya di kolom alasan.", "error");
            }
            const produk = daftarProduk.find(function (p) { return p.id === pid; });
            if (!produk) return Rusak_pesan("Pilih menu yang rusak.", "error");
            if (!(qty > 0)) return Rusak_pesan("Isi jumlah kue yang rusak.", "error");
            if (!ket) return Rusak_pesan("Tulis keterangan penyebabnya.", "error");
            if (!confirm("Laporkan " + qty + " " + produk.nama + " sebagai waste (" + jenis + ")?\nStok langsung dikurangi dan menunggu ACC admin.")) return;

            const btn = document.getElementById("btnRusak");
            btn.disabled = true; btn.textContent = "Mengirim...";
            const ref = db.collection("outlets").doc(currentUser.outlet).collection("stock").doc(pid);
            const wasteRef = db.collection("waste_stok").doc();
            db.runTransaction(function (tx) {
                return tx.get(ref).then(function (doc) {
                    const nowMs = Date.now();
                    const pisah = sbPisah(sbNormalkan(sbBatch(doc.exists ? doc.data() : null, nowMs), produk), nowMs);
                    const ada = sbTotal(pisah.aktif);
                    if (ada < qty) throw new Error("Stok " + produk.nama + " tinggal " + ada + ".");
                    const hasil = sbAmbil(pisah.aktif, qty);
                    tx.set(ref, sbDataStok(hasil.sisa.concat(pisah.basi), nowMs), { merge: true });
                    const tertua = hasil.diambil[0];
                    tx.set(wasteRef, Object.assign(sbDataWaste({
                        outlet: currentUser.outlet, productId: pid, nama: produk.nama,
                        olehUid: currentUser.uid, olehNama: currentUser.nama
                    }, { qty: qty, masukMs: tertua.masukMs, kedaluwarsaMs: tertua.kedaluwarsaMs }, "rusak", nowMs), {
                        status: "menunggu", jenisRusak: jenis, keterangan: ket,
                        batchDiambil: hasil.diambil.map(function (b) { return { qty: b.qty, masukMs: b.masukMs, kedaluwarsaMs: b.kedaluwarsaMs, laporanId: b.laporanId || null }; })
                    }));
                });
            }).then(function () {
                Rusak_pesan("Laporan waste terkirim. Stok sudah dikurangi, menunggu ACC admin.", "success");
                document.getElementById("rusakQty").value = "";
                document.getElementById("rusakKet").value = "";
                document.getElementById("rusakProduk").value = "";
                document.getElementById("rusakJenisLain").value = "";
                document.getElementById("rusakJenis").selectedIndex = 0;
                Rusak_aturLainnya();
            }).catch(function (e) {
                Rusak_pesan("Gagal: " + e.message, "error");
            }).then(function () {
                btn.disabled = false; btn.textContent = "Kirim Laporan Waste ke Admin";
            });
        }

        function Rusak_labelStatus(st) {
            if (st === "menunggu") return '<span class="status-tag status-menunggu">Menunggu ACC</span>';
            if (st === "aktif") return '<span class="status-tag status-disetujui">Disetujui</span>';
            return '<span class="status-tag status-ditolak">Ditolak</span>';
        }

        function Rusak_loadRiwayatKasir() {
            if (rusakUnsubscribe) { rusakUnsubscribe(); rusakUnsubscribe = null; }
            rusakUnsubscribe = db.collection("waste_stok").where("olehUid", "==", currentUser.uid).onSnapshot(function (snap) {
                const el = document.getElementById("rusakRiwayat");
                if (!el) return;
                const daftar = [];
                snap.forEach(function (doc) {
                    const d = doc.data({ serverTimestamps: "estimate" });
                    if (d.alasan !== "rusak") return;
                    d._waktu = d.waktu && d.waktu.toDate ? d.waktu.toDate() : new Date(0);
                    daftar.push(d);
                });
                daftar.sort(function (a, b) { return b._waktu - a._waktu; });
                el.innerHTML = daftar.length === 0
                    ? '<div class="empty-state" style="padding:14px 0;">Belum ada laporan waste.</div>'
                    : daftar.slice(0, 10).map(function (d) {
                        return '<div class="riwayat-item"><div style="display:flex; justify-content:space-between; margin-bottom:4px;">' +
                            '<span>' + escapeHtmlAman(d._waktu.toLocaleString("id-ID")) + '</span>' + Rusak_labelStatus(d.status) + '</div>' +
                            '<div><b>' + d.qty + ' ' + escapeHtmlAman(d.nama) + '</b> \u00b7 ' + escapeHtmlAman(d.jenisRusak || "") + '</div>' +
                            '<div style="color:#6b7280; margin-top:2px;">' + escapeHtmlAman(d.keterangan || "") + '</div>' +
                            (d.status === "ditolak" && d.alasanTolak ? '<div style="color:#c0392b; margin-top:2px;">Ditolak: ' + escapeHtmlAman(d.alasanTolak) + '</div>' : '') +
                            '</div>';
                    }).join("");
            }, function (error) { tampilkanErrorQuery(document.getElementById("rusakRiwayat"), error); });
        }

        function Rusak_loadApproval() {
            if (rusakApprovalUnsubscribe) { rusakApprovalUnsubscribe(); rusakApprovalUnsubscribe = null; }
            rusakApprovalUnsubscribe = db.collection("waste_stok").where("status", "==", "menunggu").onSnapshot(function (snap) {
                const box = document.getElementById("rusakApprovalBox");
                if (!box) return;
                if (snap.empty) { box.innerHTML = ""; return; }
                const daftar = snap.docs.map(function (doc) {
                    const d = doc.data({ serverTimestamps: "estimate" });
                    d._id = doc.id;
                    d._waktu = d.waktu && d.waktu.toDate ? d.waktu.toDate() : new Date(0);
                    return d;
                }).sort(function (a, b) { return a._waktu - b._waktu; });
                box.innerHTML = '<h3>Laporan Waste Menunggu ACC</h3>' +
                    '<div class="sub">Kue yang dilaporkan kasir tidak bisa dijual sebelum waktunya. Stoknya sudah disisihkan; ACC = dicatat sebagai waste, Tolak = stok dikembalikan.</div>' +
                    daftar.map(function (d) {
                        return '<div class="laporan-card">' +
                            '<div class="laporan-header"><div><div class="outlet">' + escapeHtmlAman(d.outlet) + ' \u00b7 ' + d.qty + ' ' + escapeHtmlAman(d.nama) + '</div>' +
                            '<div class="meta">Dilaporkan oleh ' + escapeHtmlAman(d.olehNama || "-") + ' \u00b7 ' + escapeHtmlAman(d._waktu.toLocaleString("id-ID")) + '</div>' +
                            '<div class="meta" style="margin-top:4px;"><b>' + escapeHtmlAman(d.jenisRusak || "") + '</b> \u00b7 ' + escapeHtmlAman(d.keterangan || "") + '</div>' +
                            '</div></div>' +
                            '<div class="laporan-actions">' +
                                '<button class="btn-tolak" onclick="Rusak_tolak(\'' + escJsAttr(d._id) + '\')">Tolak (kembalikan stok)</button>' +
                                '<button class="btn-acc" onclick="Rusak_acc(\'' + escJsAttr(d._id) + '\')">ACC sebagai Waste</button>' +
                            '</div></div>';
                    }).join("");
            }, function (error) { tampilkanErrorQuery(document.getElementById("rusakApprovalBox"), error); });
        }

        function Rusak_acc(id) {
            if (!confirm("ACC laporan ini sebagai waste?")) return;
            db.collection("waste_stok").doc(id).update({
                status: "aktif", diaccUid: currentUser.uid, diaccNama: currentUser.nama,
                waktuAcc: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function (e) { alert("Gagal ACC: " + e.message); });
        }

        function Rusak_tolak(id) {
            const alasan = prompt("Alasan penolakan (opsional). Stok akan dikembalikan:", "");
            if (alasan === null) return;
            const wRef = db.collection("waste_stok").doc(id);
            db.runTransaction(function (tx) {
                return tx.get(wRef).then(function (wDoc) {
                    const w = wDoc.data();
                    if (!w || w.status !== "menunggu") throw new Error("Laporan ini sudah diproses.");
                    const ref = db.collection("outlets").doc(w.outlet).collection("stock").doc(w.productId);
                    return tx.get(ref).then(function (doc) {
                        const nowMs = Date.now();
                        const kembali = (w.batchDiambil && w.batchDiambil.length)
                            ? w.batchDiambil
                            : [{ qty: w.qty, masukMs: w.masukMs, kedaluwarsaMs: w.kedaluwarsaMs, laporanId: null }];
                        const daftar = sbBatch(doc.exists ? doc.data() : null, nowMs).concat(kembali)
                            .sort(function (a, b) { return a.masukMs - b.masukMs; });
                        tx.set(ref, sbDataStok(daftar, nowMs), { merge: true });
                        tx.update(wRef, {
                            status: "ditolak", alasanTolak: alasan || "",
                            ditolakUid: currentUser.uid, ditolakNama: currentUser.nama,
                            waktuTolak: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                });
            }).catch(function (e) { alert("Gagal menolak: " + e.message); });
        }

        /* ===================================================================== */
        function tampilkanPesan(text, type) {
            const box = document.getElementById("msgBox");
            box.textContent = text;
            box.className = "msg-box " + (type === "error" ? "msg-error" : "msg-success");
            box.style.display = "block";
            setTimeout(function () { box.style.display = "none"; }, 5000);
        }
    </script>

</body>
