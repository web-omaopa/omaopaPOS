<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Riwayat Penjualan</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js?v=20261117a"></script>
    <script src="kas.js?v=20261120a"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { width: 190px; flex-shrink: 0; background: #12305C; border-right: 1px solid #0B2245; padding: 20px 14px; display: flex; flex-direction: column; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; min-width: 0; padding: 22px 26px 60px; background: #F4F6FA; }
        @media (max-width: 800px) { .content { padding: 16px 14px 60px; } }

        h2 { font-size: 18px; font-weight: 800; color: #12305C; }
        .top-sub { font-size: 11.5px; color: #6b7280; margin-top: 3px; margin-bottom: 14px; }

        /* Filter */
        .filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .f-in, .f-sel { height: 36px; border: 1px solid #d1d9e3; border-radius: 9px; background: #fff; padding: 0 12px; font-size: 12.5px; color: #1f2937; font-family: inherit; }
        .f-in.cari { flex: 1; min-width: 200px; }
        .chip { height: 36px; border-radius: 18px; padding: 0 14px; font-size: 12px; font-weight: 700; border: 1px solid #d1d9e3; background: #fff; color: #52606d; cursor: pointer; font-family: inherit; }
        .chip.on { background: #12305C; border-color: #12305C; color: #fff; }
        .chip:disabled { opacity: 0.45; cursor: default; }
        .f-in:focus-visible, .f-sel:focus-visible, .chip:focus-visible { outline: 2px solid #12305C; outline-offset: 1px; }

        /* Ringkasan */
        .ringkas { display: flex; gap: 20px; flex-wrap: wrap; background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; font-size: 11.5px; color: #6b7280; }
        .ringkas b { display: block; font-size: 16px; color: #1f2937; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .ringkas .tot b { color: #12305C; font-size: 18px; }
        .ringkas .tunai b { color: #1e7d32; }
        .ringkas .non b { color: #1F5FA8; }
        .ringkas .batal b { color: #B03A2E; }

        /* Daftar & detail */
        .dua { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
        @media (max-width: 980px) { .dua { grid-template-columns: 1fr; } .detail { position: static !important; } }
        .daftar { background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; overflow: hidden; }
        .daftar .head { padding: 10px 14px; font-size: 11px; font-weight: 800; color: #6b7280; letter-spacing: .04em; background: #F5F7FA; border-bottom: 1px solid #e3e8ef; display: flex; justify-content: space-between; }
        .trx { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid #eef1f5; align-items: center; cursor: pointer; background: #fff; width: 100%; text-align: left; font-family: inherit; color: inherit; }
        .trx:last-child { border-bottom: 0; }
        .trx:hover { background: #F7F9FC; }
        .trx.on { background: #EEF3FA; box-shadow: inset 3px 0 0 #12305C; }
        .trx:focus-visible { outline: 2px solid #12305C; outline-offset: -2px; }
        .trx .jam { font-size: 13px; font-weight: 800; color: #12305C; font-variant-numeric: tabular-nums; }
        .trx .nota { font-size: 12px; font-weight: 700; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .trx .meta { font-size: 11px; color: #6b7280; margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 10px; font-weight: 800; border-radius: 8px; padding: 1px 7px; background: #EEF1F5; color: #52606d; }
        .tag.shopee { background: #FDEDE6; color: #C2410C; }
        .tag.go { background: #E7F6ED; color: #1E7D32; }
        .tag.grab { background: #E6F6EF; color: #00704A; }
        .tag.member { background: #FFF1D6; color: #9A6B1C; }
        .tag.batal { background: #FDEAEA; color: #B03A2E; }
        .tag.outlet { background: #EAF1FB; color: #1F5FA8; }
        .trx .kanan { text-align: right; }
        .trx .tot { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .trx .mt { font-size: 10.5px; color: #6b7280; margin-top: 3px; }
        .trx.dibatal .tot { color: #9aa5b1; text-decoration: line-through; }

        .detail { background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 16px 18px; position: sticky; top: 16px; }
        .detail .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .detail .no { font-size: 15px; font-weight: 800; color: #12305C; word-break: break-all; }
        .detail .wkt { font-size: 11.5px; color: #6b7280; margin-top: 3px; }
        .status { font-size: 10.5px; font-weight: 800; border-radius: 9px; padding: 3px 9px; white-space: nowrap; background: #E7F6ED; color: #1E7D32; }
        .status.batal { background: #FDEAEA; color: #B03A2E; }
        .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 12px 0; }
        .kv span { display: block; color: #8A95A5; font-size: 10.5px; font-weight: 700; }
        .kv b { font-size: 12px; color: #1f2937; }
        .garis { border-top: 1px dashed #dde3ea; margin: 10px 0; }
        .it { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; }
        .it .q { display: inline-block; min-width: 26px; height: 22px; border-radius: 6px; background: #12305C; color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 22px; margin-right: 8px; padding: 0 4px; }
        .it small { display: block; color: #8A95A5; font-size: 10.5px; margin-left: 34px; margin-top: 2px; }
        .it b { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .sm { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #52606d; padding: 3px 0; font-variant-numeric: tabular-nums; }
        .sm.dis { color: #1E7D32; }
        .sm.tot { font-size: 16px; font-weight: 800; color: #12305C; padding-top: 8px; }
        .btn-cetak { width: 100%; height: 42px; margin-top: 14px; border-radius: 9px; border: 0; background: #12305C; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-cetak:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
        .kosong { text-align: center; color: #6b7280; font-size: 12px; padding: 34px 16px; line-height: 1.6; }
        .catatan { font-size: 11px; color: #8A95A5; margin-top: 10px; line-height: 1.5; }
        .catatan a { color: #12305C; font-weight: 700; }

        /* Struk cetak ulang (sama seperti di Kasir) */
        .rc-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #374151; padding: 2.5px 0; }
        .rc-hr { border-top: 1px dashed #b8c0cc; margin: 9px 0; }
        .rc-judul { text-align: center; font-size: 12px; font-weight: 800; color: #1f2937; }
        .rc-total { font-size: 14px; font-weight: 800; color: #12305C; margin-top: 4px; }
        .rc-kecil { font-size: 9.5px; color: #8A95A5; }
        .rc-tengah { text-align: center; font-size: 10px; color: #8A95A5; }
        #areaCetak { display: none; }
        @media print {
            body.mode-cetak .app-layout { display: none !important; }
            body.mode-cetak #areaCetak { display: block !important; width: 58mm; padding: 2mm; font-family: Arial, Helvetica, sans-serif; }
            body.mode-cetak #areaCetak * { color: #000 !important; background: none !important; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>
        <div class="content" id="mainContent">
            <h2>Riwayat Penjualan</h2>
            <div class="top-sub" id="subJudul">Memuat...</div>
            <div class="filter" id="barFilter"></div>
            <div class="ringkas" id="ringkas"></div>
            <div id="isi"><div class="kosong">Memuat transaksi...</div></div>
        </div>
    </div>
    <div id="areaCetak"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        /* =====================================================================
           RIWAYAT PENJUALAN (koleksi transactions, hanya membaca)
           - Kasir: transaksi yang dia buat sendiri (aturan Firestore hanya
             mengizinkan kasir membaca transaksinya sendiri). Kueri
             kasirUid == uid + rentang waktu -> butuh index gabungan
             transactions (kasirUid, waktu).
           - Admin/owner/management: semua outlet atau satu outlet.
           - ?shift=<id sesi_kas> (dari kartu Penjualan di Shift & Kas):
             langsung menampilkan transaksi selama shift itu.
           Cetak ulang struk memakai tampilan struk yang sama dengan Kasir.
        ========================================================================= */
        let currentUser = null;
        let daftarOutlet = [];
        let pantauTrx = null;
        let transaksi = [];            // hasil kueri (sudah difilter outlet)
        let dipilihId = null;
        let sesiShift = null;          // { id, data } shift yang dipilih / berjalan
        const f = { tanggal: "", lingkup: "hari", outlet: "", cari: "", metode: "", status: "" };

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }
            // Data akun (role & outlet) selalu dibaca ulang dari database (roles.js)
            muatUserAktif(db, user).then(function (dataUser) {
                if (!dataUser) { window.location.href = "index.html"; return; }
                currentUser = dataUser;
                siapkanRole(currentUser.role, mulaiHalaman);
            });
        });

        function logout() {
            if (pantauTrx) { pantauTrx(); pantauTrx = null; }
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                sessionStorage.removeItem("omaopa_outlet_kasir");
                window.location.href = "index.html";
            });
        }

        function esc(t) { return escapeHtmlAman(t); }
        function angka(n) { return Number(n || 0).toLocaleString("id-ID"); }
        function rp(n) { return "Rp " + angka(n); }
        function isoTgl(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
        function keDate(ts) { return ts && typeof ts.toDate === "function" ? ts.toDate() : (ts instanceof Date ? ts : null); }
        function jam(d) { return d ? ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2) : "-"; }
        function tglPanjang(d) { return d ? d.toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" }) : "-"; }
        function bolehSemuaOutlet() { return currentUser.role !== "kasir"; }

        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "riwayat");
            if (!jagaAksesHalaman(currentUser.role, "riwayat")) return;
            f.tanggal = isoTgl(new Date());
            f.outlet = bolehSemuaOutlet() ? (sessionStorage.getItem("omaopa_outlet_kasir") || "") : currentUser.outlet;

            const idShift = new URLSearchParams(location.search).get("shift");
            const muatOutlet = bolehSemuaOutlet()
                ? db.collection("outlets").get().then(function (snap) {
                    daftarOutlet = []; snap.forEach(function (d) { daftarOutlet.push(d.id); }); daftarOutlet.sort();
                    if (f.outlet && daftarOutlet.indexOf(f.outlet) === -1) f.outlet = "";
                }).catch(function () { daftarOutlet = []; })
                : Promise.resolve();
            const muatShift = idShift
                ? db.collection("sesi_kas").doc(idShift).get().then(function (doc) { return doc.exists ? { id: doc.id, data: doc.data({ serverTimestamps: "estimate" }) } : null; })
                : (currentUser.role === "kasir" ? kasCariSesiAktif(db, currentUser.outlet) : Promise.resolve(null));

            Promise.all([muatOutlet, muatShift.catch(function () { return null; })]).then(function (h) {
                sesiShift = h[1];
                if (sesiShift) {
                    f.lingkup = "shift";
                    f.outlet = sesiShift.data.outlet || f.outlet;
                    const b = keDate(sesiShift.data.waktuBuka);
                    if (b) f.tanggal = isoTgl(b);
                }
                renderFilter();
                muatTransaksi();
            });
        }

        function renderFilter() {
            const adaShift = !!sesiShift;
            let html = '<input type="date" class="f-in" id="fTanggal" value="' + esc(f.tanggal) + '" onchange="ubahFilter(\'tanggal\', this.value)" aria-label="Tanggal"' + (f.lingkup === "shift" ? ' disabled' : '') + '>' +
                '<button class="chip' + (f.lingkup === "shift" ? ' on' : '') + '" onclick="ubahFilter(\'lingkup\', \'shift\')"' + (adaShift ? '' : ' disabled title="Tidak ada shift berjalan"') + '>Shift ini</button>' +
                '<button class="chip' + (f.lingkup === "hari" ? ' on' : '') + '" onclick="ubahFilter(\'lingkup\', \'hari\')">Per tanggal</button>';
            if (bolehSemuaOutlet()) {
                html += '<select class="f-sel" id="fOutlet" onchange="ubahFilter(\'outlet\', this.value)" aria-label="Outlet"' + (f.lingkup === "shift" ? ' disabled' : '') + '><option value="">Semua outlet</option>' +
                    daftarOutlet.map(function (o) { return '<option value="' + esc(o) + '"' + (o === f.outlet ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join("") + '</select>';
            }
            html += '<input type="text" class="f-in cari" id="fCari" placeholder="Cari no. nota atau nama member..." value="' + esc(f.cari) + '" oninput="ubahFilter(\'cari\', this.value)" autocomplete="off">' +
                '<select class="f-sel" id="fMetode" onchange="ubahFilter(\'metode\', this.value)" aria-label="Metode bayar"><option value="">Semua metode</option></select>' +
                '<select class="f-sel" id="fStatus" onchange="ubahFilter(\'status\', this.value)" aria-label="Status">' +
                    '<option value="">Semua status</option><option value="berhasil"' + (f.status === "berhasil" ? ' selected' : '') + '>Berhasil</option><option value="batal"' + (f.status === "batal" ? ' selected' : '') + '>Dibatalkan</option></select>';
            document.getElementById("barFilter").innerHTML = html;

            const s = sesiShift && f.lingkup === "shift" ? sesiShift.data : null;
            document.getElementById("subJudul").innerHTML = s
                ? 'Shift <b>' + esc(s.outlet) + '</b> · kasir ' + esc(s.dibukaNama || "-") + ' · mulai ' + esc(tglPanjang(keDate(s.waktuBuka))) + ' ' + jam(keDate(s.waktuBuka)) +
                    (s.status === "tutup" ? ' s/d ' + jam(keDate(s.waktuTutup)) : ' (berjalan)')
                : (bolehSemuaOutlet() ? (f.outlet ? 'Outlet <b>' + esc(f.outlet) + '</b>' : 'Semua outlet') : 'Outlet <b>' + esc(currentUser.outlet) + '</b> · transaksi yang kamu buat');
        }

        function ubahFilter(k, v) {
            f[k] = v;
            if (k === "outlet") { try { sessionStorage.setItem("omaopa_outlet_kasir", v); } catch (e) { /* abaikan */ } }
            if (k === "tanggal" || k === "lingkup" || k === "outlet") { renderFilter(); muatTransaksi(); return; }
            renderIsi();
        }

        function rentang() {
            if (f.lingkup === "shift" && sesiShift) {
                const b = keDate(sesiShift.data.waktuBuka) || new Date();
                const t = keDate(sesiShift.data.waktuTutup);
                return { dari: b, sampai: t ? new Date(t.getTime() + 1000) : new Date(Date.now() + 86400000) };
            }
            const p = f.tanggal.split("-");
            const dari = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            return { dari: dari, sampai: new Date(dari.getFullYear(), dari.getMonth(), dari.getDate() + 1) };
        }

        function muatTransaksi() {
            if (pantauTrx) { pantauTrx(); pantauTrx = null; }
            document.getElementById("isi").innerHTML = '<div class="kosong">Memuat transaksi...</div>';
            document.getElementById("ringkas").innerHTML = "";
            const r = rentang();
            let q = db.collection("transactions");
            if (currentUser.role === "kasir") q = q.where("kasirUid", "==", currentUser.uid);
            q = q.where("waktu", ">=", firebase.firestore.Timestamp.fromDate(r.dari))
                 .where("waktu", "<", firebase.firestore.Timestamp.fromDate(r.sampai));
            const outlet = f.lingkup === "shift" && sesiShift ? sesiShift.data.outlet : f.outlet;
            pantauTrx = q.onSnapshot(function (snap) {
                transaksi = [];
                snap.forEach(function (doc) {
                    const t = doc.data({ serverTimestamps: "estimate" });
                    if (outlet && t.outlet !== outlet) return;
                    t._id = doc.id;
                    t._waktu = keDate(t.waktu) || new Date(0);
                    transaksi.push(t);
                });
                transaksi.sort(function (a, b) { return b._waktu - a._waktu; });
                isiPilihanMetode();
                renderIsi();
            }, function (e) {
                pantauTrx = null;
                tampilGagal(e);
            });
        }

        function tampilGagal(e) {
            let pesan;
            if (e.code === "failed-precondition") {
                const m = /https:\/\/console\.firebase\.google\.com\/\S+/.exec(e.message || "");
                pesan = 'Riwayat belum bisa ditampilkan karena <b>index Firestore</b> untuk riwayat kasir belum dibuat.<br>' +
                    'Admin cukup membuat sekali di Firebase Console › Firestore › Indexes: koleksi <b>transactions</b>, field <b>kasirUid</b> (Ascending) dan <b>waktu</b> (Ascending).' +
                    (m ? '<br><a href="' + esc(m[0]) + '" target="_blank" rel="noopener">Buat index sekarang</a>' : '');
            } else if (e.code === "permission-denied") {
                pesan = "Transaksi belum bisa dibaca: akses akun ini dibatasi aturan Firestore.";
            } else {
                pesan = "Gagal memuat: " + esc(e.message);
            }
            document.getElementById("isi").innerHTML = '<div class="kosong">' + pesan + '</div>';
        }

        function isiPilihanMetode() {
            const sel = document.getElementById("fMetode");
            if (!sel) return;
            const daftar = [];
            transaksi.forEach(function (t) { const m = t.metodeBayar || "Tunai"; if (daftar.indexOf(m) === -1) daftar.push(m); });
            if (f.metode && daftar.indexOf(f.metode) === -1) daftar.push(f.metode);
            daftar.sort();
            sel.innerHTML = '<option value="">Semua metode</option>' +
                daftar.map(function (m) { return '<option value="' + esc(m) + '"' + (m === f.metode ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join("");
        }

        function dibatalkan(t) { return t.status === "batal" || t.status === "dibatalkan"; }

        function terfilter() {
            const cari = f.cari.trim().toLowerCase();
            return transaksi.filter(function (t) {
                if (f.metode && (t.metodeBayar || "Tunai") !== f.metode) return false;
                if (f.status === "berhasil" && dibatalkan(t)) return false;
                if (f.status === "batal" && !dibatalkan(t)) return false;
                if (cari) {
                    const teks = ((t.noNota || "") + " " + (t.member && t.member.nama ? t.member.nama : "")).toLowerCase();
                    if (teks.indexOf(cari) === -1) return false;
                }
                return true;
            });
        }

        function kelasMode(m) {
            const x = String(m || "").toLowerCase();
            if (x.indexOf("shopee") !== -1) return "shopee";
            if (x.indexOf("gofood") !== -1 || x.indexOf("gojek") !== -1) return "go";
            if (x.indexOf("grab") !== -1) return "grab";
            return "";
        }

        function renderIsi() {
            const daftar = terfilter();
            // Ringkasan dari transaksi yang tidak dibatalkan
            let total = 0, tunai = 0, n = 0, batal = 0;
            daftar.forEach(function (t) {
                if (dibatalkan(t)) { batal++; return; }
                n++; total += Number(t.total) || 0;
                if ((t.metodeBayar || "Tunai") === "Tunai") tunai += Number(t.total) || 0;
            });
            document.getElementById("ringkas").innerHTML =
                '<div class="tot">Total penjualan<b>' + rp(total) + '</b></div>' +
                '<div>Transaksi<b>' + angka(n) + '</b></div>' +
                '<div class="tunai">💵 Tunai<b>' + rp(tunai) + '</b></div>' +
                '<div class="non">💳 Non-tunai<b>' + rp(total - tunai) + '</b></div>' +
                (batal ? '<div class="batal">Dibatalkan<b>' + angka(batal) + '</b></div>' : '');

            if (daftar.length === 0) {
                dipilihId = null;
                document.getElementById("isi").innerHTML = '<div class="daftar"><div class="kosong">' +
                    (transaksi.length ? "Tidak ada transaksi yang cocok dengan filter." : "Belum ada transaksi di " + (f.lingkup === "shift" ? "shift ini." : "tanggal ini.")) +
                    (currentUser.role === "kasir" ? '<div class="catatan">Yang tampil hanya transaksi yang kamu buat sendiri.</div>' : '') + '</div></div>';
                return;
            }
            if (!dipilihId || !daftar.some(function (t) { return t._id === dipilihId; })) dipilihId = daftar[0]._id;

            const semuaOutlet = bolehSemuaOutlet() && !f.outlet && f.lingkup !== "shift";
            const tglHead = f.lingkup === "shift" ? "SHIFT INI" : new Date(rentang().dari).toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
            let html = '<div class="dua"><div class="daftar"><div class="head"><span>' + esc(tglHead) + '</span><span>' + daftar.length + ' TRANSAKSI</span></div>';
            daftar.forEach(function (t) {
                const batalT = dibatalkan(t);
                html += '<button type="button" class="trx' + (t._id === dipilihId ? ' on' : '') + (batalT ? ' dibatal' : '') + '" onclick="pilihTrx(\'' + escJsAttr(t._id) + '\')">' +
                    '<span class="jam">' + jam(t._waktu) + '</span>' +
                    '<span style="min-width:0;"><span class="nota" style="display:block;">' + esc(t.noNota || t._id) + '</span>' +
                        '<span class="meta"><span class="tag ' + kelasMode(t.modePenjualan) + '">' + esc(t.modePenjualan || "Offline") + '</span>' +
                        (semuaOutlet ? '<span class="tag outlet">' + esc(t.outlet || "-") + '</span>' : '') +
                        (t.member && t.member.nama ? '<span class="tag member">👤 ' + esc(t.member.nama) + '</span>' : '') +
                        (batalT ? '<span class="tag batal">Dibatalkan</span>' : '') + '</span></span>' +
                    '<span class="kanan"><span class="tot" style="display:block;">' + rp(t.total) + '</span><span class="mt" style="display:block;">' + esc(t.metodeBayar || "Tunai") + '</span></span>' +
                    '</button>';
            });
            html += '</div>' + htmlDetail(daftar.find(function (t) { return t._id === dipilihId; })) + '</div>';
            document.getElementById("isi").innerHTML = html;
        }

        function pilihTrx(id) {
            dipilihId = id;
            renderIsi();
            // Layar sempit (detail di bawah daftar): gulir ke detail
            if (window.innerWidth <= 980) {
                const d = document.querySelector(".detail");
                if (d) d.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        function htmlDetail(t) {
            const batalT = dibatalkan(t);
            const items = t.items || [];
            const pcs = items.reduce(function (a, it) { return a + (Number(it.qty) || 0); }, 0);
            const member = t.member && t.member.nama
                ? esc(t.member.nama) + (t.member.hp && typeof memberSamarkanHp === "function" ? ' · ' + esc(memberSamarkanHp(t.member.hp)) : '')
                : "-";
            let html = '<div class="detail"><div class="dh"><div><div class="no">' + esc(t.noNota || t._id) + '</div>' +
                '<div class="wkt">' + esc(tglPanjang(t._waktu)) + ' · ' + jam(t._waktu) + '</div></div>' +
                '<span class="status' + (batalT ? ' batal' : '') + '">' + (batalT ? 'Dibatalkan' : '✓ Berhasil') + '</span></div>' +
                '<div class="kv">' +
                    '<div><span>KASIR</span><b>' + esc(t.kasirNama || "-") + '</b></div>' +
                    '<div><span>OUTLET · MODE</span><b>' + esc(t.outlet || "-") + ' · ' + esc(t.modePenjualan || "Offline") + '</b></div>' +
                    '<div><span>MEMBER</span><b>' + member + '</b></div>' +
                    '<div><span>METODE</span><b>' + esc(t.metodeBayar || "Tunai") + '</b></div>' +
                '</div><div class="garis"></div>';
            items.forEach(function (it) {
                const sub = (Number(it.harga) || 0) * (Number(it.qty) || 0);
                const tambahan = [];
                if (it.toppings && it.toppings.length) tambahan.push("+ " + it.toppings.join(", "));
                if (it.isPromoGratis) tambahan.push("gratis (promo)");
                html += '<div class="it"><span><span class="q">' + angka(it.qty) + '</span>' + esc(it.nama) +
                    (tambahan.length ? '<small>' + esc(tambahan.join(" · ")) + '</small>' : '') + '</span><b>' + rp(sub) + '</b></div>';
            });
            html += '<div class="garis"></div>' +
                '<div class="sm"><span>Subtotal · ' + angka(pcs) + ' item</span><span>' + rp(t.subtotal) + '</span></div>';
            if (Number(t.diskonPromo) > 0) {
                html += '<div class="sm dis"><span>' + esc((t.promoDipakai && t.promoDipakai.length) ? "Promo " + t.promoDipakai.join(", ") : "Diskon") + '</span><span>−' + rp(t.diskonPromo) + '</span></div>';
            }
            html += '<div class="sm tot"><span>Total</span><span>' + rp(t.total) + '</span></div>';
            if ((t.metodeBayar || "Tunai") === "Tunai" && t.uangDiterima) {
                html += '<div class="sm"><span>Uang diterima</span><span>' + rp(t.uangDiterima) + '</span></div>' +
                    '<div class="sm"><span>Kembalian</span><span>' + rp(t.kembalian) + '</span></div>';
            }
            if (t.member && Number(t.member.poin) > 0) html += '<div class="sm"><span>Poin member didapat</span><span>+' + angka(t.member.poin) + '</span></div>';
            html += '<button class="btn-cetak" onclick="cetakUlang(\'' + escJsAttr(t._id) + '\')">🖨 Cetak Ulang Struk</button></div>';
            return html;
        }

        // Struk sama seperti di layar Kasir, ditandai "CETAK ULANG"
        function cetakUlang(id) {
            const t = transaksi.find(function (x) { return x._id === id; });
            if (!t) return;
            const baris = function (k, v, gaya) { return '<div class="rc-row"' + (gaya ? ' style="' + gaya + '"' : '') + '><span>' + k + '</span><span>' + v + '</span></div>'; };
            let h = '<div class="rc-judul">Oma Opa ' + esc(t.outlet || "") + '</div>' +
                '<div class="rc-tengah" style="margin-top:4px;">CETAK ULANG</div><div class="rc-hr"></div>';
            if (t.noNota) h += baris("No. Nota", esc(t.noNota));
            const d = t._waktu;
            h += baris("Tanggal", ("0" + d.getDate()).slice(-2) + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + d.getFullYear() + " " + jam(d));
            h += baris("Kasir", esc(t.kasirNama || "-"));
            h += baris("Mode", esc(t.modePenjualan || "Offline"));
            if (t.member && t.member.nama) h += baris("Member", esc(t.member.nama) + (t.member.hp && typeof memberSamarkanHp === "function" ? '<br><span class="rc-kecil">' + esc(memberSamarkanHp(t.member.hp)) + '</span>' : ''));
            h += '<div class="rc-hr"></div>';
            let pcs = 0;
            (t.items || []).forEach(function (it) {
                pcs += Number(it.qty) || 0;
                const tambahan = (it.toppings && it.toppings.length ? '<br><span class="rc-kecil">+ ' + esc(it.toppings.join(", ")) + '</span>' : '') +
                    (it.isPromoGratis ? '<br><span class="rc-kecil">gratis (promo)</span>' : '');
                h += baris(it.qty + " × " + esc(it.nama) + tambahan, angka((Number(it.harga) || 0) * (Number(it.qty) || 0)));
            });
            h += '<div class="rc-hr"></div>' + baris(pcs + " item · Subtotal", angka(t.subtotal));
            if (Number(t.diskonPromo) > 0) h += baris(esc((t.promoDipakai && t.promoDipakai.length) ? "Promo " + t.promoDipakai.join(", ") : "Diskon"), "-" + angka(t.diskonPromo));
            h += '<div class="rc-row rc-total"><span>Grand Total</span><span>' + angka(t.total) + '</span></div><div class="rc-hr"></div>';
            h += baris("Metode", esc(t.metodeBayar || "Tunai"));
            if ((t.metodeBayar || "Tunai") === "Tunai" && t.uangDiterima) { h += baris("Uang diterima", angka(t.uangDiterima)); h += baris("Kembalian", angka(t.kembalian)); }
            if (t.member && Number(t.member.poin) > 0) h += baris("Poin didapat", "+" + angka(t.member.poin));
            h += '<div class="rc-hr"></div><div class="rc-tengah">Terima kasih sudah belanja di Oma Opa</div>';
            document.getElementById("areaCetak").innerHTML = h;
            document.body.classList.add("mode-cetak");
            const selesai = function () { document.body.classList.remove("mode-cetak"); window.removeEventListener("afterprint", selesai); };
            window.addEventListener("afterprint", selesai);
            window.print();
        }
    </script>
