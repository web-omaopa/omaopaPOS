    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { width: 190px; flex-shrink: 0; background: #12305C; border-right: 1px solid #0B2245; padding: 20px 14px; display: flex; flex-direction: column; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; min-width: 0; padding: 22px 26px 60px; background: #F4F6FA; }
        @media (max-width: 800px) { .content { padding: 16px 14px 60px; } }

        h2 { font-size: 18px; font-weight: 800; color: #12305C; }
        .top-sub { font-size: 11.5px; color: #6b7280; margin-top: 3px; margin-bottom: 14px; }

        /* Filter */
        .filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .f-in, .f-sel { height: 36px; border: 1px solid #d1d9e3; border-radius: 9px; background: #fff; padding: 0 12px; font-size: 12.5px; color: #1f2937; font-family: inherit; }
        .f-in.cari { flex: 1; min-width: 200px; }
        .chip { height: 36px; border-radius: 18px; padding: 0 14px; font-size: 12px; font-weight: 700; border: 1px solid #d1d9e3; background: #fff; color: #52606d; cursor: pointer; font-family: inherit; }
        .chip.on { background: #12305C; border-color: #12305C; color: #fff; }
        .chip:disabled { opacity: 0.45; cursor: default; }
        .f-in:focus-visible, .f-sel:focus-visible, .chip:focus-visible { outline: 2px solid #12305C; outline-offset: 1px; }

        /* Ringkasan */
        .ringkas { display: flex; gap: 20px; flex-wrap: wrap; background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; font-size: 11.5px; color: #6b7280; }
        .ringkas b { display: block; font-size: 16px; color: #1f2937; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .ringkas .tot b { color: #12305C; font-size: 18px; }
        .ringkas .tunai b { color: #1e7d32; }
        .ringkas .non b { color: #1F5FA8; }
        .ringkas .batal b { color: #B03A2E; }

        /* Daftar & detail */
        .dua { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
        @media (max-width: 980px) { .dua { grid-template-columns: 1fr; } .detail { position: static !important; } }
        .daftar { background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; overflow: hidden; }
        .daftar .head { padding: 10px 14px; font-size: 11px; font-weight: 800; color: #6b7280; letter-spacing: .04em; background: #F5F7FA; border-bottom: 1px solid #e3e8ef; display: flex; justify-content: space-between; }
        .trx { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid #eef1f5; align-items: center; cursor: pointer; background: #fff; width: 100%; text-align: left; font-family: inherit; color: inherit; }
        .trx:last-child { border-bottom: 0; }
        .trx:hover { background: #F7F9FC; }
        .trx.on { background: #EEF3FA; box-shadow: inset 3px 0 0 #12305C; }
        .trx:focus-visible { outline: 2px solid #12305C; outline-offset: -2px; }
        .trx .jam { font-size: 13px; font-weight: 800; color: #12305C; font-variant-numeric: tabular-nums; }
        .trx .nota { font-size: 12px; font-weight: 700; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .trx .meta { font-size: 11px; color: #6b7280; margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 10px; font-weight: 800; border-radius: 8px; padding: 1px 7px; background: #EEF1F5; color: #52606d; }
        .tag.shopee { background: #FDEDE6; color: #C2410C; }
        .tag.go { background: #E7F6ED; color: #1E7D32; }
        .tag.grab { background: #E6F6EF; color: #00704A; }
        .tag.member { background: #FFF1D6; color: #9A6B1C; }
        .tag.batal { background: #FDEAEA; color: #B03A2E; }
        .tag.outlet { background: #EAF1FB; color: #1F5FA8; }
        .trx .kanan { text-align: right; }
        .trx .tot { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .trx .mt { font-size: 10.5px; color: #6b7280; margin-top: 3px; }
        .trx.dibatal .tot { color: #9aa5b1; text-decoration: line-through; }

        /* Kotak per transaksi (keterangan lengkap seperti ESB) */
        .daftar.kotak { background: none; border: 0; overflow: visible; display: grid; gap: 10px; }
        .daftar.kotak .head { background: none; border: 0; padding: 0 2px; }
        .kt { display: block; width: 100%; text-align: left; font-family: inherit; color: inherit; cursor: pointer;
              background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 12px 14px; }
        .kt:hover { border-color: #b9c6d8; }
        .kt.on { border-color: #12305C; box-shadow: inset 4px 0 0 #12305C, 0 2px 8px rgba(18,48,92,0.08); }
        .kt:focus-visible { outline: 2px solid #12305C; outline-offset: 2px; }
        .kt-atas { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed #e3e8ef; }
        .kt-atas .no { font-size: 13px; font-weight: 800; color: #12305C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
        @media (max-width: 1180px) { .kt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .kt-grid .lbl { display: block; font-size: 10px; font-weight: 700; color: #8A95A5; text-transform: uppercase; letter-spacing: .03em; }
        .kt-grid .val { display: block; font-size: 12px; color: #1f2937; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .kt-grid .val.total { font-size: 14px; font-weight: 800; color: #12305C; }
        .kt.dibatal .val.total { color: #9aa5b1; text-decoration: line-through; }
        .kt.dibatal .kt-atas .no { color: #8A95A5; }

        .detail { background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 16px 18px; position: sticky; top: 16px; }
        .detail .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .detail .no { font-size: 15px; font-weight: 800; color: #12305C; word-break: break-all; }
        .detail .wkt { font-size: 11.5px; color: #6b7280; margin-top: 3px; }
        .status { font-size: 10.5px; font-weight: 800; border-radius: 9px; padding: 3px 9px; white-space: nowrap; background: #E7F6ED; color: #1E7D32; }
        .status.batal { background: #FDEAEA; color: #B03A2E; }
        .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 12px 0; }
        .kv span { display: block; color: #8A95A5; font-size: 10.5px; font-weight: 700; }
        .kv b { font-size: 12px; color: #1f2937; }
        .garis { border-top: 1px dashed #dde3ea; margin: 10px 0; }
        .it { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; }
        .it .q { display: inline-block; min-width: 26px; height: 22px; border-radius: 6px; background: #12305C; color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 22px; margin-right: 8px; padding: 0 4px; }
        .it small { display: block; color: #8A95A5; font-size: 10.5px; margin-left: 34px; margin-top: 2px; }
        .it b { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .sm { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #52606d; padding: 3px 0; font-variant-numeric: tabular-nums; }
        .sm.dis { color: #1E7D32; }
        .sm.tot { font-size: 16px; font-weight: 800; color: #12305C; padding-top: 8px; }
        .btn-cetak { width: 100%; height: 42px; margin-top: 14px; border-radius: 9px; border: 0; background: #12305C; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-cetak:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
        .kosong { text-align: center; color: #6b7280; font-size: 12px; padding: 34px 16px; line-height: 1.6; }
        .catatan { font-size: 11px; color: #8A95A5; margin-top: 10px; line-height: 1.5; }
        .catatan a { color: #12305C; font-weight: 700; }

        /* Struk cetak ulang (sama seperti di Kasir) */
        .rc-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #374151; padding: 2.5px 0; }
        .rc-hr { border-top: 1px dashed #b8c0cc; margin: 9px 0; }
        .rc-judul { text-align: center; font-size: 12px; font-weight: 800; color: #1f2937; }
        .rc-total { font-size: 14px; font-weight: 800; color: #12305C; margin-top: 4px; }
        .rc-kecil { font-size: 9.5px; color: #8A95A5; }
        .rc-tengah { text-align: center; font-size: 10px; color: #8A95A5; }
        #areaCetak { display: none; }
        @media print {
            body.mode-cetak .app-layout { display: none !important; }
            body.mode-cetak #areaCetak { display: block !important; width: 58mm; padding: 2mm; font-family: Arial, Helvetica, sans-serif; }
            body.mode-cetak #areaCetak * { color: #000 !important; background: none !important; }
        }
        .status.tunggu { background: #FFF4D6; color: #8A5A00; }
        .aksi-dua { display: flex; gap: 8px; margin-top: 14px; }
        .aksi-dua .btn-cetak { margin-top: 0; flex: 1.4; }
        .btn-void { flex: 1; height: 42px; border-radius: 9px; border: 1.5px solid #E2A9A2; background: #fff; color: #B03A2E; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; }
        .btn-void.ajukan { border-color: #E8C77A; color: #8A5A00; }
        .btn-void:hover { background: #FDF3F2; }
        .btn-void:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
        .info-void { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.5; }
        .info-void.batal { background: #FDEAEA; color: #8C2F25; border-radius: 9px; padding: 9px 11px; margin: 12px 0 0; }
        .info-void.ditolak { background: #F3F4F6; color: #52606d; border-radius: 9px; padding: 9px 11px; margin: 12px 0 0; }
        .acc-void { background: #FFF8E6; border: 1px solid #F1D58C; border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 12px; color: #5C4300; line-height: 1.5; }
        .acc-void .tb { display: flex; gap: 8px; margin-top: 9px; }
        .acc-void button { flex: 1; height: 36px; border-radius: 8px; font-size: 12.5px; font-weight: 800; cursor: pointer; font-family: inherit; }
        .acc-void .tolak { background: #fff; border: 1.5px solid #d5dbe3; color: #52606d; }
        .acc-void .acc { background: #B03A2E; border: 0; color: #fff; }
        .banner-void { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #FFF8E6; border: 1px solid #F1D58C; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 12.5px; color: #5C4300; }
        .banner-void button { height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #8A5A00; color: #fff; font-weight: 800; font-size: 12px; cursor: pointer; font-family: inherit; }
        .mv-latar { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .mv-latar.tampil { display: flex; }
        .mv { background: #fff; border-radius: 14px; width: 100%; max-width: 400px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto; }
        .mv h3 { margin: 0; font-size: 16px; color: #B03A2E; }
        .mv h3.kuning { color: #8A5A00; }
        .mv .sub { font-size: 12px; color: #6b7280; margin: 4px 0 12px; line-height: 1.5; }
        .mv-ringkas { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; background: #F6F8FB; border-radius: 9px; padding: 10px 12px; font-size: 12px; color: #6b7280; }
        .mv-ringkas b { color: #12305C; text-align: right; }
        .mv label { display: block; font-size: 11.5px; font-weight: 700; color: #52606d; margin: 12px 0 6px; }
        .mv label i { color: #D33; font-style: normal; }
        .mv-alasan { display: flex; flex-wrap: wrap; gap: 6px; }
        .mv-alasan button { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid #d5dbe3; background: #fff; font-size: 12px; color: #374151; cursor: pointer; font-family: inherit; }
        .mv-alasan button.on { background: #12305C; border-color: #12305C; color: #fff; font-weight: 700; }
        .mv textarea { width: 100%; box-sizing: border-box; border: 1px solid #d5dbe3; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 54px; }
        .mv-efek { background: #FDF3F2; color: #8C2F25; border-radius: 9px; padding: 9px 11px; font-size: 11.5px; line-height: 1.6; margin-top: 12px; }
        .mv-efek.kuning { background: #FFF8E6; color: #5C4300; }
        .mv-error { display: none; background: #FDEAEA; color: #B03A2E; border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-top: 10px; }
        .mv-tombol { display: flex; gap: 8px; margin-top: 14px; }
        .mv-tombol button { flex: 1; height: 40px; border-radius: 9px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; }
        .mv-tombol .batal { background: #fff; border: 1.5px solid #d5dbe3; color: #52606d; }
        #vSimpan { background: #B03A2E; border: 0; color: #fff; }
        #vSimpan.kuning { background: #8A5A00; }
        #vSimpan:disabled { opacity: .55; cursor: default; }
    </style>

<body>
    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>
        <div class="content" id="mainContent">
            <h2>Riwayat Penjualan</h2>
            <div class="top-sub" id="subJudul">Memuat...</div>
            <div class="filter" id="barFilter"></div>
            <div class="ringkas" id="ringkas"></div>
            <div id="isi"><div class="kosong">Memuat transaksi...</div></div>
        </div>
    </div>
    <div id="areaCetak"></div>

    <!-- Void / Ajukan void -->
    <div class="mv-latar" id="modalVoid" onclick="if (event.target === this) tutupVoid()">
        <div class="mv" role="dialog" aria-modal="true" aria-labelledby="vJudul">
            <h3 id="vJudul">⛔ Void transaksi</h3>
            <div class="sub" id="vSub"></div>
            <div class="mv-ringkas" id="vRingkas"></div>
            <label>Alasan void <i>*</i></label>
            <div class="mv-alasan" id="vAlasan"></div>
            <label for="vCatatan">Catatan</label>
            <textarea id="vCatatan" maxlength="200" placeholder="mis. pelanggan ganti pesanan"></textarea>
            <div class="mv-efek" id="vEfek"></div>
            <div class="mv-error" id="vError"></div>
            <div class="mv-tombol"><button class="batal" onclick="tutupVoid()">Batal</button><button id="vSimpan" onclick="simpanVoid()">Void sekarang</button></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = siapkanFirestore();

        /* =====================================================================
           RIWAYAT PENJUALAN (koleksi transactions, hanya membaca)
           - Kasir: transaksi yang dia buat sendiri (aturan Firestore hanya
             mengizinkan kasir membaca transaksinya sendiri). Kueri
             kasirUid == uid + rentang waktu -> butuh index gabungan
             transactions (kasirUid, waktu).
           - Admin/owner/management: semua outlet atau satu outlet.
           - ?shift=<id sesi_kas> (dari kartu Penjualan di Shift & Kas):
             langsung menampilkan transaksi selama shift itu.
           Cetak ulang struk memakai tampilan struk yang sama dengan Kasir.
        ========================================================================= */
        let currentUser = null;
        let daftarOutlet = [];
        let pantauTrx = null;
        let transaksi = [];            // hasil kueri (sudah difilter outlet)
        let dipilihId = null;
        let sesiShift = null;          // { id, data } shift yang dipilih / berjalan
        const f = { tanggal: "", lingkup: "hari", outlet: "", cari: "", metode: "", status: "" };

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }
            // Data akun (role & outlet) selalu dibaca ulang dari database (roles.js)
            muatUserAktif(db, user).then(function (dataUser) {
                if (!dataUser) { window.location.href = "index.html"; return; }
                currentUser = dataUser;
                siapkanRole(currentUser.role, mulaiHalaman);
            });
        });

        function logout() {
            if (pantauTrx) { pantauTrx(); pantauTrx = null; }
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                sessionStorage.removeItem("omaopa_outlet_kasir");
                window.location.href = "index.html";
            });
        }

        function esc(t) { return escapeHtmlAman(t); }
        function angka(n) { return Number(n || 0).toLocaleString("id-ID"); }
        function rp(n) { return "Rp " + angka(n); }
        function isoTgl(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
        function keDate(ts) { return ts && typeof ts.toDate === "function" ? ts.toDate() : (ts instanceof Date ? ts : null); }
        function jam(d) { return d ? ("0" + d.getHours()).slice(-2) + "." + ("0" + d.getMinutes()).slice(-2) : "-"; }
        function tglPanjang(d) { return d ? d.toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" }) : "-"; }
        function bolehSemuaOutlet() { return currentUser.role !== "kasir"; }

        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "riwayat");
            if (!jagaAksesHalaman(currentUser.role, "riwayat")) return;
            f.tanggal = isoTgl(new Date());
            f.outlet = bolehSemuaOutlet() ? (sessionStorage.getItem("omaopa_outlet_kasir") || "") : currentUser.outlet;

            const idShift = new URLSearchParams(location.search).get("shift");
            const muatOutlet = bolehSemuaOutlet()
                ? db.collection("outlets").get().then(function (snap) {
                    daftarOutlet = []; snap.forEach(function (d) { daftarOutlet.push(d.id); }); daftarOutlet.sort();
                    if (f.outlet && daftarOutlet.indexOf(f.outlet) === -1) f.outlet = "";
                }).catch(function () { daftarOutlet = []; })
                : Promise.resolve();
            const muatShift = idShift
                ? db.collection("sesi_kas").doc(idShift).get().then(function (doc) { return doc.exists ? { id: doc.id, data: doc.data({ serverTimestamps: "estimate" }) } : null; })
                : (currentUser.role === "kasir" ? kasCariSesiAktif(db, currentUser.outlet) : Promise.resolve(null));

            // Kasir tanpa ?shift: muatShift sudah = shift berjalan, tidak perlu dibaca dua kali
            const muatSesiKasir = currentUser.role !== "kasir" ? Promise.resolve(null)
                : (idShift ? kasCariSesiAktif(db, currentUser.outlet) : muatShift).catch(function () { return null; });
            keuMuatDetailKategori(db);
            pantauPermintaanVoid();

            Promise.all([muatOutlet, muatShift.catch(function () { return null; }), muatSesiKasir]).then(function (h) {
                sesiShift = h[1];
                sesiBukaKasir = h[2];
                if (sesiShift) {
                    f.lingkup = "shift";
                    f.outlet = sesiShift.data.outlet || f.outlet;
                    const b = keDate(sesiShift.data.waktuBuka);
                    if (b) f.tanggal = isoTgl(b);
                }
                renderFilter();
                muatTransaksi();
            });
        }

        function renderFilter() {
            const adaShift = !!sesiShift;
            let html = '<input type="date" class="f-in" id="fTanggal" value="' + esc(f.tanggal) + '" onchange="ubahFilter(\'tanggal\', this.value)" aria-label="Tanggal"' + (f.lingkup === "shift" ? ' disabled' : '') + '>' +
                '<button class="chip' + (f.lingkup === "shift" ? ' on' : '') + '" onclick="ubahFilter(\'lingkup\', \'shift\')"' + (adaShift ? '' : ' disabled title="Tidak ada shift berjalan"') + '>Shift ini</button>' +
                '<button class="chip' + (f.lingkup === "hari" ? ' on' : '') + '" onclick="ubahFilter(\'lingkup\', \'hari\')">Per tanggal</button>';
            if (bolehSemuaOutlet()) {
                html += '<select class="f-sel" id="fOutlet" onchange="ubahFilter(\'outlet\', this.value)" aria-label="Outlet"' + (f.lingkup === "shift" ? ' disabled' : '') + '><option value="">Semua outlet</option>' +
                    daftarOutlet.map(function (o) { return '<option value="' + esc(o) + '"' + (o === f.outlet ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join("") + '</select>';
            }
            html += '<input type="text" class="f-in cari" id="fCari" placeholder="Cari no. nota atau nama member..." value="' + esc(f.cari) + '" oninput="ubahFilter(\'cari\', this.value)" autocomplete="off">' +
                '<select class="f-sel" id="fMetode" onchange="ubahFilter(\'metode\', this.value)" aria-label="Metode bayar"><option value="">Semua metode</option></select>' +
                '<select class="f-sel" id="fStatus" onchange="ubahFilter(\'status\', this.value)" aria-label="Status">' +
                    '<option value="">Semua status</option><option value="berhasil"' + (f.status === "berhasil" ? ' selected' : '') + '>Berhasil</option><option value="batal"' + (f.status === "batal" ? ' selected' : '') + '>Void (dibatalkan)</option><option value="menunggu"' + (f.status === "menunggu" ? ' selected' : '') + '>Menunggu ACC void</option></select>';
            document.getElementById("barFilter").innerHTML = html;

            const s = sesiShift && f.lingkup === "shift" ? sesiShift.data : null;
            document.getElementById("subJudul").innerHTML = s
                ? 'Shift <b>' + esc(s.outlet) + '</b> · kasir ' + esc(s.dibukaNama || "-") + ' · mulai ' + esc(tglPanjang(keDate(s.waktuBuka))) + ' ' + jam(keDate(s.waktuBuka)) +
                    (s.status === "tutup" ? ' s/d ' + jam(keDate(s.waktuTutup)) : ' (berjalan)')
                : (bolehSemuaOutlet() ? (f.outlet ? 'Outlet <b>' + esc(f.outlet) + '</b>' : 'Semua outlet') : 'Outlet <b>' + esc(currentUser.outlet) + '</b> · transaksi yang kamu buat');
        }

        function ubahFilter(k, v) {
            f[k] = v;
            if (k === "outlet") { try { sessionStorage.setItem("omaopa_outlet_kasir", v); } catch (e) { /* abaikan */ } }
            if (k === "tanggal" || k === "lingkup" || k === "outlet") { renderFilter(); muatTransaksi(); return; }
            renderIsi();
        }

        function rentang() {
            if (f.lingkup === "shift" && sesiShift) {
                const b = keDate(sesiShift.data.waktuBuka) || new Date();
                const t = keDate(sesiShift.data.waktuTutup);
                return { dari: b, sampai: t ? new Date(t.getTime() + 1000) : new Date(Date.now() + 86400000) };
            }
            const p = f.tanggal.split("-");
            const dari = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            return { dari: dari, sampai: new Date(dari.getFullYear(), dari.getMonth(), dari.getDate() + 1) };
        }

        function muatTransaksi() {
            if (pantauTrx) { pantauTrx(); pantauTrx = null; }
            document.getElementById("isi").innerHTML = '<div class="kosong">Memuat transaksi...</div>';
            document.getElementById("ringkas").innerHTML = "";
            const r = rentang();
            let q = db.collection("transactions");
            if (currentUser.role === "kasir") q = q.where("kasirUid", "==", currentUser.uid);
            q = q.where("waktu", ">=", firebase.firestore.Timestamp.fromDate(r.dari))
                 .where("waktu", "<", firebase.firestore.Timestamp.fromDate(r.sampai));
            const outlet = f.lingkup === "shift" && sesiShift ? sesiShift.data.outlet : f.outlet;
            pantauTrx = q.onSnapshot(function (snap) {
                transaksi = [];
                snap.forEach(function (doc) {
                    const t = doc.data({ serverTimestamps: "estimate" });
                    if (outlet && t.outlet !== outlet) return;
                    t._id = doc.id;
                    t._waktu = keDate(t.waktu) || new Date(0);
                    transaksi.push(t);
                });
                transaksi.sort(function (a, b) { return b._waktu - a._waktu; });
                isiPilihanMetode();
                renderIsi();
            }, function (e) {
                pantauTrx = null;
                tampilGagal(e);
            });
        }

        function tampilGagal(e) {
            let pesan;
            if (e.code === "failed-precondition") {
                const m = /https:\/\/console\.firebase\.google\.com\/\S+/.exec(e.message || "");
                pesan = 'Riwayat belum bisa ditampilkan karena <b>index Firestore</b> untuk riwayat kasir belum dibuat.<br>' +
                    'Admin cukup membuat sekali di Firebase Console › Firestore › Indexes: koleksi <b>transactions</b>, field <b>kasirUid</b> (Ascending) dan <b>waktu</b> (Ascending).' +
                    (m ? '<br><a href="' + esc(m[0]) + '" target="_blank" rel="noopener">Buat index sekarang</a>' : '');
            } else if (e.code === "permission-denied") {
                pesan = "Transaksi belum bisa dibaca: akses akun ini dibatasi aturan Firestore.";
            } else {
                pesan = "Gagal memuat: " + esc(e.message);
            }
            document.getElementById("isi").innerHTML = '<div class="kosong">' + pesan + '</div>';
        }

        function isiPilihanMetode() {
            const sel = document.getElementById("fMetode");
            if (!sel) return;
            const daftar = [];
            transaksi.forEach(function (t) { const m = t.metodeBayar || "Tunai"; if (daftar.indexOf(m) === -1) daftar.push(m); });
            if (f.metode && daftar.indexOf(f.metode) === -1) daftar.push(f.metode);
            daftar.sort();
            sel.innerHTML = '<option value="">Semua metode</option>' +
                daftar.map(function (m) { return '<option value="' + esc(m) + '"' + (m === f.metode ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join("");
        }

        function dibatalkan(t) { return t.status === "batal" || t.status === "dibatalkan"; }

        function terfilter() {
            const cari = f.cari.trim().toLowerCase();
            return transaksi.filter(function (t) {
                if (f.metode && (t.metodeBayar || "Tunai") !== f.metode) return false;
                if (f.status === "berhasil" && (dibatalkan(t) || menungguVoid(t))) return false;
                if (f.status === "menunggu" && !menungguVoid(t)) return false;
                if (f.status === "batal" && !dibatalkan(t)) return false;
                if (cari) {
                    const teks = ((t.noNota || "") + " " + (t.member && t.member.nama ? t.member.nama : "")).toLowerCase();
                    if (teks.indexOf(cari) === -1) return false;
                }
                return true;
            });
        }

        function kelasMode(m) {
            const x = String(m || "").toLowerCase();
            if (x.indexOf("shopee") !== -1) return "shopee";
            if (x.indexOf("gofood") !== -1 || x.indexOf("gojek") !== -1) return "go";
            if (x.indexOf("grab") !== -1) return "grab";
            return "";
        }

        function htmlBannerVoid() {
            if (!bolehSemuaOutlet() || !permintaanVoid.length) return "";
            return modePermintaan
                ? '<div class="banner-void"><span>Menampilkan <b>' + permintaanVoid.length + ' permintaan void</b> yang menunggu ACC (semua tanggal &amp; outlet).</span><button onclick="tampilPermintaan(false)">Kembali ke daftar</button></div>'
                : '<div class="banner-void"><span>⏳ Ada <b>' + permintaanVoid.length + ' permintaan void</b> menunggu ACC.</span><button onclick="tampilPermintaan(true)">Tampilkan</button></div>';
        }

        function renderIsi() {
            const daftar = modePermintaan ? permintaanVoid : terfilter();
            const banner = htmlBannerVoid();
            // Ringkasan dari transaksi yang tidak dibatalkan
            let total = 0, tunai = 0, n = 0, batal = 0;
            daftar.forEach(function (t) {
                if (dibatalkan(t)) { batal++; return; }
                n++; total += Number(t.total) || 0;
                if ((t.metodeBayar || "Tunai") === "Tunai") tunai += Number(t.total) || 0;
            });
            document.getElementById("ringkas").style.display = modePermintaan ? "none" : "";
            document.getElementById("ringkas").innerHTML =
                '<div class="tot">Total penjualan<b>' + rp(total) + '</b></div>' +
                '<div>Transaksi<b>' + angka(n) + '</b></div>' +
                '<div class="tunai">💵 Tunai<b>' + rp(tunai) + '</b></div>' +
                '<div class="non">💳 Non-tunai<b>' + rp(total - tunai) + '</b></div>' +
                (batal ? '<div class="batal">Void<b>' + angka(batal) + '</b></div>' : '');

            if (daftar.length === 0) {
                dipilihId = null;
                document.getElementById("isi").innerHTML = banner + '<div class="daftar"><div class="kosong">' +
                    (transaksi.length ? "Tidak ada transaksi yang cocok dengan filter." : "Belum ada transaksi di " + (f.lingkup === "shift" ? "shift ini." : "tanggal ini.")) +
                    (currentUser.role === "kasir" ? '<div class="catatan">Yang tampil hanya transaksi yang kamu buat sendiri.</div>' : '') + '</div></div>';
                return;
            }
            if (!dipilihId || !daftar.some(function (t) { return t._id === dipilihId; })) dipilihId = daftar[0]._id;

            const semuaOutlet = bolehSemuaOutlet() && (modePermintaan || (!f.outlet && f.lingkup !== "shift"));
            const tglHead = modePermintaan ? "PERMINTAAN VOID" : f.lingkup === "shift" ? "SHIFT INI" : new Date(rentang().dari).toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
            let html = banner + '<div class="dua"><div class="daftar kotak"><div class="head"><span>' + esc(tglHead) + '</span><span>' + daftar.length + ' TRANSAKSI</span></div>';
            daftar.forEach(function (t) {
                const batalT = dibatalkan(t);
                const d = t._waktu;
                const tgl = ("0" + d.getDate()).slice(-2) + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + d.getFullYear();
                const jamDetik = jam(d) + "." + ("0" + d.getSeconds()).slice(-2);
                const kol = function (lbl, val, kelas) {
                    return '<span><span class="lbl">' + lbl + '</span><span class="val' + (kelas ? ' ' + kelas : '') + '">' + val + '</span></span>';
                };
                html += '<button type="button" class="kt' + (t._id === dipilihId ? ' on' : '') + (batalT ? ' dibatal' : '') + '" onclick="pilihTrx(\'' + escJsAttr(t._id) + '\')">' +
                    '<span class="kt-atas"><span class="no">' + esc(t.noNota || t._id) + '</span>' +
                        htmlStatus(t) + '</span>' +
                    '<span class="kt-grid">' +
                        kol("Tanggal", tgl + " | " + jamDetik) +
                        kol("Member", t.member && t.member.nama ? '👤 ' + esc(t.member.nama) : "-") +
                        kol("Total penjualan", rp(t.total), "total") +
                        kol("Mode", '<span class="tag ' + kelasMode(t.modePenjualan) + '">' + esc(t.modePenjualan || "Offline") + '</span>') +
                        kol("Metode pembayaran", esc(t.metodeBayar || "Tunai")) +
                        kol(semuaOutlet ? "Outlet · Kasir" : "Kasir", (semuaOutlet ? esc(t.outlet || "-") + " · " : "") + esc(t.kasirNama || "-")) +
                    '</span></button>';
            });
            html += '</div>' + htmlDetail(daftar.find(function (t) { return t._id === dipilihId; })) + '</div>';
            document.getElementById("isi").innerHTML = html;
            const dipilih = daftar.find(function (t) { return t._id === dipilihId; });
            if (dipilih) aturTombolVoid(dipilih);
        }

        function pilihTrx(id) {
            dipilihId = id;
            renderIsi();
            // Layar sempit (detail di bawah daftar): gulir ke detail
            if (window.innerWidth <= 980) {
                const d = document.querySelector(".detail");
                if (d) d.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        function htmlDetail(t) {
            const batalT = dibatalkan(t);
            const items = t.items || [];
            const pcs = items.reduce(function (a, it) { return a + (Number(it.qty) || 0); }, 0);
            const member = t.member && t.member.nama
                ? esc(t.member.nama) + (t.member.hp && typeof memberSamarkanHp === "function" ? ' · ' + esc(memberSamarkanHp(t.member.hp)) : '')
                : "-";
            let html = '<div class="detail"><div class="dh"><div><div class="no">' + esc(t.noNota || t._id) + '</div>' +
                '<div class="wkt">' + esc(tglPanjang(t._waktu)) + ' · ' + jam(t._waktu) + '</div></div>' +
                htmlStatus(t) + '</div>' +
                '<div class="kv">' +
                    '<div><span>KASIR</span><b>' + esc(t.kasirNama || "-") + '</b></div>' +
                    '<div><span>OUTLET · MODE</span><b>' + esc(t.outlet || "-") + ' · ' + esc(t.modePenjualan || "Offline") + '</b></div>' +
                    '<div><span>MEMBER</span><b>' + member + '</b></div>' +
                    '<div><span>METODE</span><b>' + esc(t.metodeBayar || "Tunai") + '</b></div>' +
                '</div><div class="garis"></div>';
            items.forEach(function (it) {
                const sub = (Number(it.harga) || 0) * (Number(it.qty) || 0);
                const tambahan = [];
                if (it.toppings && it.toppings.length) tambahan.push("+ " + it.toppings.join(", "));
                if (it.isPromoGratis) tambahan.push("gratis (promo)");
                html += '<div class="it"><span><span class="q">' + angka(it.qty) + '</span>' + esc(it.nama) +
                    (tambahan.length ? '<small>' + esc(tambahan.join(" · ")) + '</small>' : '') + '</span><b>' + rp(sub) + '</b></div>';
            });
            html += '<div class="garis"></div>' +
                '<div class="sm"><span>Subtotal · ' + angka(pcs) + ' item</span><span>' + rp(t.subtotal) + '</span></div>';
            if (Number(t.diskonPromo) > 0) {
                html += '<div class="sm dis"><span>' + esc((t.promoDipakai && t.promoDipakai.length) ? "Promo " + t.promoDipakai.join(", ") : "Diskon") + '</span><span>−' + rp(t.diskonPromo) + '</span></div>';
            }
            html += '<div class="sm tot"><span>Total</span><span>' + rp(t.total) + '</span></div>';
            if ((t.metodeBayar || "Tunai") === "Tunai" && t.uangDiterima) {
                html += '<div class="sm"><span>Uang diterima</span><span>' + rp(t.uangDiterima) + '</span></div>' +
                    '<div class="sm"><span>Kembalian</span><span>' + rp(t.kembalian) + '</span></div>';
            }
            if (t.member && Number(t.member.poin) > 0) html += '<div class="sm"><span>Poin member didapat</span><span>+' + angka(t.member.poin) + '</span></div>';
            html += htmlAksiDetail(t) + '</div>';
            return html;
        }

        /* =====================================================================
           VOID TRANSAKSI
           - Kasir, transaksi dari shift outletnya yang MASIH BUKA: void langsung.
           - Kasir, shift sudah ditutup / hari sebelumnya: "Ajukan void"
             (voidStatus "menunggu", voidMinta {alasan, catatan, uid, nama, waktu}).
           - Admin/owner/management: void langsung atau ACC / Tolak permintaan.
           Saat void: status "batal" + voidAlasan, voidCatatan, voidUid, voidNama,
           voidPada, voidCara ("langsung" | "acc"), voidSesiId; ringkasan_harian
           dikurangi; kalau shift transaksi masih buka: stok dikembalikan dan
           catatan penjualan shift (sesi_kas) dikurangi.
           Poin member belum dikurangi (perlu dukungan web member).
        ========================================================================= */
        const ALASAN_VOID = ["Salah input", "Pelanggan batal", "Salah metode bayar", "Pesanan dobel", "Lainnya"];
        let sesiBukaKasir = null;      // shift berjalan di outlet kasir (null = tidak ada)
        let voidTrxId = null, voidMode = "langsung", voidAlasan = "";
        let permintaanVoid = [];       // admin: transaksi dengan voidStatus "menunggu"
        let pantauPermintaan = null;
        let modePermintaan = false;    // admin sedang menampilkan daftar permintaan void

        function menungguVoid(t) { return !dibatalkan(t) && t.voidStatus === "menunggu"; }

        function htmlStatus(t) {
            if (dibatalkan(t)) return '<span class="status batal">Void</span>';
            if (menungguVoid(t)) return '<span class="status tunggu">⏳ Menunggu ACC void</span>';
            return '<span class="status">✓ Berhasil</span>';
        }

        // Shift berjalan (sesi_kas status buka) yang mencakup transaksi ini, atau null
        function sesiBukaUntuk(t) {
            if (currentUser.role === "kasir") {
                const s = sesiBukaKasir;
                if (!s || s.data.outlet !== t.outlet) return Promise.resolve(null);
                const b = keDate(s.data.waktuBuka);
                return Promise.resolve(b && t._waktu >= b ? s : null);
            }
            return kasCariSesiAktif(db, t.outlet).then(function (s) {
                const b = s ? keDate(s.data.waktuBuka) : null;
                return b && t._waktu >= b ? s : null;
            }).catch(function () { return null; });
        }

        function htmlAksiDetail(t) {
            let html = "";
            if (t.voidStatus === "ditolak" && !dibatalkan(t)) {
                html += '<div class="info-void ditolak">Permintaan void ditolak' + (t.voidTolakNama ? ' oleh ' + esc(t.voidTolakNama) : '') +
                    (t.voidTolakAlasan ? ': ' + esc(t.voidTolakAlasan) : '') + '</div>';
            }
            if (dibatalkan(t)) {
                html += '<div class="info-void batal"><b>Void</b>' + (t.voidNama ? ' oleh ' + esc(t.voidNama) : '') +
                    (keDate(t.voidPada) ? ' · ' + esc(tglPanjang(keDate(t.voidPada))) + ' ' + jam(keDate(t.voidPada)) : '') +
                    (t.voidAlasan ? '<br>Alasan: <b>' + esc(t.voidAlasan) + '</b>' + (t.voidCatatan ? ', ' + esc(t.voidCatatan) : '') : '') + '</div>';
            } else if (menungguVoid(t)) {
                const m = t.voidMinta || {};
                html += '<div class="acc-void"><b>Permintaan void</b> dari ' + esc(m.nama || "-") +
                    (keDate(m.waktu) ? ' · ' + jam(keDate(m.waktu)) + ', ' + esc(keDate(m.waktu).toLocaleDateString("id-ID")) : '') +
                    '<br>Alasan: <b>' + esc(m.alasan || "-") + '</b>' + (m.catatan ? ', ' + esc(m.catatan) : '') +
                    (bolehSemuaOutlet()
                        ? '<div class="tb"><button class="tolak" onclick="tolakVoid(\'' + escJsAttr(t._id) + '\')">Tolak</button>' +
                          '<button class="acc" onclick="bukaVoid(\'' + escJsAttr(t._id) + '\', \'acc\')">ACC void</button></div>'
                        : '<div style="margin-top:4px;">Menunggu persetujuan admin.</div>') + '</div>';
            }
            const tombolVoid = !dibatalkan(t) && !menungguVoid(t)
                ? '<button class="btn-void" id="btnVoid" onclick="bukaVoid(\'' + escJsAttr(t._id) + '\')">⛔ Void</button>' : '';
            html += '<div class="aksi-dua"><button class="btn-cetak" onclick="cetakUlang(\'' + escJsAttr(t._id) + '\')">🖨 Cetak Ulang Struk</button>' + tombolVoid + '</div>';
            if (tombolVoid) html += '<div class="info-void" id="infoVoid">Memeriksa shift…</div>';
            return html;
        }

        // Setelah detail digambar: sesuaikan tombol Void (langsung / ajukan) dengan status shift
        function aturTombolVoid(t) {
            const btn = document.getElementById("btnVoid");
            if (!btn) return;
            sesiBukaUntuk(t).then(function (s) {
                const info = document.getElementById("infoVoid");
                if (!document.getElementById("btnVoid") || dipilihId !== t._id) return;
                if (s || bolehSemuaOutlet()) {
                    btn.textContent = "⛔ Void";
                    if (info) info.textContent = s ? "Shift masih berjalan: void langsung berlaku." : "Shift sudah ditutup: void mengoreksi laporan (stok & rekap shift tidak diubah).";
                } else {
                    btn.textContent = "⏳ Ajukan void";
                    btn.classList.add("ajukan");
                    if (info) info.textContent = "Shift sudah ditutup: void perlu persetujuan admin.";
                }
            });
        }

        function bukaVoid(id, mode) {
            const t = transaksi.concat(permintaanVoid).find(function (x) { return x._id === id; });
            if (!t) return;
            voidTrxId = id;
            voidAlasan = mode === "acc" && t.voidMinta ? t.voidMinta.alasan : "";
            document.getElementById("vCatatan").value = mode === "acc" && t.voidMinta ? (t.voidMinta.catatan || "") : "";
            document.getElementById("vError").style.display = "none";
            document.getElementById("vRingkas").innerHTML =
                '<span>No. Nota</span><b>' + esc(t.noNota || t._id) + '</b>' +
                '<span>Waktu</span><b>' + esc(t._waktu.toLocaleDateString("id-ID")) + ' | ' + jam(t._waktu) + '</b>' +
                '<span>Total · ' + esc(t.metodeBayar || "Tunai") + '</span><b>' + rp(t.total) + '</b>';
            document.getElementById("vEfek").textContent = "Memeriksa shift…";
            const btn = document.getElementById("vSimpan");
            btn.disabled = true;
            document.getElementById("modalVoid").classList.add("tampil");
            renderAlasanVoid();
            sesiBukaUntuk(t).then(function (s) {
                if (voidTrxId !== id) return;
                const pcs = (t.items || []).filter(function (it) { return it.kategori !== "Topping"; }).reduce(function (a, it) { return a + (Number(it.qty) || 0); }, 0);
                if (mode === "acc") voidMode = "acc";
                else voidMode = (s || bolehSemuaOutlet()) ? "langsung" : "ajukan";
                const judul = document.getElementById("vJudul");
                judul.textContent = voidMode === "ajukan" ? "⏳ Ajukan void" : voidMode === "acc" ? "⛔ ACC void" : "⛔ Void transaksi";
                judul.className = voidMode === "ajukan" ? "kuning" : "";
                document.getElementById("vSub").innerHTML = voidMode === "ajukan"
                    ? 'Transaksi ini dari shift yang <b>sudah ditutup</b>, jadi void perlu persetujuan admin.'
                    : 'Transaksi akan dibatalkan. Tindakan ini tercatat atas nama kamu.';
                const efek = document.getElementById("vEfek");
                efek.className = "mv-efek" + (voidMode === "ajukan" ? " kuning" : "");
                efek.innerHTML = voidMode === "ajukan"
                    ? "Setelah di-ACC admin: penjualan &amp; laporan dikoreksi. Stok tidak dikembalikan dan rekap shift yang sudah ditutup tidak diubah."
                    : s
                        ? "✓ Stok " + pcs + " pcs dikembalikan ke " + esc(t.outlet) + "<br>✓ Penjualan shift berkurang <b>" + rp(t.total) + "</b> (" + esc(t.metodeBayar || "Tunai") + ")<br>✓ Penjualan &amp; laporan dikoreksi"
                        : "✓ Penjualan &amp; laporan dikoreksi<br>Shift transaksi ini sudah ditutup: stok &amp; rekap shift tidak diubah.";
                btn.textContent = voidMode === "ajukan" ? "Ajukan ke admin" : voidMode === "acc" ? "ACC void" : "Void sekarang";
                btn.className = voidMode === "ajukan" ? "kuning" : "";
                btn.disabled = false;
                btn.dataset.sesi = s ? s.id : "";
            });
        }

        function renderAlasanVoid() {
            document.getElementById("vAlasan").innerHTML = ALASAN_VOID.map(function (a) {
                return '<button type="button" class="' + (a === voidAlasan ? 'on' : '') + '" onclick="pilihAlasanVoid(\'' + escJsAttr(a) + '\')">' + esc(a) + '</button>';
            }).join("");
        }
        function pilihAlasanVoid(a) { voidAlasan = a; renderAlasanVoid(); }
        function tutupVoid() { document.getElementById("modalVoid").classList.remove("tampil"); voidTrxId = null; }

        function simpanVoid() {
            const err = document.getElementById("vError");
            const salah = function (p) { err.innerHTML = p; err.style.display = "block"; };
            err.style.display = "none";
            if (!voidAlasan) return salah("Pilih alasan void.");
            const catatan = document.getElementById("vCatatan").value.trim();
            if (voidAlasan === "Lainnya" && !catatan) return salah("Tulis alasannya di kolom catatan.");
            const btn = document.getElementById("vSimpan");
            const id = voidTrxId, sesiId = btn.dataset.sesi || "";
            btn.disabled = true;
            const proses = voidMode === "ajukan"
                ? db.collection("transactions").doc(id).update({
                    voidStatus: "menunggu",
                    voidMinta: { alasan: voidAlasan, catatan: catatan, uid: currentUser.uid, nama: currentUser.nama || "", waktu: firebase.firestore.FieldValue.serverTimestamp() }
                })
                : jalankanVoid(id, voidAlasan, catatan, sesiId, voidMode);
            proses.then(function () {
                tutupVoid();
            }).catch(function (e) {
                btn.disabled = false;
                salah(e.code === "permission-denied"
                    ? "Ditolak aturan Firestore. Kalau shift transaksi ini sudah ditutup, gunakan <b>Ajukan void</b>."
                    : "Gagal: " + esc(e.message));
            });
        }

        /* Void dalam satu transaksi Firestore: status transaksi, ringkasan
           harian, dan (kalau shift masih buka) stok + catatan penjualan shift. */
        function jalankanVoid(id, alasan, catatan, sesiId, cara) {
            const trxRef = db.collection("transactions").doc(id);
            const sesiRef = sesiId ? db.collection("sesi_kas").doc(sesiId) : null;
            return keuMuatDetailKategori(db).then(function () {
                return db.runTransaction(function (tx) {
                    return tx.get(trxRef).then(function (doc) {
                        if (!doc.exists) throw new Error("Transaksi tidak ditemukan.");
                        const t = doc.data();
                        if (t.status === "batal") throw new Error("Transaksi ini sudah di-void.");
                        const tWaktu = keDate(t.waktu) || new Date();
                        // Item yang stoknya dilacak (topping tidak)
                        const perProduk = {};
                        if (sesiRef) {
                            (t.items || []).forEach(function (it) {
                                if (!it.productId || it.kategori === "Topping") return;
                                perProduk[it.productId] = (perProduk[it.productId] || 0) + (Number(it.qty) || 0);
                            });
                        }
                        const pids = Object.keys(perProduk);
                        const stokRefs = pids.map(function (p) { return db.collection("outlets").doc(t.outlet).collection("stock").doc(p); });
                        const produkRefs = pids.map(function (p) { return db.collection("products").doc(p); });
                        const baca = [sesiRef ? tx.get(sesiRef) : Promise.resolve(null)]
                            .concat(stokRefs.map(function (r) { return tx.get(r); }))
                            .concat(produkRefs.map(function (r) { return tx.get(r); }));
                        return Promise.all(baca).then(function (h) {
                            const sesiDoc = h[0];
                            const sesiMasihBuka = sesiDoc && sesiDoc.exists && sesiDoc.data().status === "buka";
                            const nowMs = Date.now();
                            const naik = firebase.firestore.FieldValue.increment;
                            // 1. Kembalikan stok (hanya shift masih buka)
                            if (sesiMasihBuka) {
                                pids.forEach(function (pid, i) {
                                    const snap = h[1 + i], produk = h[1 + pids.length + i].exists ? h[1 + pids.length + i].data() : {};
                                    const daftar = sbBatch(snap.exists ? snap.data() : null, nowMs);
                                    const pisah = sbPisah(sbNormalkan(daftar, produk), nowMs);
                                    const qty = perProduk[pid];
                                    if (pisah.aktif.length) {
                                        pisah.aktif[0] = Object.assign({}, pisah.aktif[0], { qty: pisah.aktif[0].qty + qty });
                                    } else {
                                        const exp = sbKedaluwarsa(produk, tWaktu.getTime());
                                        if (exp === null || exp > nowMs) pisah.aktif.push({ qty: qty, masukMs: tWaktu.getTime(), kedaluwarsaMs: exp, laporanId: null });
                                    }
                                    tx.set(stokRefs[i], sbDataStok(pisah.aktif.concat(pisah.basi), nowMs), { merge: true });
                                });
                                // 2. Catatan penjualan shift
                                const per = {};
                                per[t.metodeBayar || "Tunai"] = naik(-(Number(t.total) || 0));
                                tx.set(sesiRef, { jumlahTrx: naik(-1), penjualanPerMetode: per }, { merge: true });
                            }
                            // 3. Ringkasan harian (Laba Rugi)
                            const r = keuRingkasTransaksi(t);
                            const tgl = keuTanggalIso(tWaktu);
                            const data = { outlet: t.outlet, tanggal: tgl, tahun: tWaktu.getFullYear(), bulan: tWaktu.getMonth() + 1, trx: naik(-1) };
                            ["penjualan", "diskon", "qty", "cogs", "qtyTanpaHpp"].forEach(function (k) {
                                const isi = {};
                                Object.keys(r[k] || {}).forEach(function (d) { isi[d] = naik(-r[k][d]); });
                                if (Object.keys(isi).length) data[k] = isi;
                            });
                            tx.set(db.collection("ringkasan_harian").doc(keuIdRingkasan(t.outlet, tgl)), data, { merge: true });
                            // 4. Status transaksi
                            const ubah = {
                                status: "batal", voidAlasan: alasan, voidCatatan: catatan || "",
                                voidUid: currentUser.uid, voidNama: currentUser.nama || "",
                                voidPada: firebase.firestore.FieldValue.serverTimestamp(),
                                voidCara: cara === "acc" ? "acc" : "langsung", voidSesiId: sesiMasihBuka ? sesiId : null
                            };
                            if (cara === "acc") ubah.voidStatus = "disetujui";
                            tx.update(trxRef, ubah);
                        });
                    });
                });
            });
        }

        function tolakVoid(id) {
            const alasan = prompt("Alasan menolak permintaan void (opsional):", "");
            if (alasan === null) return;
            db.collection("transactions").doc(id).update({
                voidStatus: "ditolak", voidTolakAlasan: alasan || "",
                voidTolakUid: currentUser.uid, voidTolakNama: currentUser.nama || "",
                voidTolakPada: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function (e) { alert("Gagal menolak: " + e.message); });
        }

        // Admin: pantau semua permintaan void yang menunggu (semua tanggal)
        function pantauPermintaanVoid() {
            if (!bolehSemuaOutlet()) return;
            if (pantauPermintaan) pantauPermintaan();
            pantauPermintaan = db.collection("transactions").where("voidStatus", "==", "menunggu").onSnapshot(function (snap) {
                permintaanVoid = [];
                snap.forEach(function (doc) {
                    const t = doc.data({ serverTimestamps: "estimate" });
                    if (t.status === "batal") return;
                    t._id = doc.id; t._waktu = keDate(t.waktu) || new Date(0);
                    permintaanVoid.push(t);
                });
                permintaanVoid.sort(function (a, b) { return b._waktu - a._waktu; });
                if (modePermintaan && permintaanVoid.length === 0) modePermintaan = false;
                if (pantauTrx || modePermintaan) renderIsi();
            }, function (e) { console.warn("Permintaan void belum bisa dibaca:", e.message); });
        }

        function tampilPermintaan(v) { modePermintaan = v; dipilihId = null; renderIsi(); }

        // Struk sama seperti di layar Kasir, ditandai "CETAK ULANG"
        function cetakUlang(id) {
            const t = transaksi.concat(permintaanVoid).find(function (x) { return x._id === id; });
            if (!t) return;
            const baris = function (k, v, gaya) { return '<div class="rc-row"' + (gaya ? ' style="' + gaya + '"' : '') + '><span>' + k + '</span><span>' + v + '</span></div>'; };
            let h = '<div class="rc-judul">Oma Opa ' + esc(t.outlet || "") + '</div>' +
                '<div class="rc-tengah" style="margin-top:4px;">CETAK ULANG</div><div class="rc-hr"></div>';
            if (t.noNota) h += baris("No. Nota", esc(t.noNota));
            const d = t._waktu;
            h += baris("Tanggal", ("0" + d.getDate()).slice(-2) + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + d.getFullYear() + " " + jam(d));
            h += baris("Kasir", esc(t.kasirNama || "-"));
            h += baris("Mode", esc(t.modePenjualan || "Offline"));
            if (t.member && t.member.nama) h += baris("Member", esc(t.member.nama) + (t.member.hp && typeof memberSamarkanHp === "function" ? '<br><span class="rc-kecil">' + esc(memberSamarkanHp(t.member.hp)) + '</span>' : ''));
            h += '<div class="rc-hr"></div>';
            let pcs = 0;
            (t.items || []).forEach(function (it) {
                pcs += Number(it.qty) || 0;
                const tambahan = (it.toppings && it.toppings.length ? '<br><span class="rc-kecil">+ ' + esc(it.toppings.join(", ")) + '</span>' : '') +
                    (it.isPromoGratis ? '<br><span class="rc-kecil">gratis (promo)</span>' : '');
                h += baris(it.qty + " × " + esc(it.nama) + tambahan, angka((Number(it.harga) || 0) * (Number(it.qty) || 0)));
            });
            h += '<div class="rc-hr"></div>' + baris(pcs + " item · Subtotal", angka(t.subtotal));
            if (Number(t.diskonPromo) > 0) h += baris(esc((t.promoDipakai && t.promoDipakai.length) ? "Promo " + t.promoDipakai.join(", ") : "Diskon"), "-" + angka(t.diskonPromo));
            h += '<div class="rc-row rc-total"><span>Grand Total</span><span>' + angka(t.total) + '</span></div><div class="rc-hr"></div>';
            h += baris("Metode", esc(t.metodeBayar || "Tunai"));
            if ((t.metodeBayar || "Tunai") === "Tunai" && t.uangDiterima) { h += baris("Uang diterima", angka(t.uangDiterima)); h += baris("Kembalian", angka(t.kembalian)); }
            if (t.member && Number(t.member.poin) > 0) h += baris("Poin didapat", "+" + angka(t.member.poin));
            h += '<div class="rc-hr"></div><div class="rc-tengah">Terima kasih sudah belanja di Oma Opa</div>';
            document.getElementById("areaCetak").innerHTML = h;
            document.body.classList.add("mode-cetak");
            const selesai = function () { document.body.classList.remove("mode-cetak"); window.removeEventListener("afterprint", selesai); };
            window.addEventListener("afterprint", selesai);
            window.print();
        }
    </script>
