<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Stok</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #1f2937;
        }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 190px;
            flex-shrink: 0;
            background: #12305C;
            border-right: 1px solid #0B2245;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
        }

        .sidebar .brand { font-weight: 800; font-size: 15px; color: #ffffff; margin-bottom: 18px; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }

        .sidebar .nav-item {
            display: block; padding: 9px 12px; border-radius: 8px;
            font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px;
        }

        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }

        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }

        .sidebar .nav-label {
            font-size: 10px; font-weight: 700; color: #8AA0C7;
            text-transform: uppercase; padding: 0 12px; margin-bottom: 6px;
        }

        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }

        .sidebar .logout-link {
            font-size: 11px; color: #FF8A80; background: none;
            border: none; cursor: pointer; padding: 0;
        }

        .content { flex: 1; padding: 24px 28px 90px; max-width: 900px; }

        .header-row {
            display: flex; justify-content: space-between;
            align-items: flex-end; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
        }

        .header-row h2 { font-size: 16px; font-weight: 700; }

        .header-controls { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
        .ctrl-label { font-size: 10px; font-weight: 700; color: #6b7280; margin-bottom: 3px; }
        .ctrl-arrow { margin-bottom: 9px; color: #8A95A5; font-size: 14px; }

        select.outlet-select {
            height: 34px; border: 1px solid #d1d5db; border-radius: 6px;
            padding: 0 10px; font-size: 12px; background: #ffffff;
        }

        select.tujuan-select.dipilih { border-color: #12305C; color: #12305C; font-weight: 700; }

        table {
            width: 100%; border-collapse: collapse;
            background: #ffffff; border: 1px solid #dde3ea;
            border-radius: 10px; overflow: hidden; font-size: 12px;
        }

        thead th {
            text-align: left; padding: 10px 14px;
            background: #f1f4f8; color: #52606d; font-weight: 700; font-size: 11px;
        }

        tbody td { padding: 9px 14px; border-top: 1px solid #e8ecf1; }

        .r { text-align: right; }
        .c { text-align: center; }

        .badge { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
        .badge-aman { background: #e5f4e6; color: #1e7d32; }
        .badge-menipis { background: #fdf1de; color: #b06d09; }
        .badge-habis { background: #fdeaea; color: #c0392b; }

        .hint-text { font-size: 10.5px; color: #8A95A5; margin-top: 10px; }

        .loading-state, .empty-state { text-align: center; color: #6b7280; font-size: 12px; padding: 30px 0; }
        .denied-state { text-align: center; color: #6b7280; font-size: 12px; padding: 40px 0; }

        /* ===== Outlet terpilih + daftar outlet lain per area ===== */
        .judul-outlet { font-size: 13px; font-weight: 800; color: #12305C; margin-bottom: 8px; }
        .judul-outlet span { font-size: 11px; font-weight: 400; color: #6b7280; }
        .judul-lain { font-size: 13px; font-weight: 800; color: #1f2937; margin-top: 30px; }

        .area-judul {
            background: #12305C; color: #ffffff; font-size: 12px; font-weight: 700;
            padding: 8px 12px; border-radius: 8px; margin: 14px 0 12px;
        }
        .area-judul span { font-weight: 400; color: #B8C7E0; }

        .kartu-outlet { margin-bottom: 18px; }
        .kartu-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
        .kartu-nama { font-size: 12.5px; font-weight: 800; color: #12305C; cursor: pointer; }
        .kartu-nama:hover { text-decoration: underline; }
        .kartu-info { font-size: 10.5px; color: #6b7280; }

        /* Tombol ke halaman Transfer (khusus Forecaster/Admin) */
        .btn {
            height: 34px; padding: 0 16px; border-radius: 8px; font-size: 12px; font-weight: 700;
            cursor: pointer; font-family: inherit; border: 1px solid #dde3ea; background: #ffffff; color: #52606d;
            text-decoration: none; display: inline-flex; align-items: center;
        }
        .btn-primary { background: #12305C; border-color: #12305C; color: #ffffff; }

    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>

        <div class="content" id="mainContent">
            <div class="header-row">
                <h2>Stok Produk</h2>
                <div class="header-controls">
                    <div id="wadahArea" style="display:none;">
                        <div class="ctrl-label">Area</div>
                        <select class="outlet-select" id="areaSelect"></select>
                    </div>
                    <div>
                        <div class="ctrl-label" id="labelOutlet" style="display:none;">Outlet</div>
                        <select class="outlet-select" id="outletSelect"></select>
                    </div>
                    <a class="btn btn-primary" id="btnBuatTransfer" href="transfer.html#buat" style="display:none;">+ Buat Transfer</a>
                </div>
            </div>

            <div class="judul-outlet" id="judulTerpilih" style="display:none;"></div>

            <table id="tabelStok">
                <thead id="stockTableHead"></thead>
                <tbody id="stockTableBody">
                    <tr><td colspan="3" class="loading-state">Memuat data stok...</td></tr>
                </tbody>
            </table>

            <div id="daftarOutletLain"></div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let productMap = {};
        let kategoriMap = {};

        // State halaman
        let outletAsal = null;
        let stokAsal = [];            // [{id, nama, kategori, jumlah, minStok}]
        let daftarOutlet = [];

        // Pembagian area (field "area" di koleksi outlets, diatur di Pengaturan)
        const DAFTAR_AREA = ["Area 1", "Area 2", "Area 3"];
        let daftarArea = DAFTAR_AREA.slice();
        let outletArea = {};          // { namaOutlet: "Area 1" }
        let pilihArea = "";           // "" = semua area
        let tokenRingkasan = 0;       // abaikan hasil muat ringkasan yang sudah usang

        function esc(t) {
            return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }

        auth.onAuthStateChanged(function (user) {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const savedUser = sessionStorage.getItem("omaopa_user");

            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                mulaiHalaman();
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        mulaiHalaman();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        function logout() {
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                window.location.href = "index.html";
            });
        }

        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML =
                renderSidebar(currentUser, "stok");

            if (!jagaAksesHalaman(currentUser.role, "stok")) return;

            // Transfer dibuat dari menu Transfer; di sini cukup tombol pintas
            if (bolehBuatTransfer(currentUser.role)) {
                document.getElementById("btnBuatTransfer").style.display = "inline-flex";
            }

            const outletSelect = document.getElementById("outletSelect");

            if (currentUser.role === "kasir") {
                outletSelect.innerHTML = '<option value="' + esc(currentUser.outlet) + '">' + esc(currentUser.outlet) + '</option>';
                outletSelect.disabled = true;
                // Kasir hanya punya satu outlet; nama outlet sudah tampil di judul, jadi dropdown disembunyikan
                outletSelect.parentElement.style.display = "none";
                outletAsal = currentUser.outlet;
                const judul = document.getElementById("judulTerpilih");
                judul.textContent = currentUser.outlet;
                judul.style.display = "block";
                loadStok(currentUser.outlet);

                // Kasir: di bawah stok outletnya, tampilkan outlet lain yang se-area (hanya lihat)
                db.collection("outlets").get().then(function (snapshot) {
                    muatDaftarOutlet(snapshot);
                    pilihArea = outletArea[currentUser.outlet] || "Area 1";
                    judul.innerHTML = esc(currentUser.outlet) + ' <span>· ' + esc(pilihArea) + '</span>';
                    loadOutletLain();
                }).catch(function (error) {
                    document.getElementById("daftarOutletLain").innerHTML =
                        '<div class="empty-state">Stok outlet lain se-area belum bisa ditampilkan: ' + esc(error.message) + '</div>';
                });
            } else {
                // Selain kasir: outlet terpilih di atas, outlet lain di bawahnya per area
                db.collection("outlets").get().then(function (snapshot) {
                    muatDaftarOutlet(snapshot);

                    outletAsal = daftarOutlet.indexOf(currentUser.outlet) !== -1 ? currentUser.outlet : "";
                    document.getElementById("wadahArea").style.display = "block";
                    document.getElementById("labelOutlet").style.display = "block";
                    isiPilihanArea();
                    isiPilihanOutlet();
                    tampilkan();
                });
            }

            document.getElementById("areaSelect").addEventListener("change", function () {
                pilihArea = this.value;
                outletAsal = "";
                isiPilihanOutlet();
                tampilkan();
            });

            outletSelect.addEventListener("change", function () {
                outletAsal = this.value;
                tampilkan();
            });
        }

        // Isi daftarOutlet, outletArea, dan daftarArea dari koleksi outlets
        function muatDaftarOutlet(snapshot) {
            daftarOutlet = [];
            outletArea = {};
            snapshot.forEach(function (doc) {
                daftarOutlet.push(doc.id);
                outletArea[doc.id] = doc.data().area || "Area 1";
            });
            daftarArea = DAFTAR_AREA.slice();
            daftarOutlet.forEach(function (o) {
                if (daftarArea.indexOf(outletArea[o]) === -1) daftarArea.push(outletArea[o]);
            });
        }

        function outletDiArea(area) {
            return daftarOutlet.filter(function (o) { return !area || outletArea[o] === area; });
        }

        function opsiOutlet(list) {
            return list.map(function (o) {
                return '<option value="' + esc(o) + '">' + esc(o) + '</option>';
            }).join("");
        }

        // Opsi outlet dikelompokkan per area (optgroup)
        function opsiOutletPerArea(kecuali) {
            let html = "";
            daftarArea.forEach(function (a) {
                const list = outletDiArea(a).filter(function (o) { return o !== kecuali; });
                if (list.length > 0) html += '<optgroup label="' + esc(a) + '">' + opsiOutlet(list) + '</optgroup>';
            });
            return html;
        }

        function isiPilihanArea() {
            const sel = document.getElementById("areaSelect");
            let html = '<option value="">Semua area (' + daftarOutlet.length + ' outlet)</option>';
            daftarArea.forEach(function (a) {
                html += '<option value="' + esc(a) + '">' + esc(a) + ' (' + outletDiArea(a).length + ' outlet)</option>';
            });
            sel.innerHTML = html;
            sel.value = pilihArea;
        }

        function isiPilihanOutlet() {
            const sel = document.getElementById("outletSelect");
            let html = '<option value="">Semua outlet' + (pilihArea ? ' ' + esc(pilihArea) : '') + '</option>';
            html += pilihArea ? opsiOutlet(outletDiArea(pilihArea)) : opsiOutletPerArea(null);
            sel.innerHTML = html;
            sel.value = outletAsal;
        }

        // Klik nama outlet di daftar bawah -> jadikan outlet terpilih (paling atas)
        function pilihOutlet(nama) {
            outletAsal = nama;
            document.getElementById("outletSelect").value = nama;
            tampilkan();
            window.scrollTo(0, 0);
        }

        // Paling atas: outlet terpilih. Di bawahnya: outlet lain, dikelompokkan per area.
        function tampilkan() {
            const modeSatu = !!outletAsal;

            const judul = document.getElementById("judulTerpilih");
            judul.style.display = modeSatu ? "block" : "none";
            judul.innerHTML = modeSatu ? esc(outletAsal) + ' <span>· ' + esc(outletArea[outletAsal] || "") + '</span>' : "";
            document.getElementById("tabelStok").style.display = modeSatu ? "" : "none";

            if (modeSatu) loadStok(outletAsal);
            loadOutletLain();
        }

        function loadOutletLain() {
            const token = ++tokenRingkasan;
            const wadah = document.getElementById("daftarOutletLain");
            const cakupan = outletDiArea(pilihArea).filter(function (o) { return o !== outletAsal; });

            if (cakupan.length === 0) {
                wadah.innerHTML = "";
                return;
            }
            wadah.innerHTML = '<div class="loading-state">Memuat stok ' + cakupan.length + ' outlet...</div>';

            loadProductNames().then(function () {
                return Promise.all(cakupan.map(function (o) {
                    return db.collection("outlets").doc(o).collection("stock").get().then(function (snapshot) {
                        const isi = [];
                        snapshot.forEach(function (doc) {
                            const d = doc.data();
                            isi.push({
                                nama: productMap[doc.id] || doc.id,
                                jumlah: d.jumlah || 0,
                                minStok: d.minStok !== undefined ? d.minStok : 5
                            });
                        });
                        return isi;
                    });
                }));
            }).then(function (hasil) {
                if (token !== tokenRingkasan) return;
                const stokPerOutlet = {};
                cakupan.forEach(function (o, i) { stokPerOutlet[o] = hasil[i]; });
                renderOutletLain(cakupan, stokPerOutlet);
            }).catch(function (error) {
                if (token !== tokenRingkasan) return;
                wadah.innerHTML = '<div class="empty-state">' +
                    (error.code === "permission-denied"
                        ? "Stok outlet lain belum bisa ditampilkan: akses akun ini dibatasi oleh aturan Firestore."
                        : "Gagal memuat: " + esc(error.message)) +
                    '</div>';
            });
        }

        // Tiap outlet: tabel Produk / Stok / Status (sama seperti tabel atas), dikelompokkan per area
        function renderOutletLain(cakupan, stokPerOutlet) {
            const grup = [];
            daftarArea.forEach(function (a) {
                if (pilihArea && a !== pilihArea) return;
                const list = cakupan.filter(function (o) { return outletArea[o] === a; });
                if (list.length > 0) grup.push({ area: a, outlets: list });
            });

            // Kasir hanya melihat; tidak bisa memindah outlet lain ke atas
            const kasir = currentUser.role === "kasir";
            let html = outletAsal ? '<div class="judul-lain">' + (kasir ? 'Outlet lain di ' + esc(pilihArea) : 'Outlet lainnya') + '</div>' : '';

            grup.forEach(function (g) {
                html += '<div class="area-judul">' + esc(g.area) + ' <span>(' + g.outlets.length + ' outlet)</span></div>';

                g.outlets.forEach(function (o) {
                    const isi = stokPerOutlet[o];
                    let jmlHabis = 0;
                    let jmlMenipis = 0;
                    let rows = "";

                    isi.forEach(function (p) {
                        const st = statusStok(p.jumlah, p.minStok);
                        if (st.teks === "Habis") jmlHabis++;
                        if (st.teks === "Menipis") jmlMenipis++;
                        rows += '<tr><td>' + esc(p.nama) + '</td>' +
                                '<td class="r">' + p.jumlah + '</td>' +
                                '<td class="r"><span class="badge ' + st.kelas + '">' + st.teks + '</span></td></tr>';
                    });
                    if (isi.length === 0) {
                        rows = '<tr><td colspan="3" class="empty-state">Belum ada data stok untuk outlet ini.</td></tr>';
                    }

                    let info = [];
                    if (jmlHabis > 0) info.push('<span style="color:#c0392b; font-weight:700;">' + jmlHabis + ' habis</span>');
                    if (jmlMenipis > 0) info.push('<span style="color:#b06d09; font-weight:700;">' + jmlMenipis + ' menipis</span>');

                    html += '<div class="kartu-outlet">' +
                            '<div class="kartu-head">' +
                                (kasir
                                    ? '<span class="kartu-nama" style="cursor:default; text-decoration:none;">' + esc(o) + '</span>'
                                    : '<span class="kartu-nama" title="Tampilkan paling atas" onclick="pilihOutlet(\'' + escJsAttr(o) + '\')">' + esc(o) + '</span>') +
                                '<span class="kartu-info">' + info.join(" · ") + '</span>' +
                            '</div>' +
                            '<table><thead><tr><th>Produk</th><th class="r">Stok</th><th class="r">Status</th></tr></thead>' +
                            '<tbody>' + rows + '</tbody></table>' +
                            '</div>';
                });
            });

            document.getElementById("daftarOutletLain").innerHTML = html;
        }

        function loadProductNames() {
            if (Object.keys(productMap).length > 0) {
                return Promise.resolve(productMap);
            }
            return db.collection("products").get().then(function (snapshot) {
                snapshot.forEach(function (doc) {
                    productMap[doc.id] = doc.data().nama;
                    kategoriMap[doc.id] = doc.data().kategori || "";
                });
                return productMap;
            });
        }

        function loadStok(outletName) {
            const tbody = document.getElementById("stockTableBody");
            tbody.innerHTML = '<tr><td colspan="3" class="loading-state">Memuat data stok...</td></tr>';
            stokAsal = [];

            loadProductNames().then(function () {
                return db.collection("outlets").doc(outletName).collection("stock").get();
            }).then(function (snapshot) {
                snapshot.forEach(function (doc) {
                    const data = doc.data();
                    stokAsal.push({
                        id: doc.id,
                        nama: productMap[doc.id] || doc.id,
                        kategori: kategoriMap[doc.id] || "",
                        jumlah: data.jumlah || 0,
                        minStok: data.minStok !== undefined ? data.minStok : 5
                    });
                });
                renderTabel();
            }).catch(function (error) {
                document.getElementById("stockTableHead").innerHTML = "";
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Gagal memuat: ' + esc(error.message) + '</td></tr>';
            });
        }

        function renderTabel() {
            const thead = document.getElementById("stockTableHead");
            const tbody = document.getElementById("stockTableBody");

            thead.innerHTML = '<tr><th>Produk</th><th class="r">Stok</th><th class="r">Status</th></tr>';

            if (stokAsal.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Belum ada data stok untuk outlet ini.</td></tr>';
                return;
            }

            tbody.innerHTML = "";

            stokAsal.forEach(function (p) {
                const st = statusStok(p.jumlah, p.minStok);
                const row = document.createElement("tr");
                row.innerHTML =
                    '<td>' + esc(p.nama) + '</td>' +
                    '<td class="r">' + p.jumlah + '</td>' +
                    '<td class="r"><span class="badge ' + st.kelas + '">' + st.teks + '</span></td>';
                tbody.appendChild(row);
            });
        }

        function statusStok(jumlah, minStok) {
            if (jumlah <= 0) return { kelas: "badge-habis", teks: "Habis" };
            if (jumlah <= minStok) return { kelas: "badge-menipis", teks: "Menipis" };
            return { kelas: "badge-aman", teks: "Aman" };
        }
    </script>

</body>
</html>
