            DETAIL_KATEGORI.forEach(function (d) { jual[d.nama] = nol(); disk[d.nama] = nol(); });
            function tambahPeta(target, sumber, i) {
                Object.keys(sumber || {}).forEach(function (k) {
                    const d = cariDetailKategori(k) ? k : DETAIL_CADANGAN;
                    target[d][i] += Number(sumber[k]) || 0;
                });
            }

            let jumlahDok = 0;
            docs.forEach(function (doc) {
                if (f.area && areaDariOutlet(doc.outlet) !== f.area) return;
                if (f.outlet && (doc.outlet || "-") !== f.outlet) return;
                let terpakai = false;
                s.kolom.forEach(function (k, i) {
                    if (!doc.tanggal || doc.tanggal < k.dari || doc.tanggal > k.sampai) return;
                    terpakai = true;
                    tambahPeta(jual, doc.penjualan, i);
                    tambahPeta(disk, doc.diskon, i);
                });
                if (terpakai) jumlahDok++;
            });

            const baris = [];
            function tambahBaris(akun, ket, nilai, jenis) { baris.push({ akun: akun, ket: ket, nilai: nilai, jenis: jenis }); }
            function jumlahkan(total, nilai) { nilai.forEach(function (v, i) { total[i] += v || 0; }); }

            // Penjualan per akun
            const totalJual = nol();
            DETAIL_KATEGORI.forEach(function (d) {
                tambahBaris(d.penjualan[0], d.penjualan[1], jual[d.nama], "akun");
                jumlahkan(totalJual, jual[d.nama]);
            });
            tambahBaris("", "Total Sales", totalJual, "utama");

            // Diskon: beberapa detail berbagi satu akun -> satu baris, angka negatif
            const grupDiskon = [], petaDiskon = {};
            DETAIL_KATEGORI.forEach(function (d) {
                const kode = d.diskon[0];
                if (!petaDiskon[kode]) { petaDiskon[kode] = { akun: d.diskon, nilai: nol() }; grupDiskon.push(petaDiskon[kode]); }
                disk[d.nama].forEach(function (v, i) { petaDiskon[kode].nilai[i] -= v; });
            });
            const totalDisk = nol();
            grupDiskon.forEach(function (g) {
                tambahBaris(g.akun[0], g.akun[1], g.nilai, "akun");
                jumlahkan(totalDisk, g.nilai);
            });
            tambahBaris("", "Total Discount", totalDisk, "total");
            const netSales = totalJual.map(function (v, i) { return v + totalDisk[i]; });
            tambahBaris("", "Net Sales", netSales, "utama");

            // COGS = penjualan x HPP % (null kalau HPP % belum diisi)
            const belumHpp = [];
            const totalCogs = nol();
            DETAIL_KATEGORI.forEach(function (d) {
                const p = hpp[d.nama];
                const ada = typeof p === "number" && isFinite(p);
                const nilai = jual[d.nama].map(function (v) {
                    if (!v) return 0;
                    return ada ? Math.round(v * p / 100) : null;
                });
                if (!ada && jual[d.nama].some(function (v) { return v; })) belumHpp.push(d.nama);
                tambahBaris(d.cogs[0], d.cogs[1], nilai, "akun");
                jumlahkan(totalCogs, nilai);
            });
            tambahBaris("", "Total Cost of Goods Sold", totalCogs, "total");
            tambahBaris("", "Gross Profit", netSales.map(function (v, i) { return v - totalCogs[i]; }), "utama");

            // Kolom tambahan: Total, atau Selisih & %
            const header = s.kolom.map(function (k) { return k.label; });
            let idxPersen = -1;
            if (s.tambahan === "total") header.push("Total");
            if (s.tambahan === "banding") { header.push("Selisih", "%"); idxPersen = n + 1; }
            baris.forEach(function (b) {
                if (s.tambahan === "total") {
                    let tot = 0, adaNull = false;
                    b.nilai.forEach(function (v) { if (v === null) adaNull = true; else tot += v; });
                    b.nilai.push(adaNull ? null : tot);
                } else if (s.tambahan === "banding") {
                    const a = b.nilai[0], c = b.nilai[1];
                    const selisih = (a === null || c === null) ? null : c - a;
                    b.nilai.push(selisih, (selisih === null || a === 0) ? null : selisih / Math.abs(a) * 100);
                }
            });

            // Sembunyikan akun yang nol di semua kolom (baris total selalu tampil)
            const tampil = f.nol === "sembunyi"
                ? baris.filter(function (b) { return b.jenis !== "akun" || !b.nilai.slice(0, n).every(function (v) { return v === 0; }); })
                : baris;

            return { s: s, header: header, idxPersen: idxPersen, baris: tampil, belumHpp: belumHpp, jumlahDok: jumlahDok };
        }

        function hasilLabaRugi() {
            return hitungLabaRugi(dataLR, susunKolomLR(filterLRTerpakai), hppLR, filterLRTerpakai);
        }

        // Angka id-ID tanpa desimal, negatif pakai "-"; null = "–"
        function angkaLR(v, persen) {
            if (v === null || v === undefined) return "–";
            if (persen) {
                const p = Math.round(v * 10) / 10;
                return (p < 0 ? "-" : "") + Math.abs(p).toLocaleString("id-ID", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
            }
            const x = Math.round(v);
            return (x < 0 ? "-" : "") + Math.abs(x).toLocaleString("id-ID");
        }

        function teksBelumHpp(h) {
            return "HPP % belum diisi untuk: " + h.belumHpp.join(", ") + ". COGS & Gross Profit belum lengkap.";
        }

        function renderLabaRugi() {
            if (!laporanAktif || laporanAktif.key !== "labarugi" || !filterLRTerpakai || !lrSiap || lrError) return;
            tulisInfoLR();
            const h = hasilLabaRugi();
            const wadah = document.getElementById("isiLaporan");
            if (h.s.kolom.length === 0) {
                wadah.innerHTML = '<div class="empty-state">Bulan ini belum berjalan, belum ada hari yang bisa ditampilkan.</div>';
                return;
            }

            let html = "";
            if (h.jumlahDok === 0) {
                html += '<div class="catatan">Belum ada ringkasan harian untuk periode & filter ini. Untuk bulan sebelum Kasir mulai mencatat ringkasan, jalankan <b>Hitung ulang ringkasan</b> (management).</div>';
            }
            if (hppLRGagal) {
                html += '<div class="catatan">HPP % belum bisa dibaca (akses koleksi detail_kategori dibatasi aturan Firestore), COGS dianggap belum diisi.</div>';
            }
            html += '<div class="scroll-x"><table class="tabel-lr"><thead><tr><th>Akun</th><th>Keterangan</th>';
            h.header.forEach(function (k) { html += '<th class="n">' + escapeHtmlAman(k) + '</th>'; });
            html += '</tr></thead><tbody>';
            h.baris.forEach(function (b) {
                const kelas = b.jenis === "utama" ? ' class="baris-utama"' : (b.jenis === "total" ? ' class="baris-total"' : '');
                html += '<tr' + kelas + '><td>' + escapeHtmlAman(b.akun) + '</td><td>' + escapeHtmlAman(b.ket) + '</td>' +
                    b.nilai.map(function (v, i) { return '<td class="n">' + angkaLR(v, i === h.idxPersen) + '</td>'; }).join("") + '</tr>';
            });
            html += '</tbody></table></div>';
            if (h.belumHpp.length) {
                html += '<div class="hint-text">' + escapeHtmlAman(teksBelumHpp(h)) +
                    ' <a class="link-hint" href="pengaturan.html">atur di Pengaturan &gt; Pemetaan &amp; HPP</a></div>';
            }
            wadah.innerHTML = html;
        }

        /* ===== Download Laba Rugi ===== */
        function siapDownloadLR() {
            if (!filterLRTerpakai || !lrSiap || lrError) { alert("Klik Tampilkan laporan dulu, tunggu tabelnya muncul, baru download."); return null; }
            const h = hasilLabaRugi();
            if (h.s.kolom.length === 0) { alert("Belum ada hari yang bisa ditampilkan untuk bulan ini."); return null; }
            return h;
        }

        function namaFileLR(ext) {
            const f = filterLRTerpakai;
            return laporanAktif.file + "_" + f.tahun + "-" + dua(Number(f.bulan)) + "_" + f.tampilan + "." + ext;
        }

        function infoLR(h) {
            const f = filterLRTerpakai;
            return [
                ["Periode", h.s.periode],
                ["Tampilan", labelDari(PILIHAN_TAMPILAN_LR, f.tampilan)],
                ["Area", f.area || "Semua"],
                ["Outlet", f.outlet || "Semua"],
                ["Dibuat", waktuSekarang() + " oleh " + (currentUser.nama || "-")]
            ];
        }

        function downloadExcelLabaRugi() {
            const h = siapDownloadLR();
            if (!h) return;
            if (typeof XLSX === "undefined") { alert("Library Excel belum termuat. Cek koneksi internet lalu muat ulang halaman."); return; }

            const aoa = [[NAMA_PERUSAHAAN], ["Laporan", "Laba Rugi"]].concat(infoLR(h));
            aoa.push([], ["Akun", "Keterangan"].concat(h.header));
            h.baris.forEach(function (b) {
                aoa.push([b.akun, b.ket].concat(b.nilai.map(function (v, i) {
                    if (v === null) return "–";
                    return i === h.idxPersen ? Math.round(v * 10) / 10 : Math.round(v);
                })));
            });
            if (h.belumHpp.length) aoa.push([], ["Catatan", teksBelumHpp(h) + " Atur di Pengaturan > Pemetaan & HPP."]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws["!cols"] = [{ wch: 12 }, { wch: 28 }].concat(h.header.map(function () { return { wch: 14 }; }));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laba Rugi");
            XLSX.writeFile(wb, namaFileLR("xlsx"));
        }

        function downloadPdfLabaRugi() {
            const h = siapDownloadLR();
            if (!h) return;
            if (!window.jspdf || !window.jspdf.jsPDF) { alert("Library PDF belum termuat. Cek koneksi internet lalu muat ulang halaman."); return; }
            const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
            if (typeof doc.autoTable !== "function") { alert("Library tabel PDF belum termuat. Muat ulang halaman."); return; }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(teksPdf(NAMA_PERUSAHAAN + " — Laba Rugi"), 14, 15);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            const lines = doc.splitTextToSize(teksPdf(infoLR(h).map(function (r) { return r[0] + ": " + r[1]; }).join("  |  ")), 269);
            doc.text(lines, 14, 21);
            const y = 21 + lines.length * 3.6 + 2;

            const banyak = h.header.length > 8;
            const kanan = {};
            h.header.forEach(function (_, i) { kanan[i + 2] = { halign: "right" }; });
            const jenis = h.baris.map(function (b) { return b.jenis; });
            doc.autoTable({
                startY: y,
                theme: "grid",
                styles: { fontSize: banyak ? 5.5 : 8, cellPadding: banyak ? 0.8 : 1.6 },
                headStyles: { fillColor: [18, 48, 92], textColor: 255 },
                margin: { left: banyak ? 6 : 14, right: banyak ? 6 : 14 },
                columnStyles: kanan,
                head: [["Akun", "Keterangan"].concat(h.header).map(teksPdf)],
                body: h.baris.map(function (b) {
                    return [b.akun, b.ket].concat(b.nilai.map(function (v, i) { return angkaLR(v, i === h.idxPersen); })).map(teksPdf);
                }),
                didParseCell: function (data) {
                    if (data.section === "body" && jenis[data.row.index] !== "akun") {
                        data.cell.styles.fontStyle = "bold";
                        data.cell.styles.fillColor = jenis[data.row.index] === "utama" ? [233, 240, 251] : [241, 244, 248];
                    }
                }
            });
            if (h.belumHpp.length) {
                doc.setFontSize(8);
                doc.text(doc.splitTextToSize(teksPdf(teksBelumHpp(h) + " Atur di Pengaturan > Pemetaan & HPP."), 269), 14, doc.lastAutoTable.finalY + 6);
            }
            doc.save(namaFileLR("pdf"));
        }

        /* =====================================================
           HITUNG ULANG RINGKASAN HARIAN (hanya management)
           Untuk bulan sebelum Kasir mencatat ringkasan, atau kalau angka
           ringkasan tidak cocok dengan transaksi.
        ====================================================== */

        /* Fungsi murni (tanpa Firestore, bisa diuji): transaksi -> dokumen ringkasan_harian.
           daftarTrx: data transaksi { outlet, waktu (Timestamp/Date), status, items, diskonPromo }
           detailProduk(productId): detail kategori produk saat ini.
           Hasil: { "<outlet>__<yyyy-mm-dd>": { outlet, tanggal, tahun, bulan, trx, penjualan, diskon, qty } } */
        function hitungRingkasanDariTransaksi(daftarTrx, detailProduk) {
            const hasil = {};
            (daftarTrx || []).forEach(function (t) {
                if (!t || t.status === "batal") return;
                const w = t.waktu && typeof t.waktu.toDate === "function" ? t.waktu.toDate() : (t.waktu && typeof t.waktu.getTime === "function" ? t.waktu : null);
                if (!w || isNaN(w.getTime())) return;
                const tanggal = keuTanggalIso(w);
                const outlet = t.outlet || "-";
                const id = keuIdRingkasan(outlet, tanggal);
                if (!hasil[id]) {
                    hasil[id] = { outlet: outlet, tanggal: tanggal, tahun: w.getFullYear(), bulan: w.getMonth() + 1, trx: 0, penjualan: {}, diskon: {}, qty: {} };
                }
                const h = hasil[id];
                const r = keuRingkasTransaksi(t, detailProduk);
                h.trx++;
                ["penjualan", "diskon", "qty"].forEach(function (k) {
                    Object.keys(r[k]).forEach(function (d) { h[k][d] = (h[k][d] || 0) + r[k][d]; });
                });
            });
            return hasil;
        }

        let hitungUlangJalan = false;

        function statusHitung(teks) { document.getElementById("huStatus").textContent = teks; }

        function bukaPanelHitungUlang() {
            if (!currentUser || currentUser.role !== "management") return;
            const n = new Date();
            const fb = filterLR || filterLRBawaan();
            setOpsi(document.getElementById("huBulan"), opsiBulanHtml(), fb.bulan || String(n.getMonth() + 1));
            setOpsi(document.getElementById("huTahun"), opsiHtml(daftarTahunLR().map(function (t) { return [t, t]; })), fb.tahun || String(n.getFullYear()));
            ["huBulan", "huTahun"].forEach(function (id) { document.getElementById(id).classList.remove("dipilih"); });
            if (!hitungUlangJalan) statusHitung("");
            document.getElementById("panelHitungUlang").style.display = "block";
        }

        function tutupPanelHitungUlang() {
            document.getElementById("panelHitungUlang").style.display = "none";
        }

        function mulaiHitungUlang() {
            if (hitungUlangJalan || !currentUser || currentUser.role !== "management") return;
            const th = Number(document.getElementById("huTahun").value);
            const bl = Number(document.getElementById("huBulan").value);
            const awal = new Date(th, bl - 1, 1), akhir = new Date(th, bl, 1);
            if (awal > new Date()) { statusHitung(teksBulan(th, bl) + " belum berjalan, tidak ada yang dihitung."); return; }

            hitungUlangJalan = true;
            document.getElementById("huMulai").disabled = true;
            document.getElementById("huTutup").disabled = true;
            statusHitung("Membaca transaksi " + teksBulan(th, bl) + "…");

            const koleksi = db.collection("ringkasan_harian");
            let ringkas = {}, jumlahHapus = 0, jumlahTrx = 0;
            Promise.all([
                db.collection("transactions")
                    .where("waktu", ">=", firebase.firestore.Timestamp.fromDate(awal))
                    .where("waktu", "<", firebase.firestore.Timestamp.fromDate(akhir))
                    .get(),
                koleksi.where("tanggal", ">=", awalBulanIso(th, bl)).where("tanggal", "<=", akhirBulanIso(th, bl)).get()
            ]).then(function (hasil) {
                const daftar = [];
                hasil[0].forEach(function (doc) { daftar.push(doc.data()); });
                ringkas = hitungRingkasanDariTransaksi(daftar, function (pid) { return detailProdukMap[pid] || ""; });
                const ids = Object.keys(ringkas);
                ids.forEach(function (id) { jumlahTrx += ringkas[id].trx; });

                // Operasi tulis: set (tanpa merge) + hapus ringkasan yang tidak punya transaksi lagi
                const ops = ids.map(function (id) {
                    return { ref: koleksi.doc(id), data: Object.assign({}, ringkas[id], { diperbarui: firebase.firestore.FieldValue.serverTimestamp() }) };
                });
                hasil[1].forEach(function (doc) {
                    if (!ringkas[doc.id]) { ops.push({ ref: doc.ref, hapus: true }); jumlahHapus++; }
                });

                statusHitung("Menulis " + ids.length + " ringkasan…");
                let urutan = Promise.resolve();
                for (let i = 0; i < ops.length; i += 400) {
                    (function (potong, mulai) {
                        urutan = urutan.then(function () {
                            const batch = db.batch();
                            potong.forEach(function (o) { if (o.hapus) batch.delete(o.ref); else batch.set(o.ref, o.data); });
                            statusHitung("Menulis " + ids.length + " ringkasan… (" + Math.min(mulai + potong.length, ops.length) + "/" + ops.length + " operasi)");
                            return batch.commit();
                        });
                    })(ops.slice(i, i + 400), i);
                }
                return urutan;
            }).then(function () {
                statusHitung("Selesai: " + teksBulan(th, bl) + " · " + angka(jumlahTrx) + " transaksi · " +
                    angka(Object.keys(ringkas).length) + " ringkasan ditulis · " + angka(jumlahHapus) + " ringkasan lama dihapus.");
                // Tabel yang sedang tampil dimuat ulang supaya angkanya ikut baru
                if (laporanAktif && laporanAktif.key === "labarugi" && filterLRTerpakai) muatDataLR();
            }).catch(function (error) {
                statusHitung(error.code === "permission-denied"
                    ? "Gagal: akses ditolak aturan Firestore (transactions / ringkasan_harian)."
                    : "Gagal: " + error.message);
            }).then(function () {
                hitungUlangJalan = false;
                document.getElementById("huMulai").disabled = false;
                document.getElementById("huTutup").disabled = false;
            });
        }
    </script>
