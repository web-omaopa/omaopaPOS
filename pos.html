<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Kasir</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 190px; flex-shrink: 0; background: #12305C;
            border-right: 1px solid #0B2245; padding: 20px 14px;
            display: flex; flex-direction: column;
        }
        .sidebar .brand { font-weight: 800; font-size: 15px; color: #ffffff; margin-bottom: 18px; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; padding: 22px 26px; }

        .top-row { display: flex; gap: 12px; margin-bottom: 16px; }

        .search-box {
            flex: 1; height: 42px; padding: 0 16px; border: 1px solid #dde3ea;
            border-radius: 10px; font-size: 13px; outline: none; background: #ffffff;
        }
        .search-box:focus { border-color: #12305C; }

        .kategori-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

        .kategori-tab {
            padding: 8px 16px; border-radius: 20px; border: 1px solid #dde3ea;
            background: #ffffff; font-size: 12px; font-weight: 700; color: #6b7280;
            cursor: pointer;
        }
        .kategori-tab.active { background: #12305C; border-color: #12305C; color: white; }

        .mode-section-cart {
            background: #12305C; margin: -18px -18px 16px -18px; padding: 16px 18px;
            border-radius: 14px 14px 0 0;
        }
        .mode-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .mode-tile {
            padding: 7px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.45);
            background: transparent; cursor: pointer; font-size: 11px; font-weight: 700;
            color: #ffffff; font-family: inherit;
        }
        .mode-tile:hover { background: rgba(255,255,255,0.12); }
        .mode-tile.active { background: #ffffff; border-color: #ffffff; color: #12305C; }

        .pos-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
        @media (max-width: 900px) { .pos-grid { grid-template-columns: 1fr; } }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

        .product-card {
            background: #ffffff; border: 1px solid #dde3ea; border-radius: 14px;
            overflow: hidden; cursor: pointer; transition: 0.15s;
        }
        .product-card:hover { border-color: #12305C; transform: translateY(-2px); }

        .product-card .img-area {
            height: 90px; background: #fdf0dc; display: flex;
            align-items: center; justify-content: center; font-size: 36px;
        }
        .product-card .img-area img { width: 100%; height: 100%; object-fit: cover; }

        .product-card .info { padding: 10px 12px; }
        .product-card .name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
        .product-card .stok { font-size: 11px; color: #6b7280; }
        .product-card .stok.habis { color: #c0392b; font-weight: 700; }
        .product-card.disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-state, .loading-state { grid-column: 1 / -1; text-align: center; color: #6b7280; font-size: 12px; padding: 30px 0; }

        .cart-card {
            background: #ffffff; border: 1px solid #dde3ea; border-radius: 14px;
            padding: 18px; display: flex; flex-direction: column;
        }
        .cart-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

        .cart-item { padding: 10px 0; border-bottom: 1px solid #e8ecf1; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .cart-item .nama { font-size: 13px; font-weight: 700; }
        .cart-item .topping-tag { font-size: 10px; color: #a89a8c; margin-top: 2px; }
        .cart-item .harga { font-size: 12px; font-weight: 700; white-space: nowrap; }

        .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .qty-btn { width: 22px; height: 22px; border: 1px solid #dde3ea; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1; }
        .qty-num { font-size: 12px; font-weight: 700; min-width: 14px; text-align: center; }

        .cart-empty { font-size: 12px; color: #6b7280; text-align: center; padding: 24px 0; }

        .promo-applied-box {
            background: #E7F6ED; border: 1px solid #BFE6CD; border-radius: 10px;
            padding: 8px 12px; margin-top: 10px;
        }
        .promo-applied-title {
            font-size: 10.5px; font-weight: 800; color: #1E9E5A; text-transform: uppercase;
            letter-spacing: 0.03em; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
        }
        .promo-applied-row { display: flex; justify-content: space-between; font-size: 11.5px; color: #1e7d32; padding: 2px 0; }

        .summary-row { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; padding: 4px 0; }
        .summary-row.total { font-size: 16px; font-weight: 700; color: #1f2937; padding-top: 8px; border-top: 1px solid #e8ecf1; margin-top: 8px; }

        .cart-actions { display: flex; gap: 8px; margin-top: 14px; }
        .btn-bersihkan { flex: 1; height: 40px; border-radius: 8px; border: 1px solid #dde3ea; background: #fff; color: #52606d; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-bayar { flex: 2; height: 40px; border-radius: 8px; border: none; background: #12305C; color: white; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-bayar:hover { background: #0B2245; }
        .btn-bayar:disabled { background: #e8c99a; cursor: not-allowed; }

        select.metode-bayar { width: 100%; height: 38px; border: 1px solid #dde3ea; border-radius: 8px; padding: 0 10px; font-size: 12px; margin-top: 10px; }

        .msg-box { font-size: 11px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; display: none; }
        .msg-error { background: #fdeaea; color: #c0392b; }
        .msg-success { background: #eaf6ea; color: #1e7d32; }

        .denied-state { text-align: center; color: #6b7280; font-size: 12px; padding: 40px 0; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(75, 43, 29, 0.4); align-items: center; justify-content: center; z-index: 20;
        }
        .modal-overlay.open { display: flex; }

        .modal-box { background: #ffffff; border-radius: 14px; padding: 22px; width: 100%; max-width: 340px; }
        .modal-box h3 { font-size: 15px; margin-bottom: 4px; }
        .modal-box .modal-sub { font-size: 11px; color: #6b7280; margin-bottom: 14px; }

        .topping-option {
            display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-bottom: 1px solid #e8ecf1; cursor: pointer;
        }
        .topping-option input { width: 16px; height: 16px; accent-color: #12305C; }
        .topping-option .t-nama { flex: 1; font-size: 13px; }
        .topping-option .t-harga { font-size: 12px; color: #6b7280; }

        .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
        .modal-actions button { flex: 1; height: 40px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: none; border: 1px solid #dde3ea; color: #52606d; }
        .btn-save { background: #12305C; color: white; border: none; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>

        <div class="content" id="mainContent">
            <div class="loading-state">Memeriksa akses...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalTopping">
        <div class="modal-box">
            <h3 id="modalToppingNama">Pilih Topping</h3>
            <div class="modal-sub">Bisa pilih lebih dari satu</div>
            <div id="toppingOptionsList"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupModalTopping()">Batal</button>
                <button class="btn-save" onclick="konfirmasiTopping()">Tambah ke Keranjang</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allProducts = [];
        let stockMap = {};
        let cart = {};
        let kategoriAktif = "Semua";
        let produkUntukTopping = null;

        let daftarTopping = [];

        /* =====================================================
           MODE PENJUALAN (Offline, GoFood, GrabFood, ShopeeFood, dll)
           "Offline" selalu ada (pakai field harga dasar produk).
           Mode lain dikelola admin di Pengaturan > Produk, disimpan
           di collection "mode_penjualan".
        ====================================================== */
        let modeAktif = "Offline";
        let daftarModePenjualan = [];

        /* =====================================================
           PROMO
           Daftar promo aktif dimuat sekali di awal (loadPromo).
           Penerapannya dihitung ulang tiap kali keranjang berubah,
           lewat sinkronPromoOtomatis() (menambah/menghapus item
           gratis dari promo Beli X Gratis Y secara otomatis) dan
           computePromoEffects() (menghitung total diskon dari semua
           promo yang berlaku, ditampilkan di baris "Diskon").
           Harga satuan tiap item keranjang TIDAK diubah langsung
           supaya tetap transparan; promo hanya mengurangi total
           lewat baris diskon.
        ====================================================== */
        let daftarPromo = [];

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }

            const savedUser = sessionStorage.getItem("omaopa_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                mulaiHalaman();
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        mulaiHalaman();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        function logout() {
            if (stockUnsubscribe) { stockUnsubscribe(); stockUnsubscribe = null; }
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                window.location.href = "index.html";
            });
        }

        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "kasir");
            if (!jagaAksesHalaman(currentUser.role, "kasir")) return;
            renderMainContent();
            loadModePenjualan();
            loadTopping();
            loadProducts();
            loadPromo();
        }

        function loadPromo() {
            db.collection("promo").get().then(function (snapshot) {
                daftarPromo = [];
                snapshot.forEach(function (doc) { daftarPromo.push(Object.assign({ id: doc.id }, doc.data())); });
                renderCart();
            }).catch(function (error) {
                daftarPromo = [];
                console.error("Gagal memuat promo:", error.message);
            });
        }

        /* Promo dianggap berlaku sekarang kalau: statusnya aktif,
           tanggal sekarang ada dalam rentang tanggalMulai/Berakhir
           (kalau diisi), outlet kasir ini termasuk outletList (atau
           outletList kosong = semua outlet), dan mode jual aktif
           termasuk modeList (atau modeList kosong = semua mode). */
        function promoBerlakuSekarang(promo) {
            if (!promo || promo.status !== "aktif") return false;
            const todayStr = new Date().toISOString().slice(0, 10);
            if (promo.tanggalMulai && todayStr < promo.tanggalMulai) return false;
            if (promo.tanggalBerakhir && todayStr > promo.tanggalBerakhir) return false;
            const outletList = promo.outletList || [];
            if (outletList.length > 0 && outletList.indexOf(currentUser.outlet) === -1) return false;
            const modeList = promo.modeList || [];
            if (modeList.length > 0 && modeList.indexOf(modeAktif) === -1) return false;
            return true;
        }

        /* Tambah/hapus otomatis item gratis dari promo Beli X Gratis Y
           sesuai isi keranjang sekarang. Dipanggil di awal renderCart()
           supaya selalu sinkron tiap kali keranjang berubah. */
        function sinkronPromoOtomatis() {
            const promoGratisAktif = daftarPromo.filter(function (p) { return p.tipe === "beli_gratis" && promoBerlakuSekarang(p); });

            promoGratisAktif.forEach(function (promo) {
                const entryKey = "_promo_" + promo.id;
                const gratisProduct = allProducts.find(function (p) { return p.id === promo.gratisProdukId; });

                const buyQty = Object.values(cart)
                    .filter(function (i) { return !i.isPromoGratis && i.productId === promo.beliProdukId; })
                    .reduce(function (sum, i) { return sum + i.qty; }, 0);

                const beliJumlah = Number(promo.beliJumlah) || 0;
                const gratisJumlah = Number(promo.gratisJumlah) || 0;
                const multiplier = beliJumlah > 0 ? Math.floor(buyQty / beliJumlah) : 0;
                let targetQty = multiplier * gratisJumlah;

                if (!gratisProduct || targetQty <= 0) {
                    delete cart[entryKey];
                    return;
                }

                // Batasi sesuai sisa stok (dikurangi qty produk yang sama yang sudah ditambah manual)
                const stokProduk = stockMap[promo.gratisProdukId] || 0;
                const qtyManualSama = Object.values(cart)
                    .filter(function (i) { return !i.isPromoGratis && i.productId === promo.gratisProdukId; })
                    .reduce(function (sum, i) { return sum + i.qty; }, 0);
                const sisaStok = Math.max(0, stokProduk - qtyManualSama);
                targetQty = Math.min(targetQty, sisaStok);

                if (targetQty <= 0) {
                    delete cart[entryKey];
                    return;
                }

                const hargaSatuan = hargaUntukMode(gratisProduct, modeAktif);
                cart[entryKey] = {
                    productId: promo.gratisProdukId, nama: gratisProduct.nama, hargaSatuan: hargaSatuan,
                    hargaDasar: hargaSatuan, toppings: [], qty: targetQty, lacakStok: true,
                    isPromoGratis: true, promoId: promo.id, promoNama: promo.nama
                };
            });
        }

        /* Hitung total diskon dari semua promo yang berlaku sekarang,
           berdasarkan isi keranjang. Tidak mengubah harga satuan item,
           hanya menghasilkan satu angka diskon total + daftar nama
           promo yang terpakai (dipakai juga saat simpan transaksi). */
        function computePromoEffects() {
            const promos = daftarPromo.filter(promoBerlakuSekarang);

            const sisaQty = {};
            const hargaDasarMap = {};
            Object.values(cart).forEach(function (item) {
                if (item.isPromoGratis) return;
                sisaQty[item.productId] = (sisaQty[item.productId] || 0) + item.qty;
                hargaDasarMap[item.productId] = item.hargaDasar;
            });

            let totalDiskon = 0;
            const promoDipakai = [];
            const diskonPerPromo = {}; // promoId -> { nama, jumlah }

            function tambahDiskonPromo(promo, jumlah) {
                if (jumlah <= 0) return;
                if (!diskonPerPromo[promo.id]) diskonPerPromo[promo.id] = { nama: promo.nama, jumlah: 0 };
                diskonPerPromo[promo.id].jumlah += jumlah;
                totalDiskon += jumlah;
                promoDipakai.push(promo.nama);
            }

            // Diskon Persen / Diskon Nominal / Harga Spesial: satu produk hanya
            // diklaim oleh promo pertama yang cocok, supaya tidak dobel diskon.
            promos.forEach(function (promo) {
                if (promo.tipe !== "diskon_persen" && promo.tipe !== "diskon_nominal" && promo.tipe !== "harga_spesial") return;
                (promo.produkIds || []).forEach(function (pid) {
                    const qty = sisaQty[pid] || 0;
                    if (qty <= 0) return;
                    const hargaDasar = hargaDasarMap[pid];
                    if (hargaDasar === undefined) return;

                    let diskonPerUnit = 0;
                    if (promo.tipe === "diskon_persen") diskonPerUnit = hargaDasar * (Number(promo.nilai) || 0) / 100;
                    else if (promo.tipe === "diskon_nominal") diskonPerUnit = Math.min(hargaDasar, Number(promo.nilai) || 0);
                    else if (promo.tipe === "harga_spesial") diskonPerUnit = Math.max(0, hargaDasar - (Number(promo.nilai) || 0));

                    tambahDiskonPromo(promo, diskonPerUnit * qty);
                    sisaQty[pid] = 0;
                });
            });

            // Bundling: hitung dari sisa qty yang belum diklaim promo lain
            promos.forEach(function (promo) {
                if (promo.tipe !== "bundling") return;
                const grup = promo.grupProdukIds || [];

                let totalQtyGrup = 0, totalHargaGrup = 0;
                grup.forEach(function (pid) {
                    const qty = sisaQty[pid] || 0;
                    totalQtyGrup += qty;
                    totalHargaGrup += qty * (hargaDasarMap[pid] || 0);
                });

                const syarat = Number(promo.syaratJumlah) || 0;
                if (syarat <= 0 || totalQtyGrup < syarat) return;

                const multiplier = Math.floor(totalQtyGrup / syarat);
                const coveredQty = multiplier * syarat;
                const normalPriceCovered = totalQtyGrup > 0 ? totalHargaGrup * (coveredQty / totalQtyGrup) : 0;

                let diskonBundle = 0;
                if (promo.hasilTipe === "harga_paket") {
                    diskonBundle = normalPriceCovered - (multiplier * (Number(promo.hasilNilai) || 0));
                } else if (promo.hasilTipe === "diskon_persen") {
                    diskonBundle = normalPriceCovered * (Number(promo.hasilNilai) || 0) / 100;
                } else if (promo.hasilTipe === "diskon_rp") {
                    diskonBundle = multiplier * (Number(promo.hasilNilai) || 0);
                }

                if (diskonBundle > 0) {
                    tambahDiskonPromo(promo, diskonBundle);
                    grup.forEach(function (pid) {
                        const qty = sisaQty[pid] || 0;
                        if (totalQtyGrup > 0 && qty > 0) sisaQty[pid] = qty - (qty * (coveredQty / totalQtyGrup));
                    });
                }
            });

            // Beli X Gratis Y: item gratis sudah masuk keranjang dengan harga normal
            // (lewat sinkronPromoOtomatis), jadi didiskon penuh di sini supaya jadi Rp 0.
            promos.forEach(function (promo) {
                if (promo.tipe !== "beli_gratis") return;
                const entry = cart["_promo_" + promo.id];
                if (!entry) return;
                tambahDiskonPromo(promo, entry.hargaSatuan * entry.qty);
            });

            return {
                totalDiskon: Math.round(totalDiskon),
                promoDipakai: Array.from(new Set(promoDipakai)),
                promoDetail: Object.values(diskonPerPromo).map(function (d) { return { nama: d.nama, jumlah: Math.round(d.jumlah) }; })
            };
        }

        function loadTopping() {
            db.collection("products")
                .where("status", "==", "aktif")
                .where("kategori", "==", "Topping")
                .get()
                .then(function (snapshot) {
                    daftarTopping = [];
                    snapshot.forEach(function (doc) { daftarTopping.push(Object.assign({ id: doc.id }, doc.data())); });
                });
        }

        function loadModePenjualan() {
            db.collection("mode_penjualan").get().then(function (snapshot) {
                daftarModePenjualan = [];
                snapshot.forEach(function (doc) { daftarModePenjualan.push(doc.id); });
                daftarModePenjualan.sort();
                renderModeTabs();
            }).catch(function () {
                daftarModePenjualan = [];
                renderModeTabs();
            });
        }

        function renderModeTabs() {
            const container = document.getElementById("modeTabs");
            if (!container) return;

            const semuaMode = ["Offline"].concat(daftarModePenjualan);
            container.innerHTML = semuaMode.map(function (m) {
                const aktif = m === modeAktif;
                return '<button type="button" class="mode-tile' + (aktif ? ' active' : '') +
                    '" onclick="pilihMode(\'' + m.replace(/'/g, "") + '\')">' + m + '</button>';
            }).join("");
        }

        function pilihMode(mode) {
            if (mode === modeAktif) return;

            const cartTidakKosong = Object.keys(cart).length > 0;
            if (cartTidakKosong) {
                const lanjut = confirm(
                    "Ganti mode penjualan ke \"" + mode + "\" akan mengosongkan keranjang (harga bisa beda tiap mode). Lanjutkan?"
                );
                if (!lanjut) return;
                cart = {};
                renderCart();
            }

            modeAktif = mode;
            renderModeTabs();
            renderProdukTampil();
        }

        /* =====================================================
           Harga & ketersediaan produk mengikuti mode aktif.
           - Offline: selalu tersedia, pakai field harga dasar.
           - Mode lain: produk DIJUAL di mode itu HANYA KALAU
             modeHarga[mode].harga diisi (>0). Kalau kosong/belum
             diatur sama sekali, produk dianggap TIDAK dijual di
             mode itu (tidak ada fallback ke harga Offline lagi).
        ====================================================== */
        function tersediaDiMode(p, mode) {
            if (mode === "Offline") return true;
            const cfg = p.modeHarga && p.modeHarga[mode];
            return !!(cfg && cfg.tersedia && cfg.harga !== null && cfg.harga !== undefined && cfg.harga !== "" && Number(cfg.harga) > 0);
        }

        function hargaUntukMode(p, mode) {
            if (mode === "Offline") return Number(p.harga) || 0;
            const cfg = p.modeHarga && p.modeHarga[mode];
            if (cfg && cfg.harga !== null && cfg.harga !== undefined && cfg.harga !== "") return Number(cfg.harga);
            return 0; // tidak dijual di mode ini
        }

        function renderMainContent() {
            document.getElementById("mainContent").innerHTML =
                '<div class="top-row">' +
                    '<input type="text" class="search-box" id="searchBox" placeholder="Cari produk...">' +
                '</div>' +
                '<div class="kategori-tabs" id="kategoriTabs"></div>' +
                '<div class="pos-grid">' +
                    '<div class="product-grid" id="productGrid"><div class="loading-state">Memuat produk...</div></div>' +
                    '<div class="cart-card">' +
                        '<div class="mode-section-cart">' +
                            '<div class="mode-grid" id="modeTabs"></div>' +
                        '</div>' +
                        '<div class="cart-title">Keranjang</div>' +
                        '<div class="msg-box" id="msgBox"></div>' +
                        '<div id="cartItems"><div class="cart-empty">Belum ada produk dipilih</div></div>' +
                        '<div id="promoAppliedBox"></div>' +
                        '<div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>' +
                        '<div class="summary-row"><span>Diskon</span><span id="sumDiskon">Rp 0</span></div>' +
                        '<div class="summary-row total"><span>Total</span><span id="sumTotal">Rp 0</span></div>' +
                        '<select class="metode-bayar" id="metodeBayar"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>' +
                        '<div class="cart-actions">' +
                            '<button class="btn-bersihkan" onclick="bersihkanKeranjang()">Bersihkan</button>' +
                            '<button class="btn-bayar" id="payBtn" onclick="prosesBayar()" disabled>Bayar</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            document.getElementById("searchBox").addEventListener("input", renderProdukTampil);
        }

        function loadProducts() {
            const grid = document.getElementById("productGrid");

            db.collection("products").where("status", "==", "aktif").get()
                .then(function (snapshot) {
                    allProducts = [];
                    snapshot.forEach(function (doc) { allProducts.push(Object.assign({ id: doc.id }, doc.data())); });

                    if (allProducts.length === 0) {
                        grid.innerHTML = '<div class="empty-state">Belum ada produk aktif.</div>';
                        return;
                    }
                    dengarkanStok();
                })
                .catch(function (error) { grid.innerHTML = '<div class="empty-state">Gagal memuat: ' + error.message + '</div>'; });
        }

        /* =====================================================
           STOK REALTIME: pakai onSnapshot (bukan get() sekali)
           supaya begitu admin klik ACC di halaman Manajemen Menu,
           stok di POS langsung berubah otomatis tanpa perlu
           refresh manual. Laporan kasir sendiri TIDAK menyentuh
           koleksi stok ini sama sekali (baru berubah setelah admin
           ACC), jadi angka yang tampil di POS selalu angka resmi
           yang sudah disetujui admin.
        ====================================================== */
        let stockUnsubscribe = null;

        function dengarkanStok() {
            if (stockUnsubscribe) { stockUnsubscribe(); stockUnsubscribe = null; }

            stockUnsubscribe = db.collection("outlets").doc(currentUser.outlet).collection("stock")
                .onSnapshot(function (snapshot) {
                    stockMap = {};
                    snapshot.forEach(function (doc) { stockMap[doc.id] = doc.data().jumlah || 0; });
                    renderKategoriTabs();
                    renderProdukTampil();
                }, function (error) {
                    document.getElementById("productGrid").innerHTML =
                        '<div class="empty-state">Gagal memuat stok: ' + error.message + '</div>';
                });
        }

        function renderKategoriTabs() {
            const kategoriSet = new Set();
            allProducts.forEach(function (p) { if (p.kategori) kategoriSet.add(p.kategori); });
            const kategoriList = ["Semua"].concat(Array.from(kategoriSet).sort());

            const container = document.getElementById("kategoriTabs");
            container.innerHTML = kategoriList.map(function (k) {
                return '<button class="kategori-tab' + (k === kategoriAktif ? ' active' : '') +
                    '" onclick="pilihKategori(\'' + k.replace(/'/g, "") + '\')">' + k + '</button>';
            }).join("");
        }

        function pilihKategori(k) {
            kategoriAktif = k;
            renderKategoriTabs();
            renderProdukTampil();
        }

        function renderProdukTampil() {
            const keyword = (document.getElementById("searchBox").value || "").toLowerCase();

            const filtered = allProducts.filter(function (p) {
                const cocokKategori = kategoriAktif === "Semua"
                    ? p.kategori !== "Topping"
                    : p.kategori === kategoriAktif;
                const cocokKeyword = p.nama.toLowerCase().includes(keyword);
                const cocokMode = tersediaDiMode(p, modeAktif);
                return cocokKategori && cocokKeyword && cocokMode;
            });

            renderProductGrid(filtered);
        }

        function renderProductGrid(products) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = '<div class="empty-state">Produk tidak ditemukan</div>';
                return;
            }

            products.forEach(function (p) {
                const isTopping = p.kategori === "Topping";
                const stok = stockMap[p.id] !== undefined ? stockMap[p.id] : 0;

                // Topping tidak dilacak stoknya sama sekali, selalu dianggap tersedia
                const habis = !isTopping && stok <= 0;

                const card = document.createElement("div");
                card.className = "product-card" + (habis ? " disabled" : "");

                const gambarHtml = p.gambarUrl
                    ? '<img src="' + p.gambarUrl + '" alt="' + p.nama + '">'
                    : "🥐";

                const teksStok = isTopping ? "" : (habis ? "Stok habis" : "Stok: " + stok + " " + (p.satuan || "pcs"));
                const hargaTampil = hargaUntukMode(p, modeAktif);

                card.innerHTML =
                    (isTopping ? "" : '<div class="img-area">' + gambarHtml + '</div>') +
                    '<div class="info">' +
                        '<div class="name">' + p.nama + '</div>' +
                        '<div class="stok" style="font-weight:700; color:#12305C;">Rp ' + hargaTampil.toLocaleString("id-ID") + '</div>' +
                        (teksStok ? '<div class="stok' + (habis ? ' habis' : '') + '">' + teksStok + '</div>' : '') +
                    '</div>';

                if (isTopping || stok > 0) {
                    card.onclick = function () { klikProduk(p); };
                }
                grid.appendChild(card);
            });
        }

        function klikProduk(product) {
            if (product.butuhTopping) {
                bukaModalTopping(product);
            } else {
                tambahKeKeranjang(product, []);
            }
        }

        function bukaModalTopping(product) {
            produkUntukTopping = product;
            document.getElementById("modalToppingNama").textContent = "Topping untuk " + product.nama;

            const container = document.getElementById("toppingOptionsList");

            if (daftarTopping.length === 0) {
                container.innerHTML = '<div class="empty-state">Belum ada produk berkategori "Topping". Tambahkan lewat Pengaturan &gt; Produk, pilih kategori "Topping".</div>';
            } else {
                container.innerHTML = daftarTopping.map(function (t, i) {
                    return '<label class="topping-option">' +
                        '<input type="checkbox" value="' + i + '">' +
                        '<span class="t-nama">' + t.nama + '</span>' +
                        '<span class="t-harga">+Rp ' + hargaUntukMode(t, modeAktif).toLocaleString("id-ID") + '</span>' +
                    '</label>';
                }).join("");
            }

            document.getElementById("modalTopping").classList.add("open");
        }

        function tutupModalTopping() {
            document.getElementById("modalTopping").classList.remove("open");
            produkUntukTopping = null;
        }

        function konfirmasiTopping() {
            const checkboxes = document.querySelectorAll("#toppingOptionsList input[type=checkbox]:checked");
            const toppingTerpilih = Array.from(checkboxes).map(function (cb) { return daftarTopping[Number(cb.value)]; });

            tambahKeKeranjang(produkUntukTopping, toppingTerpilih);
            tutupModalTopping();
        }

        function buatCartKey(productId, toppings) {
            const toppingKey = toppings.map(function (t) { return t.nama; }).sort().join(",");
            return productId + "::" + toppingKey;
        }

        function tambahKeKeranjang(product, toppings) {
            const isTopping = product.kategori === "Topping";
            const cartKey = buatCartKey(product.id, toppings);

            if (!isTopping) {
                const stokTersedia = stockMap[product.id] || 0;
                const totalProdukIniDiKeranjang = Object.values(cart)
                    .filter(function (item) { return item.productId === product.id; })
                    .reduce(function (sum, item) { return sum + item.qty; }, 0);

                if (totalProdukIniDiKeranjang >= stokTersedia) {
                    tampilkanPesan("Stok " + product.nama + " tidak mencukupi.", "error");
                    return;
                }
            }

            const hargaProdukMode = hargaUntukMode(product, modeAktif);
            const hargaToppingTotal = toppings.reduce(function (sum, t) { return sum + hargaUntukMode(t, modeAktif); }, 0);
            const hargaSatuan = hargaProdukMode + hargaToppingTotal;

            if (cart[cartKey]) {
                cart[cartKey].qty += 1;
            } else {
                cart[cartKey] = {
                    productId: product.id, nama: product.nama, hargaSatuan: hargaSatuan,
                    hargaDasar: hargaProdukMode, toppings: toppings, qty: 1,
                    lacakStok: !isTopping
                };
            }
            renderCart();
        }

        function ubahQty(cartKey, delta) {
            const item = cart[cartKey];
            if (!item || item.isPromoGratis) return;

            const stokTersedia = stockMap[item.productId] || 0;
            const totalProdukIni = Object.values(cart)
                .filter(function (i) { return i.productId === item.productId; })
                .reduce(function (sum, i) { return sum + i.qty; }, 0);

            const newQty = item.qty + delta;

            if (newQty <= 0) {
                delete cart[cartKey];
            } else if (item.lacakStok !== false && delta > 0 && totalProdukIni >= stokTersedia) {
                tampilkanPesan("Stok tidak mencukupi.", "error");
                return;
            } else {
                item.qty = newQty;
            }
            renderCart();
        }

        function bersihkanKeranjang() {
            cart = {};
            renderCart();
        }

        function renderCart() {
            sinkronPromoOtomatis();

            const container = document.getElementById("cartItems");
            const items = Object.entries(cart);

            if (items.length === 0) {
                container.innerHTML = '<div class="cart-empty">Belum ada produk dipilih</div>';
                document.getElementById("promoAppliedBox").innerHTML = "";
                updateRingkasan(0, 0);
                document.getElementById("payBtn").disabled = true;
                return;
            }

            container.innerHTML = "";
            let subtotal = 0;

            items.forEach(function (entry) {
                const cartKey = entry[0];
                const item = entry[1];
                const totalHargaItem = item.hargaSatuan * item.qty;
                subtotal += totalHargaItem;

                const toppingText = item.toppings.length > 0
                    ? item.toppings.map(function (t) { return t.nama; }).join(", ")
                    : "";

                const qtyControlsHtml = item.isPromoGratis
                    ? '<div class="qty-controls"><span class="qty-num">' + item.qty + '</span></div>'
                    : '<div class="qty-controls">' +
                          '<button class="qty-btn" onclick="ubahQty(\'' + cartKey + '\', -1)">-</button>' +
                          '<span class="qty-num">' + item.qty + '</span>' +
                          '<button class="qty-btn" onclick="ubahQty(\'' + cartKey + '\', 1)">+</button>' +
                      '</div>';

                const row = document.createElement("div");
                row.className = "cart-item";
                row.innerHTML =
                    '<div class="cart-item-row">' +
                        '<div>' +
                            '<div class="nama">' + item.nama + '</div>' +
                            (toppingText ? '<div class="topping-tag">' + toppingText + '</div>' : '') +
                            (item.isPromoGratis ? '<div class="topping-tag" style="color:#1E9E5A; font-weight:700;">GRATIS — Promo: ' + item.promoNama + '</div>' : '') +
                        '</div>' +
                        '<div class="harga">Rp ' + totalHargaItem.toLocaleString("id-ID") + '</div>' +
                    '</div>' +
                    qtyControlsHtml;
                container.appendChild(row);
            });

            const promoResult = computePromoEffects();
            renderPromoAppliedBox(promoResult);
            updateRingkasan(subtotal, promoResult.totalDiskon);
            document.getElementById("payBtn").disabled = false;
        }

        /* Kotak hijau "Promo Terpakai" di atas ringkasan harga, muncul
           otomatis begitu ada promo yang kena di keranjang sekarang. */
        function renderPromoAppliedBox(promoResult) {
            const box = document.getElementById("promoAppliedBox");
            if (!box) return;

            if (!promoResult.promoDetail || promoResult.promoDetail.length === 0) {
                box.innerHTML = "";
                return;
            }

            const baris = promoResult.promoDetail.map(function (d) {
                return '<div class="promo-applied-row"><span>' + d.nama + '</span><span>-Rp ' + d.jumlah.toLocaleString("id-ID") + '</span></div>';
            }).join("");

            box.innerHTML =
                '<div class="promo-applied-box">' +
                    '<div class="promo-applied-title">' +
                        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E9E5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
                        'Promo Terpakai' +
                    '</div>' +
                    baris +
                '</div>';
        }

        function updateRingkasan(subtotal, diskon) {
            diskon = diskon || 0;
            const total = Math.max(0, subtotal - diskon);
            document.getElementById("sumSubtotal").textContent = "Rp " + subtotal.toLocaleString("id-ID");
            document.getElementById("sumDiskon").textContent = "Rp " + diskon.toLocaleString("id-ID");
            document.getElementById("sumTotal").textContent = "Rp " + total.toLocaleString("id-ID");
        }

        function prosesBayar() {
            const entries = Object.entries(cart);
            if (entries.length === 0) return;

            const payBtn = document.getElementById("payBtn");
            payBtn.disabled = true; payBtn.textContent = "Memproses...";

            const totalPerProduk = {};
            entries.forEach(function (entry) {
                const item = entry[1];
                if (item.lacakStok === false) return; // topping tidak dilacak stoknya
                totalPerProduk[item.productId] = (totalPerProduk[item.productId] || 0) + item.qty;
            });

            const subtotal = entries.reduce(function (sum, entry) { return sum + (entry[1].hargaSatuan * entry[1].qty); }, 0);
            const promoResult = computePromoEffects();
            const diskonPromo = promoResult.totalDiskon;
            const total = Math.max(0, subtotal - diskonPromo);
            const metodeBayar = document.getElementById("metodeBayar").value;
            const outletRef = db.collection("outlets").doc(currentUser.outlet);
            const productIds = Object.keys(totalPerProduk);

            db.runTransaction(function (transaction) {
                const stockRefs = productIds.map(function (pid) { return outletRef.collection("stock").doc(pid); });

                return Promise.all(stockRefs.map(function (ref) { return transaction.get(ref); })).then(function (stockDocs) {
                    for (let i = 0; i < productIds.length; i++) {
                        const stokSekarang = stockDocs[i].exists ? stockDocs[i].data().jumlah : 0;
                        if (stokSekarang < totalPerProduk[productIds[i]]) {
                            throw new Error("Stok tidak mencukupi untuk salah satu produk.");
                        }
                    }
                    productIds.forEach(function (pid, i) {
                        const stokSekarang = stockDocs[i].data().jumlah;
                        transaction.update(stockRefs[i], { jumlah: stokSekarang - totalPerProduk[pid] });
                    });

                    const itemsUntukTransaksi = entries.map(function (entry) {
                        const item = entry[1];
                        return {
                            productId: item.productId, nama: item.nama,
                            toppings: item.toppings.map(function (t) { return t.nama; }),
                            harga: item.hargaSatuan, qty: item.qty,
                            isPromoGratis: !!item.isPromoGratis
                        };
                    });

                    transaction.set(db.collection("transactions").doc(), {
                        outlet: currentUser.outlet, kasirUid: currentUser.uid, kasirNama: currentUser.nama,
                        items: itemsUntukTransaksi, subtotal: subtotal, diskonPromo: diskonPromo,
                        promoDipakai: promoResult.promoDipakai, total: total, metodeBayar: metodeBayar,
                        modePenjualan: modeAktif, status: "aktif",
                        waktu: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
            })
            .then(function () {
                tampilkanPesan("Transaksi berhasil! Total Rp " + total.toLocaleString("id-ID"), "success");
                cart = {};
                renderCart();
                loadProducts();
            })
            .catch(function (error) { tampilkanPesan(error.message, "error"); })
            .finally(function () { payBtn.disabled = false; payBtn.textContent = "Bayar"; });
        }

        function tampilkanPesan(text, type) {
            const box = document.getElementById("msgBox");
            box.textContent = text;
            box.className = "msg-box " + (type === "error" ? "msg-error" : "msg-success");
            box.style.display = "block";
            setTimeout(function () { box.style.display = "none"; }, 4000);
        }
    </script>
