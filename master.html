<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Data Master</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: Arial, Helvetica, sans-serif; background: #fff8ed; color: #4b2b1d; }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 190px; flex-shrink: 0; background: #fffdf9;
            border-right: 1px solid #eadfd2; padding: 20px 14px;
            display: flex; flex-direction: column;
        }

        .sidebar .brand { font-weight: 800; font-size: 15px; color: #5a2d1c; margin-bottom: 18px; }

        .sidebar .nav-item {
            display: block; padding: 9px 12px; border-radius: 8px;
            font-size: 12px; color: #765f51; text-decoration: none; margin-bottom: 4px;
        }

        .sidebar .nav-item:hover { background: #fbf1e3; }
        .sidebar .nav-item.active { background: #fcecd2; color: #a8570c; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #c9beb0; pointer-events: none; }

        .sidebar .nav-divider { border-top: 1px solid #eadfd2; margin: 14px 0 10px; }

        .sidebar .nav-label {
            font-size: 10px; font-weight: 700; color: #b0a89c;
            text-transform: uppercase; padding: 0 12px; margin-bottom: 6px;
        }

        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid #eadfd2; }
        .sidebar .user-name { font-size: 12px; font-weight: 700; }
        .sidebar .user-role { font-size: 10px; color: #8a796e; margin-bottom: 8px; }

        .sidebar .logout-link {
            font-size: 11px; color: #c0392b; background: none;
            border: none; cursor: pointer; padding: 0;
        }

        .content { flex: 1; padding: 28px 30px; max-width: 720px; }

        .content h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .content .subtitle { font-size: 12px; color: #8a796e; margin-bottom: 22px; }

        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
        }

        .tile {
            background: #fffdf9;
            border: 1px solid #eadfd2;
            border-radius: 12px;
            padding: 22px 18px;
            text-decoration: none;
            color: #4b2b1d;
            display: block;
            transition: 0.15s;
        }

        .tile:hover { border-color: #f39a16; transform: translateY(-1px); }
        .tile .icon { font-size: 26px; }
        .tile .title { font-size: 14px; font-weight: 700; margin-top: 10px; }
        .tile .desc { font-size: 11px; color: #8a796e; margin-top: 3px; }

        .loading-state, .denied-state { text-align: center; color: #8a796e; font-size: 12px; padding: 40px 0; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>

        <div class="content" id="mainContent">
            <div class="loading-state">Memeriksa akses...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        auth.onAuthStateChanged(function (user) {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const savedUser = sessionStorage.getItem("omaopa_user");

            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                mulaiHalaman();
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        mulaiHalaman();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        function logout() {
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                window.location.href = "index.html";
            });
        }

        /* =====================================================
           Data Master menampilkan tile HANYA untuk halaman
           bertanda "hub" yang diizinkan role ini (outlet, produk, user).
           Kalau role tidak punya akses ke satu pun, tampil pesan ditolak.
        ====================================================== */
        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML =
                renderSidebar(currentUser, "master");

            const halamanDiizinkan = getHalamanUntukRole(currentUser.role);
            const tileHub = halamanDiizinkan.filter(function (h) { return h.hub && h.dibangun; });

            const content = document.getElementById("mainContent");

            if (tileHub.length === 0) {
                content.innerHTML =
                    '<div class="denied-state">Anda tidak memiliki akses ke Data Master.<br>' +
                    '<a href="beranda.html" style="color:#e87913;">Kembali ke Beranda</a></div>';
                return;
            }

            let html =
                '<h2>Data Master</h2>' +
                '<p class="subtitle">Kelola data dasar yang dipakai di seluruh sistem omaopaPOS.</p>' +
                '<div class="tile-grid">';

            tileHub.forEach(function (h) {
                html += '<a href="' + h.href + '" class="tile">' +
                    '<div class="icon">' + h.icon + '</div>' +
                    '<div class="title">' + h.title + '</div>' +
                    '<div class="desc">' + h.desc + '</div>' +
                '</a>';
            });

            html += '</div>';
            content.innerHTML = html;
        }
    </script>

</body>
</html>
