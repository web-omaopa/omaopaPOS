    <!-- Laporan shift -->
    <div class="modal-overlay" id="modalDetailSesi">
        <div class="modal-box">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                <h3 style="margin:0;" id="detailSesiJudul">Laporan Shift</h3>
                <button class="btn btn-kecil" style="width:30px; padding:0; font-size:15px;" onclick="tutupModal('modalDetailSesi')">&times;</button>
            </div>
            <div id="detailSesiIsi"></div>
            <div class="modal-actions">
                <button class="btn" onclick="tutupModal('modalDetailSesi')">Tutup</button>
                <button class="btn btn-primary" style="flex:1.3;" onclick="cetakLaporanSesi()">🖨 Cetak</button>
            </div>
        </div>
    </div>

    <div id="areaCetak"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5nxXV7YPTEq160fLoqBBKtvwaHBQljfc",
            authDomain: "omaopa-pos.firebaseapp.com",
            projectId: "omaopa-pos",
            storageBucket: "omaopa-pos.firebasestorage.app",
            messagingSenderId: "101370933916",
            appId: "1:101370933916:web:129ebea30dd9e59508f359"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let daftarOutlet = [];
        let outletDipilih = "";        // "" = semua outlet (hanya untuk tab Pengeluaran & Rekap)
        let tabAktif = "shift";        // shift | pengeluaran | rekap
        let tokenMuat = 0;             // mencegah hasil muat lama menimpa tampilan baru

        let sesiAktif = null;          // shift berjalan di outlet terpilih: { id, data }
        let ringkasanAktif = null;     // hasil kasRingkasanSesi untuk sesiAktif
        let pantauSesi = null;         // onSnapshot dokumen sesi (angka ikut berubah saat ada penjualan)
        let pantauPengeluaran = null;
        let jedaMuatUlang = null;
        let laporanTerbuka = null;     // { sesi, ringkasan } untuk modal laporan & cetak

        const KUNCI_OUTLET_KASIR = "omaopa_outlet_kasir";
        const WARNA_METODE = { "Tunai": "#1E9E5A", "QRIS": "#2F6FD6", "Debit/EDC": "#8B5CF6" };
        const IKON_KATEGORI = {
            "Salah Nota": "🧾", "Kompensasi Customer": "🤝", "Marketing": "📣", "Biaya Operasional": "⚙️",
            "Biaya Kebersihan": "🧽", "Pengeluaran Reward": "🎁", "Bensin TVS": "⛽", "Upgrading": "⬆️",
            "Biaya Listrik": "💡", "Biaya Air PAM": "🚰", "Pengiriman dari Pabrik": "🚚", "Biaya Transfer Kue": "📦",
            "Perbaikan dan Pemeliharaan": "🔧", "Biaya Alat Tulis": "✏️", "Telekomunikasi": "📱", "Konsumsi Rapat": "☕",
            "Utilitis": "🔌", "Pengiriman Kue ke Customer": "🛵", "Biaya Backup Kasir": "👥", "Reward Sniby": "⭐"
        };

        auth.onAuthStateChanged(function (user) {
            if (!user) { window.location.href = "index.html"; return; }

            const savedUser = sessionStorage.getItem("omaopa_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                siapkanRole(currentUser.role, mulaiHalaman);
            } else {
                db.collection("users").doc(user.uid).get().then(function (doc) {
                    if (doc.exists) {
                        currentUser = doc.data();
                        currentUser.uid = user.uid;
                        sessionStorage.setItem("omaopa_user", JSON.stringify(currentUser));
                        siapkanRole(currentUser.role, mulaiHalaman);
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        function logout() {
            hentikanPantau();
            auth.signOut().then(function () {
                sessionStorage.removeItem("omaopa_user");
                sessionStorage.removeItem(KUNCI_OUTLET_KASIR);
                window.location.href = "index.html";
            });
        }

        /* ---------- Bantuan format ---------- */
        function esc(t) { return escapeHtmlAman(t); }
        function angka(n) { return Number(n || 0).toLocaleString("id-ID"); }
        function rp(n) { return (Number(n) < 0 ? "-Rp " : "Rp ") + angka(Math.abs(Number(n) || 0)); }
        function pad2(x) { return String(x).padStart(2, "0"); }
        function fmtWaktu(d) {
            if (!d) return "-";
            return pad2(d.getDate()) + "-" + pad2(d.getMonth() + 1) + "-" + d.getFullYear() + " " + pad2(d.getHours()) + "." + pad2(d.getMinutes());
        }
        function fmtJam(d) { return d ? pad2(d.getHours()) + "." + pad2(d.getMinutes()) : "-"; }
        function fmtTanggal(iso) {
            const b = String(iso || "").split("-");
            return b.length === 3 ? b[2] + "-" + b[1] + "-" + b[0] : (iso || "-");
        }
        function fmtHariPanjang(iso) {
            const d = new Date(iso + "T00:00:00");
            return isNaN(d) ? iso : d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }
        function isoDari(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
        function tanggalMundur(hari) { const d = new Date(); d.setDate(d.getDate() - hari); return isoDari(d); }
        function lamaSejak(d) {
            if (!d) return "";
            const menit = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
            const j = Math.floor(menit / 60), m = menit % 60;
            return j > 0 ? j + " jam " + m + " mnt" : m + " mnt";
        }
        function infoSelisih(n) {
            n = Number(n) || 0;
            if (n === 0) return { kelas: "b-pas", teks: "✓ Pas" };
            if (n < 0) return { kelas: "b-kurang", teks: "Kurang " + rp(-n) };
            return { kelas: "b-lebih", teks: "Lebih " + rp(n) };
        }
        function badgeSelisih(n) { const s = infoSelisih(n); return '<span class="badge ' + s.kelas + '">' + s.teks + '</span>'; }
        function bolehKelolaSemua() { return currentUser.role !== "kasir"; }
        function tutupModal(id) { document.getElementById(id).classList.remove("open"); }

        function hentikanPantau() {
            if (pantauSesi) { pantauSesi(); pantauSesi = null; }
            if (pantauPengeluaran) { pantauPengeluaran(); pantauPengeluaran = null; }
            clearTimeout(jedaMuatUlang);
        }

        /* ---------- MULAI ---------- */
        function mulaiHalaman() {
            document.getElementById("sidebarContainer").innerHTML = renderSidebar(currentUser, "kas");
            // Siapa pun yang boleh memakai Kasir juga harus bisa menutup tokonya
            if (!cekAksesHalaman(currentUser.role, "kasir") && !jagaAksesHalaman(currentUser.role, "kas")) return;

            if (currentUser.role === "kasir") {
                if (!currentUser.outlet) {
                    document.getElementById("mainContent").innerHTML =
                        '<div class="empty-state" style="padding:40px 0;">Akun kasir ini belum punya outlet. Minta admin mengatur outletnya di Pengaturan &gt; User.</div>';
                    return;
                }
                daftarOutlet = [currentUser.outlet];
                outletDipilih = currentUser.outlet;
                renderKerangka();
                return;
            }

            db.collection("outlets").get().then(function (snap) {
                snap.forEach(function (doc) { daftarOutlet.push(doc.id); });
                daftarOutlet.sort();
                const simpan = sessionStorage.getItem(KUNCI_OUTLET_KASIR);
                outletDipilih = simpan && daftarOutlet.indexOf(simpan) !== -1 ? simpan : (daftarOutlet[0] || "");
                renderKerangka();
            }).catch(function (error) {
                document.getElementById("mainContent").innerHTML = '<div class="empty-state">Gagal memuat outlet: ' + esc(error.message) + '</div>';
            });
        }

        function renderKerangka() {
            document.getElementById("mainContent").innerHTML =
                '<div class="wrap">' +
                    '<div class="top-bar">' +
                        '<div><h2>Shift & Kas</h2><div class="top-sub">' +
                            (currentUser.role === "kasir" ? 'Outlet <b>' + esc(currentUser.outlet) + '</b> · ' : '') +
                            esc(new Date().toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" })) +
                        '</div></div>' +
                        '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
                            (currentUser.role === "kasir" ? '' : '<select class="outlet-select" id="selOutlet" onchange="gantiOutlet(this.value)"></select>') +
                            '<div class="seg">' +
                                '<button data-tab="shift" onclick="gantiTab(\'shift\')">Shift Sekarang</button>' +
                                '<button data-tab="pengeluaran" onclick="gantiTab(\'pengeluaran\')">Pengeluaran</button>' +
                                '<button data-tab="rekap" onclick="gantiTab(\'rekap\')">Rekap Shift</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div id="isiTab"></div>' +
                '</div>';
            gantiTab(tabAktif);
        }

        function isiPilihanOutlet() {
            const sel = document.getElementById("selOutlet");
            if (!sel) return;
            const bolehSemua = tabAktif !== "shift";
            if (!bolehSemua && !outletDipilih) outletDipilih = daftarOutlet[0] || "";
            sel.innerHTML = (bolehSemua ? '<option value="">Semua outlet</option>' : '') +
                daftarOutlet.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join("");
            sel.value = outletDipilih;
        }

        function gantiOutlet(o) {
            outletDipilih = o;
            gantiTab(tabAktif);
        }

        function gantiTab(t) {
            tabAktif = t;
            hentikanPantau();
            document.querySelectorAll(".seg button").forEach(function (el) { el.classList.toggle("on", el.dataset.tab === t); });
            isiPilihanOutlet();
            const lama = document.querySelector(".fab-tambah");
            if (lama) lama.remove();
            if (t === "shift") muatShift();
            else if (t === "pengeluaran") renderTabPengeluaran();
            else renderTabRekap();
        }

        /* =====================================================
           SHIFT SEKARANG
           Satu layar: uang di laci, penjualan, pengeluaran, dan
           tombol akhiri shift / tutup toko. Dokumen sesi & pengeluaran
           dipantau realtime, jadi angka ikut berubah saat kasir
           berjualan di layar Kasir tanpa perlu muat ulang.
        ====================================================== */
        function muatShift() {
            const isi = document.getElementById("isiTab");
            isi.innerHTML = '<div class="loading-state">Memuat shift...</div>';
            const token = ++tokenMuat;
            const outlet = outletDipilih;
            kasCariSesiAktif(db, outlet).then(function (sesi) {
                if (token !== tokenMuat) return;
                sesiAktif = sesi; ringkasanAktif = null;
                if (!sesi) { renderBelumBuka(); return; }
                hitungUlangShift(token);
                // Pantau perubahan: penjualan (counter di dokumen sesi) & pengeluaran shift ini
                let pertama = true, pertamaPg = true;
                pantauSesi = db.collection("sesi_kas").doc(sesi.id).onSnapshot(function (doc) {
                    if (pertama) { pertama = false; return; }
                    if (!doc.exists || doc.data().status !== "buka") { if (tabAktif === "shift" && !document.getElementById("modalTutup").classList.contains("open")) muatShift(); return; }
                    sesiAktif = { id: doc.id, data: doc.data({ serverTimestamps: "estimate" }) };
                    jadwalHitungUlang(token);
                }, function () {});
                pantauPengeluaran = db.collection("pengeluaran").where("sesiKasId", "==", sesi.id).onSnapshot(function () {
                    if (pertamaPg) { pertamaPg = false; return; }
                    jadwalHitungUlang(token);
                }, function () {});
            }).catch(function (error) {
                if (token === tokenMuat) isi.innerHTML = '<div class="empty-state">Gagal memuat shift: ' + esc(error.message) + '</div>';
            });
        }

        function jadwalHitungUlang(token) {
            clearTimeout(jedaMuatUlang);
            jedaMuatUlang = setTimeout(function () { hitungUlangShift(token); }, 400);
        }

        function hitungUlangShift(token) {
            if (!sesiAktif) return;
            kasRingkasanSesi(db, sesiAktif).then(function (r) {
                if (token !== tokenMuat || tabAktif !== "shift") return;
                ringkasanAktif = r;
                renderShift();
            }).catch(function (error) {
                if (token === tokenMuat) document.getElementById("isiTab").innerHTML = '<div class="empty-state">Gagal menghitung kas: ' + esc(error.message) + '</div>';
            });
        }

        function renderBelumBuka() {
            document.getElementById("isiTab").innerHTML =
                '<div class="panel" style="text-align:center; padding:44px 24px;">' +
                    '<div style="font-size:40px;">🏪</div>' +
                    '<div style="font-size:16px; font-weight:800; color:#12305C; margin-top:8px;">Belum ada shift berjalan</div>' +
                    '<div class="hint-text" style="font-size:12.5px; margin-top:6px;">Outlet <b>' + esc(outletDipilih) + '</b> belum dibuka. ' +
                    'Shift dimulai dari layar Kasir dengan mengisi kas awal.</div>' +
                    '<div style="display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap;">' +
                        '<button class="btn btn-primary" style="height:42px; padding:0 20px;" onclick="keKasir()">Buka di Kasir</button>' +
                        '<button class="btn" style="height:42px;" onclick="gantiTab(\'rekap\')">Lihat rekap shift</button>' +
                    '</div>' +
                '</div>';
        }

        function keKasir() {
            if (currentUser.role !== "kasir") sessionStorage.setItem(KUNCI_OUTLET_KASIR, outletDipilih);
            window.location.href = "pos.html";
        }

        function renderShift() {
            const s = sesiAktif.data, r = ringkasanAktif;
            const buka = kasToDate(s.waktuBuka);
            const totalJual = r.penjualanTunai + r.penjualanNonTunai;

            // Penjualan per metode (bar)
            const metode = Object.keys(r.perMetode).filter(function (m) { return r.perMetode[m]; })
                .sort(function (a, b) { return a === "Tunai" ? -1 : b === "Tunai" ? 1 : r.perMetode[b] - r.perMetode[a]; });
            const bar = metode.length === 0
                ? '<div class="kosong" style="padding:14px 0;">Belum ada penjualan di shift ini.</div>'
                : metode.map(function (m) {
                    const v = Number(r.perMetode[m]) || 0;
                    const pct = totalJual ? Math.round(v * 100 / totalJual) : 0;
                    return '<div class="bar-item"><div class="bar-head"><span>' + esc(m) + (m === "Tunai" ? '<span class="laci">MASUK LACI</span>' : '') + '</span>' +
                        '<span><b>' + rp(v) + '</b> <span class="kecil" style="display:inline;">· ' + pct + '%</span></span></div>' +
                        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + (WARNA_METODE[m] || "#E0761A") + ';"></div></div></div>';
                }).join("");

            // Produk terlaris
            let produkHtml = "";
            if (r.transaksi) {
                const per = {};
                r.transaksi.forEach(function (t) {
                    (t.items || []).forEach(function (it) { per[it.nama || "-"] = (per[it.nama || "-"] || 0) + (Number(it.qty) || 0); });
                });
                const top = Object.keys(per).sort(function (a, b) { return per[b] - per[a]; }).slice(0, 5);
                if (top.length) {
                    produkHtml = '<div class="sub-judul">Produk terlaris shift ini</div>' +
                        top.map(function (n, i) {
                            return '<div class="top-produk"><span class="rank">' + (i + 1) + '</span><span class="nm">' + esc(n) + '</span><span class="q">' + angka(per[n]) + ' pcs</span></div>';
                        }).join("");
                }
            }

            // Pengeluaran shift ini
            const pgHtml = r.pengeluaran.length === 0
                ? '<div class="kosong"><div class="ikon">🧾</div>Belum ada pengeluaran.<br>Catat setiap uang yang keluar dari laci supaya kas akhir cocok.</div>'
                : r.pengeluaran.map(function (p) { return htmlItemPengeluaran(p, false); }).join("");

            document.getElementById("isiTab").innerHTML =
                '<div class="hero">' +
                    '<div class="hero-status"><span class="titik"></span><span>SHIFT BERJALAN</span> · ' +
                        '<span>Kasir <b>' + esc(s.dibukaNama || "-") + '</b></span> · <span>Mulai <b>' + esc(fmtJam(buka)) + '</b> (' + esc(lamaSejak(buka)) + ')</span></div>' +
                    '<div class="hero-isi">' +
                        '<div>' +
                            '<div class="hero-label">Uang di laci seharusnya</div>' +
                            '<div class="hero-angka" id="angkaLaci">' + rp(r.kasSeharusnya) + '</div>' +
                            '<div class="rumus">' +
                                '<div class="bagian"><div class="k">Kas awal</div><div class="v">' + angka(r.kasAwal) + '</div></div><span class="op">+</span>' +
                                '<div class="bagian"><div class="k">Tunai masuk</div><div class="v">' + angka(r.penjualanTunai) + '</div></div><span class="op">−</span>' +
                                '<div class="bagian"><div class="k">Pengeluaran</div><div class="v">' + angka(r.totalPengeluaran) + '</div></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="hero-aksi">' +
                            '<button class="btn-hero garis" onclick="cetakShiftBerjalan()" title="Cetak laporan shift sementara">🖨</button>' +
                            '<button class="btn-hero putih" id="btnAkhiriShift" onclick="bukaTutup(\'shift\')">⇄ Akhiri Shift</button>' +
                            '<button class="btn-hero merah" id="btnTutupToko" onclick="bukaTutup(\'toko\')">🔒 Tutup Toko</button>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="dua-kolom">' +
                    '<div class="panel">' +
                        '<div class="panel-judul"><h3>Penjualan shift ini</h3></div>' +
                        '<div class="angka-besar">' + rp(totalJual) + '</div>' +
                        '<div class="meta-row"><span><b>' + angka(r.jumlahTrx) + '</b> transaksi</span>' +
                            '<span>Rata-rata <b>' + rp(r.jumlahTrx ? Math.round(totalJual / r.jumlahTrx) : 0) + '</b></span>' +
                            '<span>Non-tunai <b>' + rp(r.penjualanNonTunai) + '</b></span></div>' +
                        '<div class="bar-list">' + bar + '</div>' +
                        produkHtml +
                        (r.sumberPenjualan === "catatan" ? '<div class="hint-text">Angka dari catatan shift di layar Kasir (detail transaksi tidak bisa dibaca akun ini).</div>' : '') +
                    '</div>' +
                    '<div class="panel">' +
                        '<div class="panel-judul"><h3>Pengeluaran shift ini<span class="sub">' + rp(r.totalPengeluaran) + '</span></h3>' +
                            '<button class="btn btn-primary btn-kecil" onclick="bukaModalPengeluaran()">+ Catat</button></div>' +
                        pgHtml +
                    '</div>' +
                '</div>';
        }

        function htmlItemPengeluaran(p, tampilOutlet) {
            const ikon = IKON_KATEGORI[p.kategori] || "💸";
            const meta = [];
            if (tampilOutlet) meta.push(p.outlet);
            meta.push(fmtJam(p._waktu), p.dibuatNama || "-");
            if (p.keterangan) meta.push(p.keterangan);
            return '<div class="pg-item"><div class="pg-ikon">' + ikon + '</div>' +
                '<div class="pg-info"><div class="t">' + esc(p.kategori) + (p.dariLaci === false ? ' <span class="tag tag-shift">di luar laci</span>' : '') + '</div>' +
                    '<div class="m">' + esc(meta.join(" · ")) + '</div></div>' +
                '<div class="pg-aksi">' + htmlLinkBukti(p) +
                    '<span class="pg-nominal">−' + angka(p.nominal) + '</span>' +
                    (bolehHapus(p) ? '<button class="btn-ikon" title="Hapus" onclick="hapusPengeluaran(\'' + escJsAttr(p._id) + '\')">🗑</button>' : '') +
                '</div></div>';
        }

        function cetakShiftBerjalan() {
            if (sesiAktif && ringkasanAktif) tampilDetailSesi(sesiAktif, ringkasanAktif);
        }

        /* =====================================================
           AKHIRI SHIFT / TUTUP TOKO (3 langkah)
           1. Hitung uang (ketik total atau per pecahan)
           2. Cek selisih + catatan
           3. Selesai: laporan & cetak
        ====================================================== */
        let tutup = null;   // { jenis, ringkasan, mode, kasAkhir, rincian, catatan, sedang }

        function bukaTutup(jenis) {
            if (!sesiAktif) return;
            const shift = jenis === "shift";
            tutup = { jenis: jenis, ringkasan: null, mode: "total", kasAkhir: null, rincian: null, catatan: "", sedang: false };
            document.getElementById("tutupJudul").textContent = shift ? "Akhiri Shift" : "Tutup Toko";
            document.getElementById("tutupSub").textContent = shift
                ? "Serah terima ke kasir berikutnya. Kas akhir otomatis jadi kas awal shift baru."
                : "Menutup toko hari ini. Besok dibuka lagi dengan kas awal baru.";
            document.getElementById("tutupIsi").innerHTML = '<div class="loading-state">Menghitung kas terbaru...</div>';
            aturLangkah(1);
            document.getElementById("modalTutup").classList.add("open");
            kasRingkasanSesi(db, sesiAktif).then(function (r) {
                tutup.ringkasan = r;
                renderLangkahHitung();
            }).catch(function (e) {
                document.getElementById("tutupIsi").innerHTML = '<div class="msg-box msg-error" style="display:block;">Gagal menghitung kas: ' + esc(e.message) + '</div>';
            });
        }

        function batalTutup() {
            if (tutup && tutup.sedang) return;
            tutupModal("modalTutup");
        }

        function aturLangkah(n) {
            [1, 2, 3].forEach(function (i) { document.getElementById("lk" + i).classList.toggle("on", i <= n); });
        }

        function renderLangkahHitung() {
            aturLangkah(1);
            const pecahan = tutup.mode === "pecahan";
            document.getElementById("tutupIsi").innerHTML =
                '<div style="font-size:13.5px; font-weight:800; color:#1f2937; margin-bottom:10px;">① Hitung uang fisik di laci</div>' +
                '<div class="mode-hitung">' +
                    '<button class="' + (pecahan ? '' : 'on') + '" onclick="gantiModeHitung(\'total\')">Ketik total</button>' +
                    '<button class="' + (pecahan ? 'on' : '') + '" onclick="gantiModeHitung(\'pecahan\')">Hitung per pecahan</button>' +
                '</div>' +
                (pecahan
                    ? kasHtmlPecahan("pchTutup", "saatPecahanTutup") +
                      '<div class="total-hitung"><span class="k">Total uang di laci</span><span class="v" id="totalPecahanTutup">Rp 0</span></div>'
                    : '<div class="uang-input"><span>Rp</span><input type="text" inputmode="numeric" id="inputKasAkhir" placeholder="0" autocomplete="off" oninput="kasFormatInput(this)"></div>' +
                      '<div class="hint-text">Tip: pakai "Hitung per pecahan" supaya tidak salah jumlah saat menghitung banyak lembar.</div>') +
                '<div class="msg-box msg-error" id="tutupError"></div>' +
                '<div class="modal-actions">' +
                    '<button class="btn" onclick="batalTutup()">Batal</button>' +
                    '<button class="btn btn-primary" id="btnLanjutCek" style="flex:1.5;" onclick="keLangkahCek()">Lanjut: cek selisih ›</button>' +
                '</div>';
            if (pecahan) {
                // Isi ulang kalau sebelumnya sudah dihitung
                if (tutup.rincian) Object.keys(tutup.rincian).forEach(function (n) {
                    const el = document.getElementById("pchTutup_" + n);
                    if (el) { el.value = tutup.rincian[n]; kasUbahPecahan("pchTutup", Number(n), 0, "saatPecahanTutup"); }
                });
            } else {
                const el = document.getElementById("inputKasAkhir");
                if (tutup.kasAkhir !== null) el.value = angka(tutup.kasAkhir);
                el.focus();
            }
        }

        function saatPecahanTutup(h) {
            document.getElementById("totalPecahanTutup").textContent = rp(h.total);
        }

        function gantiModeHitung(mode) {
            simpanHitungan();
            tutup.mode = mode;
            renderLangkahHitung();
        }

        function simpanHitungan() {
            if (tutup.mode === "pecahan") {
                if (!document.getElementById("pchTutup_100000")) return;
                const h = kasTotalPecahan("pchTutup");
                tutup.rincian = h.rincian;
                tutup.kasAkhir = Object.keys(h.rincian).length ? h.total : null;
            } else {
                const el = document.getElementById("inputKasAkhir");
                if (!el) return;
                tutup.kasAkhir = el.value.trim() === "" ? null : kasParseAngka(el.value);
            }
        }

        function keLangkahCek() {
            simpanHitungan();
            if (tutup.kasAkhir === null) {
                const err = document.getElementById("tutupError");
                err.textContent = "Isi jumlah uang di laci dulu (isi 0 kalau laci kosong).";
                err.style.display = "block";
                return;
            }
            renderLangkahCek();
        }

        function renderLangkahCek() {
            aturLangkah(2);
            const r = tutup.ringkasan;
            const selisih = tutup.kasAkhir - r.kasSeharusnya;
            const hc = selisih === 0
                ? { k: "hc-pas", i: "✅", j: "Kas pas!", d: "Uang di laci sama dengan hitungan sistem." }
                : selisih < 0
                    ? { k: "hc-kurang", i: "⚠️", j: "Kurang " + rp(-selisih), d: "Uang di laci lebih sedikit dari seharusnya. Cek lagi atau tulis penyebabnya." }
                    : { k: "hc-lebih", i: "ℹ️", j: "Lebih " + rp(selisih), d: "Uang di laci lebih banyak dari seharusnya. Tulis penyebabnya." };
            const shift = tutup.jenis === "shift";
            document.getElementById("tutupIsi").innerHTML =
                '<div style="font-size:13.5px; font-weight:800; color:#1f2937; margin-bottom:10px;">② Cek selisih</div>' +
                '<div class="hasil-cek ' + hc.k + '"><div class="ikon">' + hc.i + '</div><div class="j">' + hc.j + '</div><div class="d">' + hc.d + '</div></div>' +
                '<div class="banding">' +
                    '<div><div class="k">Seharusnya (sistem)</div><div class="v">' + rp(r.kasSeharusnya) + '</div>' +
                        '<div class="kecil">' + angka(r.kasAwal) + ' + ' + angka(r.penjualanTunai) + ' − ' + angka(r.totalPengeluaran) + '</div></div>' +
                    '<div><div class="k">Dihitung kasir</div><div class="v">' + rp(tutup.kasAkhir) + '</div>' +
                        '<div class="kecil">' + (tutup.mode === "pecahan" ? 'dihitung per pecahan' : 'diketik total') + '</div></div>' +
                '</div>' +
                '<div class="fld-lbl">Catatan ' + (selisih !== 0 ? '<span style="color:#B03A2E;">* wajib karena ada selisih</span>' : '<span style="font-weight:400; color:#8A95A5;">(opsional)</span>') + '</div>' +
                '<textarea class="fld-in" id="inputCatatanTutup" maxlength="300" placeholder="' + (selisih !== 0 ? 'Contoh: kembalian salah ke pelanggan' : 'Catatan untuk shift berikutnya / admin') + '"></textarea>' +
                '<div class="msg-box msg-error" id="tutupError"></div>' +
                '<div class="modal-actions">' +
                    '<button class="btn" onclick="renderLangkahHitung()">‹ Hitung ulang</button>' +
                    '<button class="btn" id="btnKonfirmasiTutup" style="flex:1.5; background:' + (shift ? '#12305C' : '#E5534B') + '; border-color:transparent; color:#fff;" onclick="konfirmasiTutup()">' +
                        (shift ? '⇄ Akhiri Shift' : '🔒 Tutup Toko') + '</button>' +
                '</div>';
            document.getElementById("inputCatatanTutup").value = tutup.catatan || "";
        }

        function konfirmasiTutup() {
            if (tutup.sedang || !sesiAktif) return;
            const shift = tutup.jenis === "shift";
            const err = document.getElementById("tutupError");
            err.style.display = "none";
            const catatan = document.getElementById("inputCatatanTutup").value.trim();
            tutup.catatan = catatan;
            if (tutup.kasAkhir - tutup.ringkasan.kasSeharusnya !== 0 && !catatan) {
                err.textContent = "Tulis catatan penyebab selisih dulu.";
                err.style.display = "block";
                return;
            }
            const btn = document.getElementById("btnKonfirmasiTutup");
            const labelBtn = btn.innerHTML;
            tutup.sedang = true;
            btn.disabled = true; btn.textContent = "Menyimpan...";

            const sesi = sesiAktif;
            // Hitung ulang sekali lagi supaya transaksi terakhir ikut
            kasRingkasanSesi(db, sesi).then(function (r) {
                if (r.kasSeharusnya !== tutup.ringkasan.kasSeharusnya) {
                    // Ada transaksi/pengeluaran baru sejak dicek: tampilkan angka baru dulu
                    tutup.ringkasan = r;
                    tutup.sedang = false;
                    renderLangkahCek();
                    const e2 = document.getElementById("tutupError");
                    e2.textContent = "Ada transaksi atau pengeluaran baru, angka seharusnya sudah diperbarui. Cek lagi lalu tekan tombol sekali lagi.";
                    e2.style.display = "block";
                    throw null;
                }
                tutup.ringkasan = r;
                const selisih = tutup.kasAkhir - r.kasSeharusnya;
                const ref = db.collection("sesi_kas").doc(sesi.id);
                const dataTutup = {
                    status: "tutup",
                    jenisTutup: shift ? "shift" : "toko",
                    kasAkhir: tutup.kasAkhir,
                    rincianPecahan: tutup.mode === "pecahan" ? (tutup.rincian || {}) : null,
                    penjualanTunai: r.penjualanTunai,
                    penjualanNonTunai: r.penjualanNonTunai,
                    penjualanPerMetodeAkhir: r.perMetode,
                    jumlahTrxAkhir: r.jumlahTrx,
                    totalPengeluaran: r.totalPengeluaran,
                    kasSeharusnya: r.kasSeharusnya,
                    selisih: selisih,
                    catatan: catatan,
                    ditutupUid: currentUser.uid || "",
                    ditutupNama: currentUser.nama || "",
                    waktuTutup: firebase.firestore.FieldValue.serverTimestamp()
                };
                return db.runTransaction(function (tx) {
                    return tx.get(ref).then(function (doc) {
                        if (!doc.exists || doc.data().status !== "buka") {
                            throw new Error("Shift ini sudah diakhiri" + (doc.exists && doc.data().ditutupNama ? " oleh " + doc.data().ditutupNama : "") + ".");
                        }
                        tx.update(ref, dataTutup);
                    });
                }).then(function () {
                    tutup.sedang = false;
                    const sesiTutup = { id: sesi.id, data: Object.assign({}, sesi.data, dataTutup, { waktuTutup: new Date() }) };
                    renderLangkahSelesai(sesiTutup, r);
                    gantiTab("shift");
                });
            }).catch(function (error) {
                if (!error) return;
                tutup.sedang = false;
                const b = document.getElementById("btnKonfirmasiTutup");
                if (b) { b.disabled = false; b.innerHTML = labelBtn; }
                const e3 = document.getElementById("tutupError");
                if (e3) { e3.textContent = error.message; e3.style.display = "block"; }
            });
        }

        function renderLangkahSelesai(sesi, r) {
            aturLangkah(3);
            laporanTerbuka = { sesi: sesi, ringkasan: r };
            const shift = sesi.data.jenisTutup === "shift";
            document.getElementById("tutupIsi").innerHTML =
                '<div style="text-align:center; padding:6px 0 14px;">' +
                    '<div style="width:64px; height:64px; border-radius:32px; background:#1E9E5A; color:#fff; font-size:32px; display:flex; align-items:center; justify-content:center; margin:0 auto;">✓</div>' +
                    '<div style="font-size:17px; font-weight:800; margin-top:12px;" id="judulSelesai">' + (shift ? 'Shift berhasil diakhiri' : 'Toko berhasil ditutup') + '</div>' +
                    '<div class="hint-text" style="font-size:12px;">' + (shift
                        ? 'Kasir berikutnya mulai shift di layar Kasir. Kas awal otomatis ' + rp(sesi.data.kasAkhir) + '.'
                        : 'Sampai jumpa besok! Laporan bisa dilihat lagi di tab Rekap Shift.') + '</div>' +
                '</div>' +
                '<div class="lap-kertas" style="max-height:300px; overflow:auto;">' + htmlLaporanSesi(sesi, r) + '</div>' +
                '<div class="modal-actions">' +
                    '<button class="btn" onclick="cetakLaporanSesi()">🖨 Cetak laporan</button>' +
                    '<button class="btn btn-primary" style="flex:1.3;" onclick="tutupModal(\'modalTutup\')">Selesai</button>' +
                '</div>';
        }

        /* =====================================================
           PENGELUARAN
        ====================================================== */
        let filterPengeluaran = { preset: "hari", dari: kasTanggalHariIni(), sampai: kasTanggalHariIni() };
        let sesiBukaPerOutlet = {};    // outlet -> id sesi buka (untuk izin hapus kasir)
        let kategoriDipilih = KATEGORI_PENGELUARAN[0];

        function bolehHapus(p) {
            if (p.status === "dihapus") return false;
            if (bolehKelolaSemua()) return true;
            // Kasir: hanya catatannya sendiri, hari ini, dan shift yang masih berjalan
            if (p.dibuatUid !== currentUser.uid || p.tanggal !== kasTanggalHariIni()) return false;
            if (!p.sesiKasId) return true;
            const idBuka = sesiAktif ? sesiAktif.id : sesiBukaPerOutlet[p.outlet];
            return p.sesiKasId === idBuka;
        }

        function htmlLinkBukti(p) {
            // Hanya URL dari api/foto.php milik sendiri yang ditampilkan sebagai tautan
            if (!p.buktiUrl || !/^api\/foto\.php\?b=[0-9a-f_]+\.jpg$/.test(p.buktiUrl)) return '';
            return '<a class="link-bukti" href="' + esc(p.buktiUrl) + '" target="_blank" rel="noopener" title="Lihat foto bukti">📎</a>';
        }

        let buktiUrlForm = "";
        let sedangUploadBukti = false;

        function bukaModalPengeluaran() {
            const selOut = document.getElementById("pgOutlet");
            selOut.innerHTML = daftarOutlet.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join("");
            selOut.value = outletDipilih || daftarOutlet[0] || "";
            // Outlet hanya dipilih di tab Pengeluaran oleh admin/owner
            document.getElementById("pgOutletWrap").style.display = (currentUser.role === "kasir" || tabAktif !== "pengeluaran") ? "none" : "block";
            // Kasir selalu dari laci; admin/owner boleh mencatat pengeluaran di luar laci
            document.getElementById("pgLaciWrap").style.display = bolehKelolaSemua() ? "block" : "none";
            document.getElementById("pgSub").textContent = "Tanggal " + fmtTanggal(kasTanggalHariIni()) + " · mengurangi uang di laci kas shift berjalan.";
            kategoriDipilih = KATEGORI_PENGELUARAN[0];
            renderPilihKategori();
            document.getElementById("pgNominal").value = "";
            document.getElementById("pgKeterangan").value = "";
            document.getElementById("pgDariLaci").checked = true;
            document.getElementById("pgError").style.display = "none";
            aturBukti("");
            document.getElementById("pgSimpan").textContent = "Simpan";
            cekFormPengeluaran();
            document.getElementById("modalPengeluaran").classList.add("open");
            document.getElementById("pgNominal").focus();
        }

        function renderPilihKategori() {
            document.getElementById("pgKategoriPilih").innerHTML = KATEGORI_PENGELUARAN.map(function (k, i) {
                return '<button type="button" class="' + (k === kategoriDipilih ? 'on' : '') + '" onclick="pilihKategori(' + i + ')">' + (IKON_KATEGORI[k] || "💸") + ' ' + esc(k) + '</button>';
            }).join("");
        }

        function pilihKategori(i) { kategoriDipilih = KATEGORI_PENGELUARAN[i]; renderPilihKategori(); }

        function cekFormPengeluaran() {
            document.getElementById("pgSimpan").disabled =
                sedangUploadBukti || kasParseAngka(document.getElementById("pgNominal").value) <= 0;
        }

        function aturBukti(url) {
            buktiUrlForm = url;
            document.getElementById("pgBuktiKotak").innerHTML = url
                ? '<img src="' + esc(url) + '" alt="Bukti"><button type="button" class="bukti-hapus" title="Hapus foto" onclick="event.stopPropagation(); aturBukti(\'\')">×</button>'
                : '<span class="plus">📷</span>Tambah foto';
            document.getElementById("pgBuktiStatus").textContent = "";
            document.getElementById("pgBuktiFile").value = "";
        }

        function pilihBukti() {
            if (sedangUploadBukti || buktiUrlForm) return;
            document.getElementById("pgBuktiFile").click();
        }

        function uploadBukti(input) {
            const file = input.files[0];
            if (!file) return;
            const status = document.getElementById("pgBuktiStatus");
            sedangUploadBukti = true;
            cekFormPengeluaran();
            status.style.color = "#52606d";
            status.textContent = "Mengupload foto...";
            kasUploadBukti(file).then(function (url) {
                sedangUploadBukti = false;
                aturBukti(url);
                status.style.color = "#1e7d32";
                status.textContent = "Foto terupload ✓";
            }).catch(function (e) {
                sedangUploadBukti = false;
                input.value = "";
                status.style.color = "#c0392b";
                status.textContent = "Gagal upload: " + e.message;
            }).then(cekFormPengeluaran);
        }

        function simpanPengeluaran() {
            const err = document.getElementById("pgError");
            const tampilError = function (p) { err.textContent = p; err.style.display = "block"; };
            err.style.display = "none";
            if (sedangUploadBukti) return tampilError("Tunggu foto bukti selesai diupload.");
            const outlet = (currentUser.role === "kasir") ? currentUser.outlet
                : (tabAktif === "pengeluaran" ? document.getElementById("pgOutlet").value : outletDipilih);
            const nominal = kasParseAngka(document.getElementById("pgNominal").value);
            const keterangan = document.getElementById("pgKeterangan").value.trim();
            const dariLaci = bolehKelolaSemua() ? document.getElementById("pgDariLaci").checked : true;
            if (!outlet) return tampilError("Pilih outlet.");
            if (nominal <= 0) return tampilError("Isi jumlah pengeluaran.");

            const btn = document.getElementById("pgSimpan");
            btn.disabled = true; btn.textContent = "Menyimpan...";

            const cariSesi = dariLaci
                ? (sesiAktif && sesiAktif.data.outlet === outlet ? Promise.resolve(sesiAktif) : kasCariSesiAktif(db, outlet))
                : Promise.resolve(null);
            cariSesi.then(function (sesi) {
                if (dariLaci && !sesi) {
                    throw new Error("Belum ada shift berjalan di " + outlet + ", jadi belum ada laci kas. Buka dulu di layar Kasir" +
                        (bolehKelolaSemua() ? ", atau hilangkan centang \"dari laci\"." : "."));
                }
                return db.collection("pengeluaran").add({
                    outlet: outlet, tanggal: kasTanggalHariIni(),
                    kategori: kategoriDipilih, nominal: nominal, keterangan: keterangan,
                    buktiUrl: buktiUrlForm || "",
                    dariLaci: dariLaci, sesiKasId: sesi ? sesi.id : null,
                    status: "aktif",
                    dibuatUid: currentUser.uid || "", dibuatNama: currentUser.nama || "",
                    waktu: firebase.firestore.FieldValue.serverTimestamp()
                });
            }).then(function () {
                tutupModal("modalPengeluaran");
                // Tab Shift Sekarang diperbarui otomatis oleh pemantau pengeluaran
                if (tabAktif !== "shift") gantiTab(tabAktif);
            }).catch(function (error) {
                btn.textContent = "Simpan";
                cekFormPengeluaran();
                tampilError(error.message);
            });
        }

        function hapusPengeluaran(id) {
            db.collection("pengeluaran").doc(id).get().then(function (doc) {
                if (!doc.exists) throw new Error("Data tidak ditemukan.");
                const p = doc.data();
                let pesan = "Hapus pengeluaran " + p.kategori + " " + rp(p.nominal) + (p.keterangan ? " (" + p.keterangan + ")" : "") + "?";
                if (p.sesiKasId && (!sesiAktif || sesiAktif.id !== p.sesiKasId)) {
                    pesan += "\n\nCatatan: shift-nya mungkin sudah diakhiri. Angka di laporan shift yang sudah tersimpan tidak ikut berubah.";
                }
                if (!confirm(pesan)) return;
                return doc.ref.update({
                    status: "dihapus",
                    dihapusUid: currentUser.uid || "", dihapusNama: currentUser.nama || "",
                    waktuHapus: firebase.firestore.FieldValue.serverTimestamp()
                }).then(function () { if (tabAktif !== "shift") gantiTab(tabAktif); });
            }).catch(function (error) { alert("Gagal menghapus: " + error.message); });
        }

        /* Filter tanggal cepat, dipakai tab Pengeluaran & Rekap */
        function rentangPreset(preset) {
            const hariIni = kasTanggalHariIni();
            if (preset === "hari") return { dari: hariIni, sampai: hariIni };
            if (preset === "7") return { dari: tanggalMundur(6), sampai: hariIni };
            if (preset === "30") return { dari: tanggalMundur(29), sampai: hariIni };
            if (preset === "bulan") return { dari: hariIni.slice(0, 8) + "01", sampai: hariIni };
            return null;
        }

        function htmlFilterTanggal(f, fnPreset, fnCustom) {
            const preset = [["hari", "Hari ini"], ["7", "7 hari"], ["30", "30 hari"], ["bulan", "Bulan ini"], ["custom", "Pilih tanggal"]];
            return preset.map(function (p) {
                return '<button class="chip-f' + (f.preset === p[0] ? ' on' : '') + '" onclick="' + fnPreset + '(\'' + p[0] + '\')">' + p[1] + '</button>';
            }).join("") +
            (f.preset === "custom"
                ? '<input type="date" class="tgl-input" id="fDari" value="' + esc(f.dari) + '"> – <input type="date" class="tgl-input" id="fSampai" value="' + esc(f.sampai) + '">' +
                  '<button class="btn btn-kecil btn-primary" onclick="' + fnCustom + '()">Terapkan</button>'
                : '');
        }

        function ambilTanggalCustom(f) {
            const dari = document.getElementById("fDari").value, sampai = document.getElementById("fSampai").value;
            if (!dari || !sampai || dari > sampai) { alert("Tanggal \"dari\" harus sebelum atau sama dengan \"sampai\"."); return false; }
            f.dari = dari; f.sampai = sampai;
            return true;
        }

        function renderTabPengeluaran() {
            document.getElementById("isiTab").innerHTML =
                '<div class="filter-row">' + htmlFilterTanggal(filterPengeluaran, "presetPengeluaran", "customPengeluaran") + '</div>' +
                '<div id="isiPengeluaran"><div class="loading-state">Memuat pengeluaran...</div></div>';
            if (!document.querySelector(".fab-tambah")) {
                const fab = document.createElement("button");
                fab.className = "fab-tambah"; fab.type = "button";
                fab.innerHTML = '<span>+</span> Catat pengeluaran';
                fab.onclick = bukaModalPengeluaran;
                document.body.appendChild(fab);
            }
            muatPengeluaran();
        }

        function presetPengeluaran(p) {
            filterPengeluaran.preset = p;
            const r = rentangPreset(p);
            if (r) { filterPengeluaran.dari = r.dari; filterPengeluaran.sampai = r.sampai; }
            renderTabPengeluaran();
        }
        function customPengeluaran() { if (ambilTanggalCustom(filterPengeluaran)) muatPengeluaran(); }

        function muatPengeluaran() {
            const tujuan = document.getElementById("isiPengeluaran");
            tujuan.innerHTML = '<div class="loading-state">Memuat pengeluaran...</div>';
            const outlet = outletDipilih;
            const token = ++tokenMuat;
            const muatSesiBuka = outlet
                ? kasCariSesiAktif(db, outlet).then(function (s) { sesiAktif = s; sesiBukaPerOutlet[outlet] = s ? s.id : null; }).catch(function () {})
                : Promise.resolve();
            Promise.all([
                db.collection("pengeluaran")
                    .where("tanggal", ">=", filterPengeluaran.dari)
                    .where("tanggal", "<=", filterPengeluaran.sampai)
                    .get(),
                muatSesiBuka
            ]).then(function (h) {
                if (token !== tokenMuat) return;
                const daftar = [];
                h[0].forEach(function (doc) {
                    const d = doc.data({ serverTimestamps: "estimate" });
                    if (d.status === "dihapus") return;
                    if (outlet && d.outlet !== outlet) return;
                    d._id = doc.id;
                    d._waktu = kasToDate(d.waktu) || new Date(0);
                    daftar.push(d);
                });
                daftar.sort(function (a, b) { return b._waktu - a._waktu; });
                renderDaftarPengeluaran(daftar);
            }).catch(function (error) {
                if (token === tokenMuat) tujuan.innerHTML = '<div class="empty-state">Gagal memuat pengeluaran: ' + esc(error.message) + '</div>';
            });
        }

        function renderDaftarPengeluaran(daftar) {
            const tujuan = document.getElementById("isiPengeluaran");
            if (daftar.length === 0) {
                tujuan.innerHTML = '<div class="panel"><div class="kosong" style="padding:44px 0;"><div class="ikon">🧾</div>Belum ada pengeluaran di periode ini.<br>Tekan <b>+ Catat pengeluaran</b> di kanan bawah.</div></div>';
                return;
            }
            const perKategori = {};
            let total = 0, totalLaci = 0;
            daftar.forEach(function (p) {
                const n = Number(p.nominal) || 0;
                perKategori[p.kategori] = (perKategori[p.kategori] || 0) + n;
                total += n;
                if (p.dariLaci) totalLaci += n;
            });
            const kat = Object.keys(perKategori).sort(function (a, b) { return perKategori[b] - perKategori[a]; });
            const maks = perKategori[kat[0]] || 1;
            const semuaOutlet = !outletDipilih;

            // Kelompokkan per tanggal
            const perTanggal = {};
            daftar.forEach(function (p) { (perTanggal[p.tanggal] = perTanggal[p.tanggal] || []).push(p); });

            tujuan.innerHTML =
                '<div class="tile-row">' +
                    '<div class="tile"><div class="k">Total pengeluaran</div><div class="v" style="color:#C2410C;">' + rp(total) + '</div><div class="s">' + angka(daftar.length) + ' catatan</div></div>' +
                    '<div class="tile"><div class="k">Dari laci kas</div><div class="v">' + rp(totalLaci) + '</div><div class="s">Mengurangi kas akhir</div></div>' +
                    '<div class="tile"><div class="k">Di luar laci</div><div class="v">' + rp(total - totalLaci) + '</div><div class="s">Transfer / lainnya</div></div>' +
                '</div>' +
                '<div class="dua-kolom" style="margin-top:0;">' +
                    '<div class="panel">' +
                        '<div class="panel-judul"><h3>Daftar pengeluaran</h3></div>' +
                        Object.keys(perTanggal).sort().reverse().map(function (tg) {
                            const sub = perTanggal[tg].reduce(function (a, p) { return a + (Number(p.nominal) || 0); }, 0);
                            return '<div class="sub-judul" style="display:flex; justify-content:space-between;"><span>' + esc(fmtHariPanjang(tg)) + '</span><span>' + rp(sub) + '</span></div>' +
                                perTanggal[tg].map(function (p) { return htmlItemPengeluaran(p, semuaOutlet); }).join("");
                        }).join("") +
                    '</div>' +
                    '<div class="panel" style="align-self:start;">' +
                        '<div class="panel-judul"><h3>Per kategori</h3></div>' +
                        kat.map(function (k) {
                            return '<div class="kat-bar"><span class="nm">' + (IKON_KATEGORI[k] || "💸") + ' ' + esc(k) + '</span>' +
                                '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round(perKategori[k] * 100 / maks) + '%; background:#E0761A;"></div></div>' +
                                '<span class="v">' + angka(perKategori[k]) + '</span></div>';
                        }).join("") +
                    '</div>' +
                '</div>';
        }

        /* =====================================================
           REKAP SHIFT
           Ringkasan periode + daftar shift per hari. Klik satu shift
           untuk melihat detailnya tanpa pindah halaman.
        ====================================================== */
        let filterRekap = { preset: "7", dari: tanggalMundur(6), sampai: kasTanggalHariIni(), cari: "", hanyaSelisih: false };
        let daftarRekap = [];

        function renderTabRekap() {
            document.getElementById("isiTab").innerHTML =
                '<div class="filter-row">' + htmlFilterTanggal(filterRekap, "presetRekap", "customRekap") + '</div>' +
                '<div class="filter-row">' +
                    '<input type="text" class="cari-input" id="rkCari" style="flex:1; min-width:200px;" placeholder="🔍 Cari nama kasir..." value="' + esc(filterRekap.cari) + '" oninput="filterRekap.cari = this.value; renderRekap()">' +
                    '<button class="chip-f' + (filterRekap.hanyaSelisih ? ' on' : '') + '" onclick="filterRekap.hanyaSelisih = !filterRekap.hanyaSelisih; this.classList.toggle(\'on\'); renderRekap()">Hanya yang ada selisih</button>' +
                    '<button class="btn btn-kecil" style="height:32px;" onclick="unduhRekapCsv()">⬇ Unduh Excel (CSV)</button>' +
                '</div>' +
                '<div id="isiRekap"><div class="loading-state">Memuat rekap...</div></div>';
            muatRekap();
        }

        function presetRekap(p) {
            filterRekap.preset = p;
            const r = rentangPreset(p);
            if (r) { filterRekap.dari = r.dari; filterRekap.sampai = r.sampai; }
            renderTabRekap();
        }
        function customRekap() { if (ambilTanggalCustom(filterRekap)) muatRekap(); }

        function muatRekap() {
            const tujuan = document.getElementById("isiRekap");
            const outlet = outletDipilih;
            const token = ++tokenMuat;
            db.collection("sesi_kas")
                .where("tanggal", ">=", filterRekap.dari)
                .where("tanggal", "<=", filterRekap.sampai)
                .get()
                .then(function (snap) {
                    if (token !== tokenMuat) return;
                    const daftar = [];
                    snap.forEach(function (doc) {
                        const d = doc.data({ serverTimestamps: "estimate" });
                        if (outlet && d.outlet !== outlet) return;
                        daftar.push({ id: doc.id, data: d, _buka: kasToDate(d.waktuBuka) || new Date(0), _tutup: kasToDate(d.waktuTutup) });
                    });
                    daftar.sort(function (a, b) { return b._buka - a._buka; });
                    daftarRekap = daftar;
                    renderRekap();
                }).catch(function (error) {
                    if (token === tokenMuat) tujuan.innerHTML = '<div class="empty-state">Gagal memuat rekap: ' + esc(error.message) + '</div>';
                });
        }

        function rekapTersaring() {
            const kunci = filterRekap.cari.trim().toLowerCase();
            return daftarRekap.filter(function (s) {
                if (filterRekap.hanyaSelisih && !(s.data.status === "tutup" && Number(s.data.selisih))) return false;
                if (!kunci) return true;
                return ((s.data.dibukaNama || "") + " " + (s.data.ditutupNama || "")).toLowerCase().indexOf(kunci) !== -1;
            });
        }

        function renderRekap() {
            const tujuan = document.getElementById("isiRekap");
            if (!tujuan) return;
            const daftar = rekapTersaring();
            const selesai = daftar.filter(function (s) { return s.data.status === "tutup"; });
            let tunai = 0, keluar = 0, selisih = 0, bermasalah = 0, kurang = 0;
            selesai.forEach(function (s) {
                tunai += Number(s.data.penjualanTunai) || 0;
                keluar += Number(s.data.totalPengeluaran) || 0;
                const x = Number(s.data.selisih) || 0;
                selisih += x;
                if (x !== 0) bermasalah++;
                if (x < 0) kurang += -x;
            });
            const sTotal = infoSelisih(selisih);

            let html =
                '<div class="tile-row">' +
                    '<div class="tile"><div class="k">Jumlah shift</div><div class="v">' + angka(daftar.length) + '</div><div class="s">' + angka(selesai.length) + ' selesai · ' + angka(daftar.length - selesai.length) + ' berjalan</div></div>' +
                    '<div class="tile"><div class="k">Penjualan tunai</div><div class="v">' + rp(tunai) + '</div><div class="s">Shift yang sudah selesai</div></div>' +
                    '<div class="tile"><div class="k">Pengeluaran</div><div class="v" style="color:#C2410C;">' + rp(keluar) + '</div><div class="s">Dari laci kas</div></div>' +
                    '<div class="tile"><div class="k">Total selisih</div><div class="v"><span class="badge ' + sTotal.kelas + '" style="font-size:14px;">' + sTotal.teks + '</span></div>' +
                        '<div class="s">' + (bermasalah ? angka(bermasalah) + ' shift ada selisih' + (kurang ? ' · kurang total ' + rp(kurang) : '') : 'Semua shift pas 👍') + '</div></div>' +
                '</div>';

            if (daftar.length === 0) {
                tujuan.innerHTML = html + '<div class="panel"><div class="kosong" style="padding:40px 0;"><div class="ikon">📋</div>' +
                    (daftarRekap.length ? 'Tidak ada shift yang cocok dengan filter.' : 'Belum ada shift di periode ini.') + '</div></div>';
                return;
            }

            const semuaOutlet = !outletDipilih;
            const perTanggal = {};
            daftar.forEach(function (s) { (perTanggal[s.data.tanggal] = perTanggal[s.data.tanggal] || []).push(s); });
            Object.keys(perTanggal).sort().reverse().forEach(function (tg) {
                const isi = perTanggal[tg];
                let selHari = 0;
                isi.forEach(function (s) { if (s.data.status === "tutup") selHari += Number(s.data.selisih) || 0; });
                html += '<div class="hari"><div class="hari-head"><span class="tg">' + esc(fmtHariPanjang(tg)) + '</span>' +
                    '<span class="rs">' + angka(isi.length) + ' shift · selisih ' + badgeSelisih(selHari) + '</span></div>' +
                    isi.map(function (s) { return htmlKartuShift(s, semuaOutlet); }).join("") + '</div>';
            });
            tujuan.innerHTML = html;
        }

        function htmlKartuShift(s, semuaOutlet) {
            const d = s.data, selesai = d.status === "tutup";
            const idx = daftarRekap.indexOf(s);
            const jenis = !selesai ? '' : (d.jenisTutup === "shift" ? '<span class="tag tag-shift">Ganti shift</span>' : '<span class="tag tag-toko">Tutup toko</span>');
            const kasir = (d.dibukaNama || "-") + (selesai && d.ditutupNama && d.ditutupNama !== d.dibukaNama ? " → " + d.ditutupNama : "");
            return '<div class="shift-card" id="kartu_' + idx + '">' +
                '<div class="shift-row" onclick="bukaTutupDetail(' + idx + ')">' +
                    '<div><div class="jam">' + esc(fmtJam(s._buka)) + ' – ' + (selesai ? esc(fmtJam(s._tutup)) : '…') + '</div>' +
                        '<div class="kecil">' + (semuaOutlet ? esc(d.outlet) : (selesai ? 'Selesai' : 'Berjalan')) + '</div></div>' +
                    '<div><div class="lbl">Kasir</div><div class="val">' + esc(kasir) + jenis + '</div></div>' +
                    '<div class="col-hide"><div class="lbl">Kas awal</div><div class="val">' + angka(d.kasAwal) + '</div></div>' +
                    '<div class="col-hide"><div class="lbl">Seharusnya</div><div class="val">' + (selesai ? angka(d.kasSeharusnya) : '-') + '</div></div>' +
                    '<div class="col-hide"><div class="lbl">Dihitung kasir</div><div class="val">' + (selesai ? angka(d.kasAkhir) : '-') + '</div></div>' +
                    '<div>' + (selesai ? badgeSelisih(d.selisih) : '<span class="badge b-jalan">● Berjalan</span>') + '</div>' +
                    '<div class="chev">›</div>' +
                '</div>' +
                '<div class="shift-detail" id="detail_' + idx + '"></div>' +
            '</div>';
        }

        function bukaTutupDetail(idx) {
            const kartu = document.getElementById("kartu_" + idx);
            const s = daftarRekap[idx];
            if (!kartu || !s) return;
            if (kartu.classList.toggle("buka") === false) return;
            const tempat = document.getElementById("detail_" + idx);
            tempat.innerHTML = '<div class="loading-state" style="padding:10px 0;">Memuat detail...</div>';
            kasMuatPengeluaranSesi(db, s.id).catch(function () { return []; }).then(function (pengeluaran) {
                const d = s.data, selesai = d.status === "tutup";
                const r = ringkasanDariDokumen(s, pengeluaran);
                const per = r.perMetode;
                const metode = Object.keys(per).filter(function (m) { return per[m]; });
                const totalPg = selesai ? r.totalPengeluaran : pengeluaran.reduce(function (a, p) { return a + (Number(p.nominal) || 0); }, 0);
                tempat.innerHTML =
                    '<div class="detail-grid">' +
                        '<div><div class="sub-judul" style="margin-top:0;">Kas laci</div>' +
                            '<div class="dl-row"><span>Kas awal</span><b>' + rp(r.kasAwal) + '</b></div>' +
                            '<div class="dl-row"><span>+ Tunai masuk</span><b>' + (selesai ? rp(r.penjualanTunai) : '-') + '</b></div>' +
                            '<div class="dl-row"><span>− Pengeluaran</span><b>' + rp(totalPg) + '</b></div>' +
                            '<div class="dl-row"><span>Seharusnya</span><b>' + (selesai ? rp(r.kasSeharusnya) : '-') + '</b></div>' +
                            '<div class="dl-row"><span>Dihitung kasir</span><b>' + (selesai ? rp(d.kasAkhir) : '-') + '</b></div>' +
                            (d.rincianPecahan ? '<div class="kecil">Per pecahan: ' + esc(Object.keys(d.rincianPecahan).sort(function (a, b) { return b - a; }).map(function (n) { return d.rincianPecahan[n] + "×" + angka(n); }).join(", ")) + '</div>' : '') +
                        '</div>' +
                        '<div><div class="sub-judul" style="margin-top:0;">Penjualan (' + angka(r.jumlahTrx) + ' trx)</div>' +
                            (metode.length ? metode.map(function (m) { return '<div class="dl-row"><span>' + esc(m) + '</span><b>' + rp(per[m]) + '</b></div>'; }).join("") : '<div class="kecil">Belum ada penjualan.</div>') +
                        '</div>' +
                        '<div><div class="sub-judul" style="margin-top:0;">Pengeluaran</div>' +
                            (pengeluaran.length ? pengeluaran.map(function (p) {
                                return '<div class="dl-row"><span>' + esc(p.kategori) + (p.keterangan ? ' <span class="kecil" style="display:inline;">' + esc(p.keterangan) + '</span>' : '') + '</span><b>' + angka(p.nominal) + '</b></div>';
                            }).join("") : '<div class="kecil">Tidak ada.</div>') +
                        '</div>' +
                    '</div>' +
                    (d.catatan ? '<div class="hint-text" style="font-size:12px; color:#374151; background:#F4F6FA; border-radius:8px; padding:8px 10px;">📝 ' + esc(d.catatan) + '</div>' : '') +
                    (selesai ? '<div style="margin-top:12px;"><button class="btn btn-kecil" onclick="cetakDariRekap(' + idx + ')">🖨 Cetak laporan</button></div>' : '');
                s._pengeluaran = pengeluaran;
            });
        }

        function ringkasanDariDokumen(s, pengeluaran) {
            const d = s.data;
            return {
                kasAwal: Number(d.kasAwal) || 0,
                perMetode: d.penjualanPerMetodeAkhir || d.penjualanPerMetode || {},
                jumlahTrx: d.jumlahTrxAkhir !== undefined ? d.jumlahTrxAkhir : (Number(d.jumlahTrx) || 0),
                penjualanTunai: Number(d.penjualanTunai) || 0,
                penjualanNonTunai: Number(d.penjualanNonTunai) || 0,
                pengeluaran: pengeluaran || [],
                totalPengeluaran: Number(d.totalPengeluaran) || 0,
                kasSeharusnya: Number(d.kasSeharusnya) || 0
            };
        }

        function cetakDariRekap(idx) {
            const s = daftarRekap[idx];
            if (s) tampilDetailSesi(s, ringkasanDariDokumen(s, s._pengeluaran));
        }

        function unduhRekapCsv() {
            const daftar = rekapTersaring();
            if (daftar.length === 0) { alert("Tidak ada data untuk diunduh."); return; }
            const kol = ["Tanggal", "Outlet", "Mulai", "Selesai", "Jenis", "Kasir awal", "Kasir akhir", "Kas awal", "Penjualan tunai",
                "Penjualan non-tunai", "Pengeluaran", "Kas seharusnya", "Kas akhir (dihitung)", "Selisih", "Catatan"];
            const sel = function (v) { v = String(v == null ? "" : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
            const baris = daftar.slice().reverse().map(function (s) {
                const d = s.data, selesai = d.status === "tutup";
                return [d.tanggal, d.outlet, fmtWaktu(s._buka), selesai ? fmtWaktu(s._tutup) : "Berjalan",
                    selesai ? (d.jenisTutup === "shift" ? "Ganti shift" : "Tutup toko") : "",
                    d.dibukaNama || "", selesai ? (d.ditutupNama || "") : "", d.kasAwal || 0,
                    selesai ? d.penjualanTunai : "", selesai ? d.penjualanNonTunai : "", selesai ? d.totalPengeluaran : "",
                    selesai ? d.kasSeharusnya : "", selesai ? d.kasAkhir : "", selesai ? d.selisih : "", d.catatan || ""].map(sel).join(";");
            });
            const isi = "﻿" + kol.join(";") + "\n" + baris.join("\n");
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([isi], { type: "text/csv;charset=utf-8" }));
            a.download = "rekap-shift_" + (outletDipilih || "semua-outlet").replace(/[^a-zA-Z0-9-]/g, "-") + "_" + filterRekap.dari + "_" + filterRekap.sampai + ".csv";
            document.body.appendChild(a); a.click(); a.remove();
        }

        /* ---------- Laporan shift (modal & cetak 58mm) ---------- */
        function htmlLaporanSesi(sesi, r) {
            const d = sesi.data;
            const selesai = d.status === "tutup";
            const judul = !selesai ? "LAPORAN SHIFT (BERJALAN)" : (d.jenisTutup === "shift" ? "LAPORAN AKHIR SHIFT" : "LAPORAN TUTUP TOKO");
            const baris = function (k, v, tebal) { return '<div class="rc-row' + (tebal ? ' tebal' : '') + '"><span>' + k + '</span><span>' + v + '</span></div>'; };
            let h = '<div class="rc-judul">Oma Opa ' + esc(d.outlet) + '</div>' +
                '<div class="rc-tengah">' + judul + '</div>' +
                '<div class="rc-hr"></div>' +
                baris("Tanggal", esc(fmtTanggal(d.tanggal))) +
                baris("Mulai", esc(fmtWaktu(kasToDate(d.waktuBuka))) + " · " + esc(d.dibukaNama || "-")) +
                (selesai ? baris(d.jenisTutup === "shift" ? "Akhir shift" : "Tutup", esc(fmtWaktu(kasToDate(d.waktuTutup))) + " · " + esc(d.ditutupNama || "-")) : baris("Dicetak", esc(fmtWaktu(new Date())))) +
                baris("Jumlah transaksi", angka(r.jumlahTrx)) +
                '<div class="rc-hr"></div>' +
                '<div class="rc-sub">Penjualan</div>';
            const metode = Object.keys(r.perMetode).sort(function (a, b) { return a === "Tunai" ? -1 : b === "Tunai" ? 1 : a.localeCompare(b); });
            if (metode.length === 0) h += baris("Tunai", rp(0));
            metode.forEach(function (m) { h += baris(esc(m), rp(r.perMetode[m])); });
            h += baris("Total penjualan", rp(r.penjualanTunai + r.penjualanNonTunai), true);
            h += '<div class="rc-hr"></div><div class="rc-sub">Pengeluaran</div>';
            if (r.pengeluaran.length === 0) h += '<div class="rc-row"><span>-</span><span></span></div>';
            r.pengeluaran.forEach(function (p) { h += baris(esc(p.kategori) + (p.keterangan ? ' <span style="color:#8A95A5;">' + esc(p.keterangan) + '</span>' : ''), rp(p.nominal)); });
            h += baris("Total pengeluaran", rp(r.totalPengeluaran), true);
            h += '<div class="rc-hr"></div><div class="rc-sub">Kas laci</div>' +
                baris("Kas awal", rp(r.kasAwal)) +
                baris("+ Tunai masuk", rp(r.penjualanTunai)) +
                baris("− Pengeluaran", rp(r.totalPengeluaran)) +
                baris("Seharusnya", rp(r.kasSeharusnya), true);
            if (selesai) {
                h += baris("Dihitung kasir", rp(d.kasAkhir), true) +
                    baris("Selisih", Number(d.selisih) === 0 ? "Pas" : (Number(d.selisih) > 0 ? "Lebih " : "Kurang ") + rp(Math.abs(Number(d.selisih) || 0)), true);
            }
            if (d.catatan) h += '<div class="rc-hr"></div><div class="rc-row"><span>Catatan: ' + esc(d.catatan) + '</span></div>';
            return h;
        }

        function tampilDetailSesi(sesi, r) {
            laporanTerbuka = { sesi: sesi, ringkasan: r };
            const d = sesi.data;
            document.getElementById("detailSesiJudul").textContent = d.status !== "tutup" ? "Laporan Shift Berjalan" : (d.jenisTutup === "shift" ? "Laporan Akhir Shift" : "Laporan Tutup Toko");
            document.getElementById("detailSesiIsi").innerHTML = '<div class="lap-kertas">' + htmlLaporanSesi(sesi, r) + '</div>';
            document.getElementById("modalDetailSesi").classList.add("open");
        }

        function cetakLaporanSesi() {
            if (!laporanTerbuka) return;
            document.getElementById("areaCetak").innerHTML = htmlLaporanSesi(laporanTerbuka.sesi, laporanTerbuka.ringkasan);
            document.body.classList.add("mode-cetak");
            window.print();
            document.body.classList.remove("mode-cetak");
        }
    </script>
</body>
</html>
