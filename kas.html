<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Opa POS - Shift & Kas</title>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="roles.js?v=20261027a"></script>
    <script src="kas.js?v=20261027b"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2937; }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 190px; flex-shrink: 0; background: #12305C;
            border-right: 1px solid #0B2245; padding: 20px 14px;
            display: flex; flex-direction: column;
        }
        .sidebar .brand { font-weight: 800; font-size: 15px; color: #ffffff; margin-bottom: 18px; }
        .sidebar-logo { display: block; max-width: 140px; height: auto; margin-bottom: 18px; }
        .sidebar .nav-item { display: block; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #B8C7E0; text-decoration: none; margin-bottom: 4px; }
        .sidebar .nav-item:hover { background: #1B3F73; }
        .sidebar .nav-item.active { background: #ffffff; color: #12305C; font-weight: 700; }
        .sidebar .nav-item.disabled { color: #5A6B8C; pointer-events: none; }
        .sidebar .nav-divider { border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0 10px; }
        .sidebar .nav-label { font-size: 10px; font-weight: 700; color: #8AA0C7; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
        .sidebar .user-block { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
        .sidebar .user-name { font-size: 12px; font-weight: 700; color: #ffffff; }
        .sidebar .user-role { font-size: 10px; color: #8AA0C7; margin-bottom: 8px; }
        .sidebar .logout-link { font-size: 11px; color: #FF8A80; background: none; border: none; cursor: pointer; padding: 0; }

        .content { flex: 1; min-width: 0; padding: 22px 26px 80px; background: #F4F6FA; }
        .wrap { max-width: 1120px; }
        @media (max-width: 800px) { .content { padding: 16px 14px 80px; } }

        /* ===== Header & tab ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .top-bar h2 { font-size: 18px; font-weight: 800; color: #12305C; }
        .top-sub { font-size: 11.5px; color: #6b7280; margin-top: 3px; }
        .seg { display: inline-flex; background: #E3E8F0; border-radius: 12px; padding: 4px; gap: 2px; }
        .seg button {
            border: none; background: none; padding: 9px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 700;
            color: #52606d; cursor: pointer; font-family: inherit; white-space: nowrap;
        }
        .seg button.on { background: #ffffff; color: #12305C; box-shadow: 0 1px 4px rgba(18,48,92,0.15); }
        @media (max-width: 640px) {
            .top-bar > div { width: 100%; }
            .seg { width: 100%; overflow-x: auto; }
            .seg button { flex: 1; padding: 9px 10px; }
            .tile-row { grid-template-columns: 1fr 1fr; }
            .tile .v { font-size: 16px; }
            .hero { padding: 18px; }
            .hero-aksi { width: 100%; }
            .hero-aksi .btn-hero { flex: 1; justify-content: center; padding: 0 12px; }
        }
        select.outlet-select, input.tgl-input, .cari-input {
            height: 36px; border: 1px solid #d1d9e6; border-radius: 9px; padding: 0 10px; font-size: 12px; background: #ffffff; font-family: inherit;
        }

        /* ===== Umum ===== */
        .panel { background: #ffffff; border-radius: 16px; padding: 18px; box-shadow: 0 1px 3px rgba(18,48,92,0.08); }
        .panel-judul { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
        .panel-judul h3 { font-size: 14px; font-weight: 800; color: #1f2937; }
        .panel-judul .sub { font-size: 11px; color: #8A95A5; font-weight: 400; margin-left: 6px; }
        .dua-kolom { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-top: 16px; }
        @media (max-width: 1000px) { .dua-kolom { grid-template-columns: 1fr; } }
        .loading-state, .empty-state { text-align: center; color: #6b7280; font-size: 12px; padding: 30px 0; }
        .hint-text { font-size: 10.5px; color: #8A95A5; margin-top: 8px; line-height: 1.5; }
        .kecil { font-size: 10.5px; color: #8A95A5; margin-top: 2px; }

        .btn {
            height: 36px; padding: 0 14px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; font-family: inherit; border: 1px solid #d1d9e6; background: #ffffff; color: #52606d;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
        }
        .btn-primary { background: #12305C; border-color: #12305C; color: #ffffff; }
        .btn-danger { color: #B03A2E; }
        .btn-kecil { height: 28px; padding: 0 10px; font-size: 11px; border-radius: 8px; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ===== Hero laci kas ===== */
        .hero {
            background: linear-gradient(135deg, #12305C 0%, #1D4C8F 100%); border-radius: 20px; padding: 22px 24px; color: #ffffff;
            box-shadow: 0 10px 28px rgba(18,48,92,0.25);
        }
        .hero-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #C9D6EC; }
        .titik { width: 9px; height: 9px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 0 4px rgba(74,222,128,0.25); animation: denyut 1.8s infinite; }
        @keyframes denyut { 50% { box-shadow: 0 0 0 7px rgba(74,222,128,0.05); } }
        .hero-status b { color: #ffffff; }
        .hero-isi { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
        .hero-label { font-size: 12.5px; color: #C9D6EC; }
        .hero-angka { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
        @media (max-width: 560px) { .hero-angka { font-size: 32px; } }
        .rumus { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .rumus .bagian { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 12px; }
        .rumus .bagian .k { font-size: 10px; color: #C9D6EC; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
        .rumus .bagian .v { font-size: 15px; font-weight: 800; margin-top: 2px; }
        .rumus .op { font-size: 18px; font-weight: 800; color: #9FB4D6; }
        .hero-aksi { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-hero {
            height: 46px; padding: 0 20px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-hero.putih { background: #ffffff; color: #12305C; border: none; }
        .btn-hero.merah { background: #E5534B; color: #ffffff; border: none; }
        .btn-hero.garis { background: transparent; color: #ffffff; border: 1.5px solid rgba(255,255,255,0.5); }
        .btn-hero:hover { filter: brightness(1.05); }

        /* ===== Penjualan ===== */
        .angka-besar { font-size: 26px; font-weight: 800; color: #1f2937; }
        .meta-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: #6b7280; margin-top: 4px; }
        .meta-row b { color: #1f2937; }
        .bar-list { margin-top: 16px; }
        .bar-item { margin-bottom: 12px; }
        .bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
        .bar-head span:first-child { font-weight: 700; color: #374151; }
        .bar-head .laci { font-size: 9.5px; font-weight: 800; color: #9A6B1C; background: #FFF1D6; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
        .bar-track { height: 9px; background: #EEF1F5; border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; }
        .sub-judul { font-size: 11px; font-weight: 800; color: #8A95A5; text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; }
        .top-produk { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #F0F2F6; font-size: 12.5px; }
        .top-produk:first-of-type { border-top: none; }
        .rank { width: 22px; height: 22px; border-radius: 7px; background: #E8EEF9; color: #12305C; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .top-produk .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top-produk .q { font-weight: 800; color: #12305C; }

        /* ===== Pengeluaran ===== */
        .pg-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #F0F2F6; }
        .pg-item:first-child { border-top: none; }
        .pg-ikon { width: 36px; height: 36px; border-radius: 10px; background: #FFF1E6; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
        .pg-info { flex: 1; min-width: 0; }
        .pg-info .t { font-size: 12.5px; font-weight: 700; color: #1f2937; }
        .pg-info .m { font-size: 10.5px; color: #8A95A5; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pg-nominal { font-size: 13px; font-weight: 800; color: #C2410C; white-space: nowrap; }
        .pg-aksi { display: flex; gap: 6px; align-items: center; }
        .link-bukti { color: #2F6FD6; font-weight: 700; text-decoration: none; font-size: 13px; }
        .btn-ikon { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #E5E7EB; background: #fff; color: #B03A2E; cursor: pointer; font-size: 13px; }
        .kosong { text-align: center; color: #9aa5b1; font-size: 12px; padding: 26px 0; line-height: 1.6; }
        .kosong .ikon { font-size: 34px; opacity: 0.5; }
        .kat-bar { display: grid; grid-template-columns: 150px 1fr 90px; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 8px; }
        @media (max-width: 560px) { .kat-bar { grid-template-columns: 110px 1fr 80px; } }
        .kat-bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #374151; }
        .kat-bar .v { text-align: right; font-weight: 800; }
        .fab-tambah {
            position: fixed; right: 26px; bottom: 26px; height: 52px; padding: 0 20px; border-radius: 26px; border: none;
            background: #E0761A; color: #ffffff; font-size: 13.5px; font-weight: 800; cursor: pointer; z-index: 10;
            box-shadow: 0 8px 20px rgba(224,118,26,0.4); font-family: inherit; display: flex; align-items: center; gap: 8px;
        }
        .fab-tambah span { font-size: 22px; line-height: 1; }

        /* ===== Filter chips ===== */
        .filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
        .chip-f { height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid #d1d9e6; background: #ffffff; font-size: 12px; font-weight: 700; color: #52606d; cursor: pointer; font-family: inherit; }
        .chip-f.on { background: #12305C; border-color: #12305C; color: #ffffff; }

        /* ===== Rekap shift ===== */
        .tile-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .tile { background: #ffffff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(18,48,92,0.08); }
        .tile .k { font-size: 10.5px; font-weight: 800; color: #8A95A5; text-transform: uppercase; letter-spacing: 0.03em; }
        .tile .v { font-size: 20px; font-weight: 800; margin-top: 6px; color: #1f2937; }
        .tile .s { font-size: 10.5px; color: #8A95A5; margin-top: 3px; }
        .hari { margin-bottom: 16px; }
        .hari-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 4px 8px; flex-wrap: wrap; }
        .hari-head .tg { font-size: 13px; font-weight: 800; color: #12305C; }
        .hari-head .rs { font-size: 11px; color: #6b7280; }
        .shift-card { background: #ffffff; border-radius: 14px; box-shadow: 0 1px 3px rgba(18,48,92,0.08); margin-bottom: 8px; overflow: hidden; }
        .shift-row { display: grid; grid-template-columns: 120px 1.3fr 1fr 1fr 1fr 130px 24px; gap: 10px; align-items: center; padding: 13px 16px; cursor: pointer; }
        .shift-row:hover { background: #F8FAFD; }
        @media (max-width: 900px) {
            .shift-row { grid-template-columns: 1fr 1fr; }
            .shift-row .col-hide { display: none; }
        }
        .shift-row .jam { font-size: 13px; font-weight: 800; color: #1f2937; }
        .shift-row .lbl { font-size: 10px; color: #8A95A5; font-weight: 700; text-transform: uppercase; }
        .shift-row .val { font-size: 12.5px; font-weight: 700; color: #1f2937; margin-top: 2px; }
        .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 10px; white-space: nowrap; }
        .b-pas { background: #E7F6ED; color: #1E7D32; }
        .b-kurang { background: #FDEAEA; color: #B03A2E; }
        .b-lebih { background: #FFF1D6; color: #9A6B1C; }
        .b-jalan { background: #E8EEF9; color: #1F4FC9; }
        .tag { display: inline-block; font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
        .tag-shift { background: #E8EEF9; color: #1F4FC9; }
        .tag-toko { background: #12305C; color: #ffffff; }
        .shift-detail { display: none; border-top: 1px solid #F0F2F6; padding: 14px 16px 16px; background: #FBFCFE; }
        .shift-card.buka .shift-detail { display: block; }
        .chev { color: #8A95A5; transition: transform 0.15s; font-size: 16px; text-align: center; }
        .shift-card.buka .chev { transform: rotate(90deg); }
        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        @media (max-width: 800px) { .detail-grid { grid-template-columns: 1fr; } }
        .dl-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; color: #52606d; }
        .dl-row b { color: #1f2937; white-space: nowrap; }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 48, 92, 0.4); align-items: center; justify-content: center; z-index: 20; padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #ffffff; border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; max-height: 92vh; overflow: auto; }
        .modal-box.lebar { max-width: 640px; }
        .modal-box h3 { font-size: 16px; margin-bottom: 4px; color: #12305C; }
        .modal-sub { font-size: 11.5px; color: #6b7280; margin-bottom: 6px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
        .modal-actions .btn { flex: 1; height: 44px; font-size: 13px; }
        .fld-in, .fld-sel { width: 100%; height: 40px; border: 1px solid #d1d9e6; border-radius: 10px; padding: 0 12px; font-size: 12.5px; font-family: inherit; background: #ffffff; }
        textarea.fld-in { height: 64px; padding: 9px 12px; resize: vertical; }
        .fld-lbl { font-size: 11.5px; font-weight: 700; color: #1f2937; margin: 12px 0 5px; }
        .cek-row { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; color: #374151; margin-top: 12px; line-height: 1.45; cursor: pointer; }
        .cek-row input { width: 16px; height: 16px; accent-color: #12305C; margin-top: 1px; flex-shrink: 0; }
        .msg-box { font-size: 11.5px; padding: 9px 11px; border-radius: 8px; margin-top: 10px; display: none; }
        .msg-error { background: #fdeaea; color: #c0392b; }
        .kat-pilih { display: flex; flex-wrap: wrap; gap: 6px; max-height: 128px; overflow: auto; padding: 2px; }
        .kat-pilih button { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid #d1d9e6; background: #fff; font-size: 11.5px; color: #374151; cursor: pointer; font-family: inherit; }
        .kat-pilih button.on { background: #12305C; border-color: #12305C; color: #fff; font-weight: 700; }
        .uang-input { height: 54px; border: 2px solid #12305C; border-radius: 12px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
        .uang-input span { font-size: 13px; color: #8A95A5; font-weight: 700; }
        .uang-input input { flex: 1; border: none; outline: none; font-size: 24px; font-weight: 800; text-align: right; font-family: inherit; min-width: 0; color: #1f2937; background: none; }
        .bukti-kotak {
            width: 92px; height: 82px; border: 1.5px dashed #2F6FD6; border-radius: 10px; background: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden;
            flex-direction: column; gap: 4px; font-size: 10px; color: #2F6FD6; font-weight: 700;
        }
        .bukti-kotak .plus { font-size: 22px; line-height: 1; }
        .bukti-kotak img { width: 100%; height: 100%; object-fit: cover; }
        .bukti-hapus { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; cursor: pointer; line-height: 20px; padding: 0; }
        .bukti-status { font-size: 10.5px; color: #52606d; margin-top: 6px; }

        /* Langkah tutup kas */
        .langkah { display: flex; gap: 6px; margin: 12px 0 16px; }
        .langkah div { flex: 1; height: 5px; border-radius: 3px; background: #E3E8F0; }
        .langkah div.on { background: #12305C; }
        .mode-hitung { display: inline-flex; background: #EEF1F5; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
        .mode-hitung button { border: none; background: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #52606d; cursor: pointer; font-family: inherit; }
        .mode-hitung button.on { background: #fff; color: #12305C; box-shadow: 0 1px 3px rgba(18,48,92,0.15); }
        .total-hitung { display: flex; justify-content: space-between; align-items: center; background: #12305C; color: #fff; border-radius: 12px; padding: 12px 16px; margin-top: 12px; }
        .total-hitung .k { font-size: 11.5px; color: #C9D6EC; }
        .total-hitung .v { font-size: 22px; font-weight: 800; }
        .hasil-cek { border-radius: 16px; padding: 18px; text-align: center; }
        .hasil-cek .ikon { font-size: 34px; }
        .hasil-cek .j { font-size: 18px; font-weight: 800; margin-top: 4px; }
        .hasil-cek .d { font-size: 12px; margin-top: 4px; }
        .hc-pas { background: #E7F6ED; color: #1E7D32; }
        .hc-kurang { background: #FDEAEA; color: #B03A2E; }
        .hc-lebih { background: #FFF1D6; color: #9A6B1C; }
        .banding { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .banding > div { background: #F4F6FA; border-radius: 12px; padding: 12px; }
        .banding .k { font-size: 10.5px; color: #8A95A5; font-weight: 700; }
        .banding .v { font-size: 17px; font-weight: 800; margin-top: 3px; }

        /* Laporan (detail & cetak) */
        .lap-kertas { background: #F7F8FA; border: 1px solid #e8ecf1; border-radius: 10px; padding: 14px; }
        .rc-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: #374151; padding: 2.5px 0; }
        .rc-row.tebal { font-weight: 800; color: #1f2937; }
        .rc-hr { border-top: 1px dashed #b8c0cc; margin: 8px 0; }
        .rc-judul { text-align: center; font-size: 12.5px; font-weight: 800; color: #1f2937; }
        .rc-tengah { text-align: center; font-size: 10.5px; color: #8A95A5; }
        .rc-sub { font-size: 10px; font-weight: 800; color: #8A95A5; text-transform: uppercase; margin: 4px 0 2px; }

        #areaCetak { display: none; }
        @media print {
            body.mode-cetak .app-layout, body.mode-cetak .modal-overlay, body.mode-cetak .fab-tambah { display: none !important; }
            body.mode-cetak #areaCetak { display: block !important; width: 58mm; padding: 2mm; font-family: Arial, Helvetica, sans-serif; }
            body.mode-cetak #areaCetak * { color: #000 !important; background: none !important; }
            body.mode-cetak #areaCetak .rc-row { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar" id="sidebarContainer"></div>

        <div class="content" id="mainContent">
            <div class="loading-state">Memeriksa akses...</div>
        </div>
    </div>

    <!-- Catat pengeluaran -->
    <div class="modal-overlay" id="modalPengeluaran">
        <div class="modal-box">
            <h3>Catat Pengeluaran</h3>
            <div class="modal-sub" id="pgSub">Mengurangi uang di laci kas shift ini.</div>
            <div id="pgOutletWrap">
                <div class="fld-lbl">Outlet</div>
                <select class="fld-sel" id="pgOutlet"></select>
            </div>
            <div class="fld-lbl">Jumlah<span style="color:#B03A2E;">*</span></div>

            <div class="fld-lbl">Foto bukti / nota <span style="font-weight:400; color:#8A95A5;">(opsional)</span></div>
            <div class="bukti-kotak" id="pgBuktiKotak" onclick="pilihBukti()"><span class="plus">📷</span>Tambah foto</div>

                <label class="cek-row"><input type="checkbox" id="pgDariLaci" checked>
                    <span><b>Uang diambil dari laci kas</b><br><span style="color:#6b7280;">Hilangkan centang kalau dibayar di luar laci (transfer, dll).</span></span></label>
            </div>
            <div class="msg-box msg-error" id="pgError"></div>
            <div class="modal-actions">
                <button class="btn" onclick="tutupModal('modalPengeluaran')">Batal</button>
                <button class="btn btn-primary" id="pgSimpan" style="flex:1.4;" onclick="simpanPengeluaran()" disabled>Simpan</button>
            </div>
        </div>
    </div>

    <!-- Akhiri shift / tutup toko (3 langkah) -->
    <div class="modal-overlay" id="modalTutup">
        <div class="modal-box lebar">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <div><h3 id="tutupJudul">Tutup Toko</h3><div class="modal-sub" id="tutupSub" style="margin:0;"></div></div>
                <button class="btn btn-kecil" style="width:30px; padding:0; font-size:15px;" onclick="batalTutup()">&times;</button>
            </div>
